<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>موقف - لوحة الكابتن</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />

  <style>
    body { font-family: system-ui, -apple-system, sans-serif; padding: 12px; background: #f4f4f9; direction: rtl; text-align: right; margin: 0; }
    .card { background: #fff; padding: 15px; border-radius: 12px; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    input, select, button { width: 100%; padding: 12px; margin: 6px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 15px; }
    button { background: #28a745; color: white; border: none; font-weight: bold; cursor: pointer; }
    button:hover { background: #218838; }
    .btn-secondary { background: #007bff; }
    .btn-danger { background: #dc3545; }
    .hidden { display: none; }
    #map { height: 320px; width: 100%; border-radius: 10px; margin: 10px 0; border: 1px solid #ccc; z-index: 1; }
    .leaflet-routing-container { display: none !important; }
    .trip-card { background: #e8f4fd; border: 1px solid #b6effb; padding: 12px; border-radius: 8px; margin-bottom: 10px; }
  </style>
</head>
<body>

  <!-- 1. تسجيل دخول الكابتن -->
  <div id="captain-auth" class="card">
    <h2 style="text-align: center;">🚐 دخول الكابتن - موقف</h2>
    <input type="text" id="captain_name" placeholder="اسم الكابتن">
    <input type="tel" id="captain_phone" placeholder="رقم الموبايل">
    <label style="font-weight:bold; font-size:13px; color:#555;">نوع مركبتك في الخط:</label>
    <select id="captain_vehicle">
      <option value="microbus">🚐 ميكروباص (خطوط سير ومواقف)</option>
      <option value="suzuki">🚐 سوزوكي (تشاركي مرن)</option>
      <option value="private_shared">🚗 ملاكي تشاركي (حجز مقاعد)</option>
      <option value="private_special">🚗 رحلة خاصة (ملاكي من الباب للباب)</option>
    </select>
    <button class="btn-secondary" onclick="loginCaptain()">فتح لوحة التحكم ورادار الخط 🚀</button>
  </div>

  <!-- 2. لوحة تحكم الكابتن -->
  <div id="captain-dashboard" class="card hidden">
    <h3 style="margin-top:0;" id="dashboard-title">📡 رادار طلبات الموقف والخطوط</h3>
    <p id="captain-status-text" style="font-size: 13px; color: #666; margin-bottom: 10px;"></p>
    
    <div id="requests-container">
      <p style="text-align: center; color: #777;">جاري البحث عن طلبات قريبة على خط سيرك...</p>
    </div>

    <button id="finish-btn" class="btn-danger hidden" onclick="finishTrip()">🏁 إنهاء الرحلة الحالية وتسليم الركاب</button>

    <div id="map"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>

  <script type="module">
    import { supabase } from './supabase.js';

    let map;
    let captainMarker = null;
    let activeTripId = null;

    const carIcon = L.icon({
      iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-gold.png',
      shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/images/marker-shadow.png',
      iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34], shadowSize: [41, 41]
    });

    window.loginCaptain = function() {
      const name = document.getElementById('captain_name').value;
      const vehicle = document.getElementById('captain_vehicle').value;
      if (!name) { alert('أدخل اسم الكابتن من فضلك'); return; }

      localStorage.setItem('captain_name', name);
      localStorage.setItem('captain_vehicle', vehicle);

      document.getElementById('captain-auth').classList.add('hidden');
      document.getElementById('captain-dashboard').classList.remove('hidden');
      document.getElementById('captain-status-text').innerHTML = `🟢 حالتك: متاح وجاهز للتحميل على مركبة: <b>${vehicle}</b>`;
      
      setTimeout(initMap, 200);
      fetchPendingTrips(vehicle);
      subscribeToNewTrips(vehicle);
    };

    function initMap() {
      if (map) return;
      map = L.map('map').setView([30.0444, 31.2357], 13);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { 
        attribution: '&copy; OpenStreetMap' 
      }).addTo(map);

      captainMarker = L.marker([30.0444, 31.2357], {icon: carIcon}).addTo(map)
        .bindPopup('🚐 موقعك الحالي (الكابتن)').openPopup();
    }

    async function fetchPendingTrips(vehicleType) {
      const { data, error } = await supabase
        .from('trips')
        .select('*')
        .eq('vehicle_type', vehicleType)
        .eq('status', 'pending');

      if (error) {
        console.error('Error fetching trips:', error);
        return;
      }

      renderRequests(data);
    }

    function subscribeToNewTrips(vehicleType) {
      supabase
        .channel('captain_radar')
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'trips' }, payload => {
          if (payload.new.vehicle_type === vehicleType && payload.new.status === 'pending') {
            fetchPendingTrips(vehicleType);
          }
        })
        .subscribe();
    }

    function renderRequests(trips) {
      const container = document.getElementById('requests-container');
      if (!trips || trips.length === 0) {
        container.innerHTML = `<p style="text-align: center; color: #777;">لا توجد طلبات جديدة حالياً لمركبتك. انتظر ركاب المواقف والخطوط...</p>`;
        return;
      }

      container.innerHTML = '';
      trips.forEach(trip => {
        container.innerHTML += `
          <div class="trip-card">
            <p><b>👤 الراكب:</b> ${trip.passenger_name || 'راكب'}</p>
            <p><b>🚐 الخدمة:</b> ${trip.vehicle_type}</p>
            <p><b>💺 المقاعد المحجوزة:</b> ${trip.seats_count} مقعد</p>
            <p><b>📍 التحرك:</b> ${trip.pickup_location} ➔ ${trip.dropoff_location}</p>
            <p><b>🔑 كود التحقق (PIN):</b> <span style="color:#d9534f; font-weight:bold; font-size:16px;">${trip.pin_code}</span></p>
            <button onclick="acceptTrip('${trip.id}')" style="background:#28a745; margin-top:5px;">✅ قبول الرحلة وبدء التحميل</button>
          </div>
        `;
      });
    }

    window.acceptTrip = async function(tripId) {
      activeTripId = tripId;
      const { error } = await supabase
        .from('trips')
        .update({ status: 'accepted' })
        .eq('id', tripId);

      if (error) {
        alert('حدث خطأ أثناء قبول الرحلة');
        return;
      }

      alert('تم قبول الرحلة بنجاح! توجه إلى الموقف لاستقبال الراكب وتأكيد كود الـ PIN.');
      document.getElementById('requests-container').innerHTML = `
        <div class="trip-card" style="background:#e2f0d9; border-color:#c8e6c9;">
          <p style="color:#2d572c; font-weight:bold;">🟢 رحلة نشطة حالياً...</p>
          <p>تأكد من كود الـ PIN مع الراكب عند صعوده للمركبة في الموقف.</p>
        </div>
      `;
      document.getElementById('finish-btn').classList.remove('hidden');
      document.getElementById('dashboard-title').innerText = "🚐 رحلة نشطة - خدمة الموقف";
    };

    window.finishTrip = async function() {
      if (activeTripId) {
        await supabase.from('trips').update({ status: 'completed' }).eq('id', activeTripId);
      }
      alert('تم إنهاء الرحلة بنجاح وإغلاق الحسابات!');
      location.reload();
    };
  </script>
</body>
</html>
