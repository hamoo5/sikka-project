<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>موقف - لوحة الكابتن</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />

  <style>
    body { font-family: system-ui, -apple-system, sans-serif; padding: 12px; background: #f4f4f9; direction: rtl; text-align: right; margin: 0; }
    .card { background: #fff; padding: 15px; border-radius: 12px; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    input, select, button { width: 100%; padding: 12px; margin: 6px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 15px; }
    button { background: #28a745; color: white; border: none; font-weight: bold; cursor: pointer; }
    button:hover { background: #218838; }
    .btn-secondary { background: #007bff; }
    .btn-danger { background: #dc3545; }
    .hidden { display: none; }
    #map { height: 320px; width: 100%; border-radius: 10px; margin: 10px 0; border: 1px solid #ccc; z-index: 1; }
    .leaflet-routing-container { display: none !important; }
    .trip-card { background: #e8f4fd; border: 1px solid #b6effb; padding: 12px; border-radius: 8px; margin-bottom: 10px; }
  </style>
</head>
<body>

  <!-- 1. تسجيل دخول الكابتن -->
  <div id="captain-auth" class="card">
    <h2 style="text-align: center;">🚐 دخول الكابتن - موقف</h2>
    <input type="text" id="captain_name" placeholder="اسم الكابتن">
    <input type="tel" id="captain_phone" placeholder="رقم الموبايل">
    <label style="font-weight:bold; font-size:13px; color:#555;">نوع مركبتك في الخط:</label>
    <select id="captain_vehicle">
      <option value="microbus">🚐 ميكروباص (موقف خط سير)</option>
      <option value="suzuki">🚐 سوزوكي (تشاركي مرن)</option>
      <option value="private_shared">🚗 ملاكي تشاركي</option>
    </select>
    <button class="btn-secondary" onclick="loginCaptain()">فتح لوحة التحكم 🚀</button>
  </div>

  <!-- 2. لوحة تحكم الكابتن -->
  <div id="captain-dashboard" class="card hidden">
    <h3 style="margin-top:0;" id="dashboard-title">📡 رادار طلبات الموقف والخطوط</h3>
    
    <div id="requests-container">
      <div class="trip-card">
        <p><b>👤 الراكب:</b> أحمد محمد</p>
        <p><b>🚐 الخدمة:</b> ميكروباص (خط سير موقف)</p>
        <p><b>💺 المقاعد المحجوزة:</b> 2 مقعد</p>
        <p><b>📍 التحرك:</b> شارع حبيب سلبي ➔ شارع عزيز بقطر</p>
        <p><b>🔑 كود التحقق (PIN):</b> <span style="color:#d9534f; font-weight:bold; font-size:16px;">7141</span></p>
        <button onclick="acceptTrip()" style="background:#28a745; margin-top:5px;">✅ قبول الرحلة وبدء التحميل</button>
      </div>
    </div>

    <button id="finish-btn" class="btn-danger hidden" onclick="finishTrip()">🏁 إنهاء الرحلة وتسليم الركاب</button>

    <div id="map"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>

  <script type="module">
    import { supabase } from './supabase.js';

    let map, routingControl;
    let captainMarker = null;

    const carIcon = L.icon({
      iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-gold.png',
      shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/images/marker-shadow.png',
      iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34], shadowSize: [41, 41]
    });

    window.loginCaptain = function() {
      const name = document.getElementById('captain_name').value;
      if (!name) { alert('أدخل اسم الكابتن من فضلك'); return; }
      document.getElementById('captain-auth').classList.add('hidden');
      document.getElementById('captain-dashboard').classList.remove('hidden');
      setTimeout(initMap, 200);
    };

    function initMap() {
      if (map) return;
      map = L.map('map').setView([30.0444, 31.2357], 13);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { 
        attribution: '&copy; OpenStreetMap' 
      }).addTo(map);

      // وضع مكان الكابتن الابتدائي في وسط القاهرة
      captainMarker = L.marker([30.0444, 31.2357], {icon: carIcon}).addTo(map)
        .bindPopup('🚐 موقعك الحالي (الكابتن)').openPopup();
    }

    window.acceptTrip = function() {
      alert('تم قبول الرحلة بنجاح! توجه الآن إلى موقف الانطلاق لاستقبال الركاب وتأكيد كود الـ PIN.');
      document.getElementById('requests-container').innerHTML = `
        <div class="trip-card" style="background:#e2f0d9; border-color:#c8e6c9;">
          <p style="color:#2d572c; font-weight:bold;">🟢 الرحلة جارية الآن...</p>
          <p><b>🔑 كود التحقق المطلوب من الراكب:</b> 7141</p>
          <p>أكد الكود مع الراكب عند صعوده للمركبة في الموقف.</p>
        </div>
      `;
      document.getElementById('finish-btn').classList.remove('hidden');
      document.getElementById('dashboard-title').innerText = "🚐 رحلة نشطة - خدمة الموقف";
    };

    window.finishTrip = function() {
      alert('تم إنهاء الرحلة بنجاح وإغلاق الحسابات!');
      location.reload();
    };
  </script>
</body>
</html>
