<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>كومبو - تطبيق الكابتن الاحترافي</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * { box-sizing: border-box; font-family: Tahoma, sans-serif; }
        body { background: #121212; color: #fff; margin: 0; padding: 0; direction: rtl; overflow: hidden; }
        #map { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
        .top-nav { position: absolute; top: 15px; right: 15px; left: 15px; z-index: 10; display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.85); padding: 10px 15px; border-radius: 10px; border: 1px solid #333; }
        .bottom-sheet { position: absolute; bottom: 0; left: 0; width: 100%; background: #181818; border-top-left-radius: 20px; border-top-right-radius: 20px; padding: 18px; z-index: 10; box-shadow: 0 -5px 25px rgba(0,0,0,0.9); border-top: 1px solid #333; max-height: 85vh; overflow-y: auto; }
        
        .passenger-header { display: flex; align-items: center; gap: 12px; background: #222; padding: 12px; border-radius: 10px; margin-bottom: 12px; border: 1px solid #333; }
        .passenger-avatar { width: 55px; height: 55px; border-radius: 50%; object-fit: cover; border: 2px solid #00e676; }
        .passenger-info { flex-grow: 1; }
        
        .price-box { background: #111; padding: 12px; border-radius: 10px; border: 1px dashed #00e676; margin-bottom: 12px; text-align: center; }
        .net-price { font-size: 24px; font-weight: bold; color: #00e676; }
        .total-price { font-size: 13px; color: #aaa; text-decoration: line-through; }
        
        .btn-action { border: none; padding: 15px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; width: 100%; text-align: center; margin-top: 8px; }
        .btn-green { background: #00875a; color: #fff; }
        .btn-red { background: #d32f2f; color: #fff; }
        
        input { width: 100%; padding: 12px; background: #222; border: 1px solid #444; color: #fff; border-radius: 8px; font-size: 20px; text-align: center; letter-spacing: 6px; margin: 8px 0; }
        .timer-box { font-size: 22px; font-weight: bold; color: #ff9800; background: #2a2a2a; padding: 10px; border-radius: 8px; text-align: center; margin: 10px 0; }
    </style>
</head>
<body>

    <div id="map"></div>

    <div class="top-nav">
        <span style="font-weight: bold; font-size: 15px;">🚗 كومبو كابتن</span>
        <a href="passenger.html" style="color: #00e676; text-decoration: none; font-size: 12px; font-weight: bold;">صفحة الراكب ➔</a>
    </div>

    <div class="bottom-sheet" id="sheetContainer">
        <div style="text-align: center; color: #aaa; font-size: 14px; padding: 20px;">
            <div style="font-size: 18px; color: #00e676; font-weight: bold; margin-bottom: 5px;">🟢 متصل الآن</div>
            جاري فحص طلبات الركاب القريبة... 📡
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://pmpzilqpcomoodaksbhw.supabase.co";
        const SUPABASE_KEY = "sb_publishable_tjYI1IKegMFywNCqGPdKng_fSGIe7Zx";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let map, captainMarker, passengerMarker;
        let pollInterval = setInterval(checkForTrips, 1500);
        let activeTrip = null, waitTimer = null, timeLeft = 180;
        let captainLat = 30.0561, captainLng = 31.3285;

        // بيانات الراكب الاحترافية مطابقة للطلب
        const passengerProfile = {
            name: "أحمد علي",
            rating: "4.9 ⭐",
            tripsCount: "28 رحلة ناجحة",
            avatar: "https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=150"
        };

        window.onload = function() {
            map = L.map('map', {zoomControl: false}).setView([captainLat, captainLng], 14);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

            if (navigator.geolocation) {
                navigator.geolocation.watchPosition((pos) => {
                    captainLat = pos.coords.latitude;
                    captainLng = pos.coords.longitude;
                    if (captainMarker) {
                        captainMarker.setLatLng([captainLat, captainLng]);
                    } else {
                        captainMarker = L.marker([captainLat, captainLng]).addTo(map).bindPopup("🚗 موقعك الحالي");
                    }
                }, null, { enableHighAccuracy: true });
            }
        };

        async function checkForTrips() {
            const { data } = await supabaseClient.from('trips_data').select('*').order('id', { ascending: false }).limit(1);
            if (!data || data.length === 0) return;

            const t = data[0];
            if (!window.lastLoadedId || window.lastLoadedId !== t.id) {
                window.lastLoadedId = t.id;
                activeTrip = t;
                showIncomingTripModal(t);
            }
        }

        // 1. عرض طلب الرحلة الوارد مع كارت الراكب والأسعار الصافية
        function showIncomingTripModal(t) {
            clearInterval(pollInterval);
            
            const totalFare = parseFloat(t.trip_price) || 100;
            const netEarnings = Math.round(totalFare * 0.85);

            const sheet = document.getElementById('sheetContainer');
            sheet.innerHTML = `
                <div style="font-size: 13px; color: #ff9800; font-weight: bold; margin-bottom: 8px;">🔔 طلب رحلة جديد وارد!</div>

                <!-- كارت بيانات الراكب الاحترافي -->
                <div class="passenger-header">
                    <img src="${passengerProfile.avatar}" class="passenger-avatar" />
                    <div class="passenger-info">
                        <b style="font-size: 16px;">👤 ${passengerProfile.name}</b>
                        <div style="font-size: 12px; color: #ffca28; margin-top: 2px;">${passengerProfile.rating} | 🛣️ ${passengerProfile.tripsCount}</div>
                        <div style="font-size: 11px; color: #aaa; margin-top: 2px;">📱 ${t.user_mobile || '01112142750'}</div>
                    </div>
                </div>

                <div class="price-box">
                    <div style="font-size: 12px; color: #aaa;">صافي ربحك من الرحلة (بعد خصم 15% عمولة):</div>
                    <div class="net-price">${netEarnings} ج.م</div>
                    <div class="total-price">إجمالي المبلغ من الراكب: ${totalFare} ج.م</div>
                </div>

                <div style="background:#222; padding:10px; border-radius:8px; font-size:13px; margin-bottom:10px;">
                    <div>📍 الاستلام: <b style="color:#00e676;">${t.start_station}</b></div>
                    <div>🎯 الوجهة: <b>${t.end_station}</b></div>
                </div>

                <div style="display:flex; gap:10px;">
                    <button class="btn-action btn-green" style="flex:2;" onclick="acceptTripAction()">قبول الرحلة والتوجه للراكب ✅</button>
                    <button class="btn-action btn-red" style="flex:1;" onclick="window.location.reload()">رفض ❌</button>
                </div>
            `;

            passengerMarker = L.marker([30.0591, 31.3325]).addTo(map).bindPopup(`🟢 مكان الراكب: ${passengerProfile.name}`).openPopup();
        }

        // 2. مرحلة التوجه للراكب
        async function acceptTripAction() {
            await supabaseClient.from('trips_data').update({ notes: 'accepted' }).eq('id', activeTrip.id);

            const sheet = document.getElementById('sheetContainer');
            sheet.innerHTML = `
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
                    <b>🚗 جاري التوجه نحو موقع الراكب (${passengerProfile.name})</b>
                </div>
                <button class="btn-action btn-green" onclick="markArrivedAction()">لقد وصلت لموقع الراكب بالفعل 📍</button>
            `;
            map.setView([30.0591, 31.3325], 16);
        }

        // 3. مرحلة الوصول وبدء عداد الانتظار والـ PIN الثابت (4480)
        async function markArrivedAction() {
            await supabaseClient.from('trips_data').update({ notes: 'arrived' }).eq('id', activeTrip.id);

            const sheet = document.getElementById('sheetContainer');
            sheet.innerHTML = `
                <h3 style="margin-top:0; text-align:center; color:#ff9800;">⏱️ تم الوصول - في انتظار الراكب</h3>
                <div class="timer-box" id="timerBox">03:00</div>
                
                <div style="background:#222; padding:12px; border-radius:8px; text-align:center; margin-top:10px;">
                    <label style="font-size:12px; color:#aaa;">🔑 أدخل رقم الـ PIN المأخوذ من الراكب (4480):</label>
                    <input type="number" id="pinInput" placeholder="****" maxlength="4" />
                    <button class="btn-action btn-green" onclick="verifyPinAndStart()">تأكيد وبدء الرحلة 🚀</button>
                </div>

                <button class="btn-action btn-red" id="btnCancelFine" style="display:none; margin-top:8px;" onclick="cancelWithFine()">❌ إلغاء وتطبيق غرامة (20 ج.م)</button>
            `;

            waitTimer = setInterval(() => {
                timeLeft--;
                let min = Math.floor(timeLeft / 60);
                let sec = timeLeft % 60;
                document.getElementById('timerBox').innerText = `0${min}:${sec < 10 ? '0' : ''}${sec}`;

                if (timeLeft <= 0) {
                    clearInterval(waitTimer);
                    document.getElementById('timerBox').innerText = "⚠️ انتهت مهلة الانتظار";
                    document.getElementById('btnCancelFine').style.display = 'block';
                }
            }, 1000);
        }

        function cancelWithFine() {
            alert('تم إلغاء الرحلة وتطبيق غرامة 20 ج.م على الراكب (10 للكابتن + 10 للسيستم)');
            window.location.reload();
        }

        function verifyPinAndStart() {
            const pin = document.getElementById('pinInput').value.trim();
            if (pin !== "4480") {
                alert('كود PIN غير صحيح! تأكد من الرقم الخاص بالراكب.');
                return;
            }
            if (waitTimer) clearInterval(waitTimer);
            alert('تم التحقق بنجاح! الرحلة جارية الآن نحو الوجهة 🎯');
            window.location.reload();
        }
    </script>
</body>
</html>
