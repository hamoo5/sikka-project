<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>كومبو - واجهة الكابتن</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    body { font-family: system-ui, -apple-system, sans-serif; padding: 12px; background: #f4f4f9; direction: rtl; text-align: right; margin: 0; }
    .card { background: #fff; padding: 15px; border-radius: 12px; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    input, button { width: 100%; padding: 12px; margin: 6px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 15px; }
    button { background: #28a745; color: white; border: none; font-weight: bold; cursor: pointer; }
    button:hover { background: #218838; }
    .btn-secondary { background: #007bff; }
    .btn-gps { background: #17a2b8; }
    .btn-danger { background: #dc3545; }
    #map { height: 320px; width: 100%; border-radius: 10px; margin: 10px 0; border: 1px solid #ccc; z-index: 1; }
    .hidden { display: none; }
    #trip-alert { background: #fff3cd; border: 1px solid #ffeeba; color: #856404; padding: 12px; border-radius: 8px; margin: 10px 0; font-size: 14px; line-height: 1.6; }
  </style>
</head>
<body>

  <!-- 1. تسجيل دخول الكابتن -->
  <div id="auth-section" class="card">
    <h2 style="text-align: center;">تسجيل دخول الكابتن 🚗</h2>
    <input type="text" id="captain_name" placeholder="اسم الكابتن">
    <input type="tel" id="captain_phone" placeholder="رقم الموبايل">
    
    <button class="btn-secondary" onclick="handleCaptainAuth()">دخول لوحة الكابتن 🚀</button>
  </div>

  <!-- 2. لوحة التحكم وخدمة الطلبات -->
  <div id="app-section" class="card hidden">
    <h3 style="margin-top:0;" id="captain-title">📡 البحث عن طلبات قريبة...</h3>
    
    <button class="btn-gps" onclick="startLocationBroadcast()">📍 تفعيل البث الحي لموقعي (GPS)</button>

    <div id="trip-alert">
      🔔 <b>في انتظار طلبات الركاب...</b><br>
      سيظهر لك طلب الرحلة هنا فور قيام الراكب بالطلب.
    </div>

    <div id="action-area"></div>

    <div id="map"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script type="module">
    import { supabase } from './supabase.js';

    let map;
    let captainMarker = null;
    let currentBookingId = null;
    let watchId = null;
    let captainCoords = { lat: 30.0444, lng: 31.2357 };

    window.handleCaptainAuth = function() {
      const phone = document.getElementById('captain_phone').value;
      if (!phone) { alert('أدخل رقم الموبايل'); return; }

      document.getElementById('auth-section').classList.add('hidden');
      document.getElementById('app-section').classList.remove('hidden');
      setTimeout(initMap, 200);
      listenForPendingRides();
    };

    function initMap() {
      if (map) return;
      map = L.map('map').setView([30.0444, 31.2357], 13);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap'
      }).addTo(map);
    }

    // الاستماع للطلبات الجديدة في جدول bookings
    function listenForPendingRides() {
      supabase.channel('public:captain-bookings')
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'bookings' }, payload => {
          const newBooking = payload.new;
          if (newBooking.status === 'pending' && !currentBookingId) {
            currentBookingId = newBooking.id;
            document.getElementById('captain-title').innerText = "🚨 مبروك، يوجد طلب رحلة جديد!";
            document.getElementById('trip-alert').innerHTML = `
              📦 <b>طلب رحلة جديد قيد الانتظار!</b><br>
              رقم الطلب: #${newBooking.id}<br>
              الحالة: جاهز للقبول والتجهيز.
            `;
            document.getElementById('action-area').innerHTML = `
              <button onclick="acceptRide(${newBooking.id})" style="background:#28a745; font-size:16px; padding:14px;">✅ قبول الرحلة والتوجه للراكب</button>
            `;
          }
        })
        .subscribe();
    }

    window.acceptRide = async function(bookingId) {
      currentBookingId = bookingId;
      
      // تحديث حالة الطلب إلى accepted في قاعدة البيانات
      const { error } = await supabase.from('bookings').update({ 
        status: 'accepted',
        captain_lat: captainCoords.lat,
        captain_lng: captainCoords.lng
      }).eq('id', bookingId);

      if (error) {
        alert('خطأ في قبول الطلب: ' + error.message);
      } else {
        document.getElementById('captain-title').innerText = "🚗 في طريقك للراكب";
        document.getElementById('trip-alert').innerHTML = `
          ✅ <b>تم قبول الرحلة بنجاح!</b><br>
          موقعك الحي يتم بثه للراكب الآن. توجه لنقطة الانطلاق.
        `;
        document.getElementById('action-area').innerHTML = `
          <button class="btn-danger" onclick="finishRide()">🏁 إنهاء الرحلة</button>
        `;
        startLocationBroadcast();
      }
    };

    // بث موقع الكابتن الحي لحظياً للخريطة وقاعدة البيانات
    window.startLocationBroadcast = function() {
      if (navigator.geolocation) {
        alert('تم تفعيل البث الحي لموقعك بنجاح!');
        watchId = navigator.geolocation.watchPosition(async position => {
          captainCoords.lat = position.coords.latitude;
          captainCoords.lng = position.coords.longitude;

          const latLng = [captainCoords.lat, captainCoords.lng];

          if (captainMarker) {
            captainMarker.setLatLng(latLng);
          } else {
            captainMarker = L.marker(latLng, {
              icon: L.icon({ 
                iconUrl: 'https://cdn-icons-png.flaticon.com/512/3202/3202926.png', 
                iconSize: [35, 35], 
                iconAnchor: [17, 17] 
              })
            }).addTo(map);
          }
          map.setView(latLng, 16);

          // تحديث إحداثيات الكابتن في قاعدة البيانات لو فيه رحلة نشطة
          if (currentBookingId) {
            await supabase.from('bookings').update({
              captain_lat: captainCoords.lat,
              captain_lng: captainCoords.lng
            }).eq('id', currentBookingId);
          }

        }, () => { alert('تعذر تفعيل الـ GPS'); }, { enableHighAccuracy: true });
      }
    };

    window.finishRide = async function() {
      if (currentBookingId) {
        await supabase.from('bookings').update({ status: 'completed' }).eq('id', currentBookingId);
      }
      if (watchId) navigator.geolocation.clearWatch(watchId);
      alert('تم إنهاء الرحلة بنجاح! أحسنت.');
      location.reload();
    };
  </script>
</body>
</html>
