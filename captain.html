<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>كومبو - تطبيق الكابتن</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; font-family: Tahoma, sans-serif; }
        body { background: #121212; color: #fff; margin: 0; padding: 0; direction: rtl; overflow: hidden; }
        #map { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
        .top-nav { position: absolute; top: 15px; right: 15px; left: 15px; z-index: 10; display: flex; justify-content: space-between; background: rgba(0,0,0,0.85); padding: 10px 15px; border-radius: 10px; }
        .bottom-sheet { position: absolute; bottom: 0; left: 0; width: 100%; background: #181818; border-top-left-radius: 20px; border-top-right-radius: 20px; padding: 18px; z-index: 10; border-top: 1px solid #333; }
        .btn { border: none; padding: 14px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; text-align: center; margin-top: 8px; }
        .btn-green { background: #00875a; color: #fff; }
        .btn-red { background: #d32f2f; color: #fff; }
        input { width: 100%; padding: 12px; background: #222; border: 1px solid #444; color: #fff; border-radius: 8px; font-size: 20px; text-align: center; margin: 8px 0; }
        .timer-box { font-size: 22px; font-weight: bold; color: #ff9800; background: #2a2a2a; padding: 10px; border-radius: 8px; text-align: center; }
    </style>
</head>
<body>
    <div id="map"></div>

    <div class="top-nav">
        <b>🚗 كومبو كابتن</b>
        <a href="passenger.html" style="color: #00e676; text-decoration: none;">صفحة الراكب ➔</a>
    </div>

    <div class="bottom-sheet" id="sheetContainer">
        <div style="text-align: center; color: #aaa; padding: 15px;">
            <div style="font-size: 18px; color: #00e676; font-weight: bold;">🟢 متصل الآن</div>
            جاري فحص طلبات الركاب... 📡
        </div>
    </div>

    <script>
        const supabaseClient = supabase.createClient("https://pmpzilqpcomoodaksbhw.supabase.co", "sb_publishable_tjYI1IKegMFywNCqGPdKng_fSGIe7Zx");
        let map, activeTrip = null, pollInterval = setInterval(checkForTrips, 2000);
        let waitTimer = null, timeLeft = 180;

        window.onload = function() {
            map = L.map('map', {zoomControl: false}).setView([30.0561, 31.3285], 14);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        };

        async function checkForTrips() {
            const { data } = await supabaseClient.from('trips_data').select('*').order('id', { ascending: false }).limit(1);
            if (!data || data.length === 0) return;

            const t = data[0];
            if (!window.lastLoadedId || window.lastLoadedId !== t.id) {
                window.lastLoadedId = t.id;
                activeTrip = t;
                showIncomingTrip(t);
            }
        }

        function showIncomingTrip(t) {
            clearInterval(pollInterval);
            const sheet = document.getElementById('sheetContainer');
            sheet.innerHTML = `
                <div style="color: #ff9800; font-weight: bold;">🔔 طلب رحلة جديد!</div>
                <div style="margin: 10px 0;">📍 الاستلام: <b>${t.start_station}</b> | 💰 السعر الصافي: <b>85 ج.م</b></div>
                <button class="btn btn-green" onclick="acceptTrip()">قبول الرحلة والتوجه للراكب ✅</button>
            `;
            L.marker([30.0561, 31.3285]).addTo(map).bindPopup(`🟢 مكان الراكب`).openPopup();
        }

        async function acceptTrip() {
            // تحديث حالة الرحلة في قاعدة البيانات لـ accepted ليراها الراكب
            await supabaseClient.from('trips_data').update({ notes: 'accepted' }).eq('id', activeTrip.id);

            const sheet = document.getElementById('sheetContainer');
            sheet.innerHTML = `
                <b>🚗 جاري التوجه نحو الراكب</b>
                <button class="btn btn-green" onclick="markArrived()">📍 وصلت لموقع الراكب بالفعل</button>
            `;
        }

        async function markArrived() {
            // تحديث حالة الرحلة في قاعدة البيانات لـ arrived ليراها الراكب
            await supabaseClient.from('trips_data').update({ notes: 'arrived' }).eq('id', activeTrip.id);

            const sheet = document.getElementById('sheetContainer');
            sheet.innerHTML = `
                <h3 style="margin:0; text-align:center; color:#ff9800;">⏱️ تم الوصول - في انتظار الراكب</h3>
                <div class="timer-box" id="timerBox">03:00</div>
                <input type="number" id="pinInput" placeholder="أدخل PIN الراكب (4480)" />
                <button class="btn btn-green" onclick="startTrip()">تأكيد وبدء الرحلة 🚀</button>
                <button class="btn btn-red" id="btnCancelFine" style="display:none;" onclick="cancelFine()">❌ إلغاء وتطبيق غرامة (20 ج.م)</button>
            `;

            waitTimer = setInterval(() => {
                timeLeft--;
                let min = Math.floor(timeLeft / 60);
                let sec = timeLeft % 60;
                document.getElementById('timerBox').innerText = `0${min}:${sec < 10 ? '0' : ''}${sec}`;
                if (timeLeft <= 0) {
                    clearInterval(waitTimer);
                    document.getElementById('btnCancelFine').style.display = 'block';
                }
            }, 1000);
        }

        function cancelFine() {
            alert('تم إلغاء الرحلة وتطبيق غرامة 20 ج.م');
            window.location.reload();
        }

        function startTrip() {
            const pin = document.getElementById('pinInput').value.trim();
            if (pin !== "4480") {
                alert('كود PIN غير صحيح!');
                return;
            }
            alert('تم التحقق بنجاح! الرحلة بدأت الآن 🚀');
            window.location.reload();
        }
    </script>
</body>
</html>
