<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كومبو - لوحة الكابتن</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        body { margin: 0; padding: 0; background: #070b19; color: #f8fafc; min-height: 100vh; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 440px; padding: 16px; margin: auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; background: #0f172a; padding: 12px 16px; border-radius: 16px; border: 1px solid #1e293b; }
        .user-info { display: flex; align-items: center; gap: 10px; }
        .avatar-circle { width: 34px; height: 34px; background: linear-gradient(135deg, #22c55e, #15803d); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 14px; color: #fff; }
        .user-welcome { font-size: 13px; font-weight: 700; color: #22c55e; }
        .logout-btn { background: rgba(239, 68, 68, 0.1); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.3); padding: 5px 10px; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 11px; }
        .card-box { background: #0f172a; border: 1px solid #1e293b; border-radius: 20px; padding: 18px; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4); margin-bottom: 16px; }
        .card-title { font-size: 15px; font-weight: 800; color: #fff; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid #1e293b; padding-bottom: 8px; }
        .map-container { position: relative; width: 100%; height: 240px; margin-bottom: 14px; }
        #map { width: 100%; height: 100%; border-radius: 14px; border: 1px solid #334155; z-index: 1; }
        .request-card { background: #050b14; border: 1px solid #334155; border-radius: 14px; padding: 14px; margin-bottom: 10px; }
        .req-info { font-size: 12px; color: #94a3b8; margin-bottom: 6px; font-weight: 600; }
        .req-loc { font-size: 13px; color: #fff; font-weight: 700; margin-bottom: 8px; }
        .btn-accept { background: linear-gradient(135deg, #22c55e, #15803d); color: #fff; border: none; padding: 10px; width: 100%; border-radius: 10px; font-weight: 800; font-size: 13px; cursor: pointer; }
        .status-banner { background: rgba(34, 197, 94, 0.1); border: 1px solid rgba(34, 197, 94, 0.3); color: #22c55e; padding: 10px; border-radius: 12px; text-align: center; font-weight: 700; font-size: 12px; line-height: 1.6; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="user-info">
                <div class="avatar-circle">ع</div>
                <div class="user-welcome">أهلاً كابتن، <span>عبدالله كابتن</span></div>
            </div>
            <button class="logout-btn" onclick="logout()">خروج</button>
        </div>

        <div class="card-box">
            <div class="card-title">🟢 رادار الطلبات ومسار التوجيه</div>
            <div class="map-container"><div id="map"></div></div>
            <div id="requests-container">
                <div class="request-card">
                    <div class="req-info">🟢 رحلة جديدة (ملاكي) - المسافة: 3.2 كم</div>
                    <div class="req-loc">من: ميدان التحرير، القاهرة</div>
                    <div class="req-loc" style="color: #ef4444;">إلى: بستان الدكم، عرابي</div>
                    <div style="font-size: 13px; color: #38bdf8; font-weight: 800; margin-bottom: 10px;">السعر: 45 ج.م</div>
                    <button class="btn-accept" onclick="acceptTrip()">قبول الرحلة وبدء الإرسال لايف ⚡</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const SUPABASE_URL = 'https://pmpzilqpcomoodaksbhw.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_tjYI1IKegMFywNCqGPdKng_fSGIe7Zx';
        let supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let map, captainMarker, activeTripId = 1; // رقم تجريبي للرحلة في قاعدة البيانات

        const captainIcon = L.divIcon({ html: '<div style="background-color: #2563eb; width: 24px; height: 24px; border-radius: 50%; border: 3px solid #fff;"></div>', iconSize: [24,24], iconAnchor: [12,12] });

        function initMap() {
            map = L.map('map').setView([30.0444, 31.2357], 14);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

            if (navigator.geolocation) {
                navigator.geolocation.watchPosition(async position => {
                    let lat = position.coords.latitude;
                    let lng = position.coords.longitude;

                    if (!captainMarker) {
                        captainMarker = L.marker([lat, lng], {icon: captainIcon}).addTo(map).bindPopup('موقعك الكابتن').openPopup();
                        map.setView([lat, lng], 15);
                    } else {
                        captainMarker.setLatLng([lat, lng]);
                    }

                    // إرسال الإحداثيات مباشرة إلى Supabase ليراها الراكب لايف
                    await supabaseClient
                        .from('trips')
                        .update({ captain_lat: lat, captain_lng: lng })
                        .eq('id', activeTripId);

                }, err => {}, { enableHighAccuracy: true });
            }
        }

        function acceptTrip() {
            alert('تم قبول الرحلة! يتم تحديث موقعك للراكب لايف الآن.');
            document.getElementById('requests-container').innerHTML = `<div class="status-banner">🚗 الرحلة جارية وموقعك يتم بثه للراكب لحظياً عبر GPS</div>`;
        }

        function logout() { window.location.href = 'index.html'; }
        initMap();
    </script>
</body>
</html>
