<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>كومبو - تطبيق الكابتن</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * { box-sizing: border-box; font-family: Tahoma, sans-serif; }
        body { background: #121212; color: #fff; margin: 0; padding: 0; direction: rtl; }
        .top-bar { background: #000; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; }
        .container { padding: 12px; }
        .card { background: #1e1e1e; padding: 16px; border-radius: 12px; margin-bottom: 12px; border: 1px solid #333; }
        .btn { background: #fff; color: #000; border: none; padding: 14px; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; width: 100%; text-align: center; margin-top: 10px; }
        .btn-green { background: #00875a; color: #fff; }
        .btn-red { background: #d32f2f; color: #fff; }
        .map-container { width: 100%; height: 260px; border-radius: 10px; margin: 10px 0; border: 1px solid #444; z-index: 1; }
        .timer-box { font-size: 22px; font-weight: bold; color: #ff9800; background: #2a2a2a; padding: 10px; border-radius: 8px; text-align: center; margin: 10px 0; }
    </style>
</head>
<body>

    <div class="top-bar">
        <span style="font-weight: bold; font-size: 16px;">🚗 كومبو - تطبيق الكابتن</span>
        <a href="passenger.html" style="color: #00e676; text-decoration: none; font-size: 13px; font-weight: bold;">صفحة الراكب ➔</a>
    </div>

    <div class="container" id="captainContent">
        <div class="card" style="text-align:center;">
            <span style="padding:6px 12px; border-radius:6px; background:#333; color:#ff9800; font-weight:bold;">🟢 متصل - في انتظار طلبات الراكب...</span>
            <div id="availableTrips" style="margin-top:15px; color:#aaa;">جاري فحص الطلبات الواردة... 📡</div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://pmpzilqpcomoodaksbhw.supabase.co";
        const SUPABASE_KEY = "sb_publishable_tjYI1IKegMFywNCqGPdKng_fSGIe7Zx";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let fetchInterval = setInterval(fetchAvailableTrips, 2500);
        let activeTrip = null, waitTimer = null, timeLeft = 180;

        async function fetchAvailableTrips() {
            const container = document.getElementById('captainContent');
            const { data } = await supabaseClient.from('trips_data').select('*').eq('status', 'pending').order('id', { ascending: false });

            if (!data || data.length === 0) {
                container.innerHTML = `
                    <div class="card" style="text-align:center;">
                        <span style="padding:6px 12px; border-radius:6px; background:#333; color:#ff9800; font-weight:bold;">🟢 متصل - في انتظار طلبات الراكب...</span>
                        <div style="margin-top:15px; color:#888;">لا توجد طلبات معلقة حالياً، انتظر طلب الراكب 📡</div>
                    </div>
                `;
                return;
            }

            let html = `<div class="card"><h3 style="margin-top:0; color:#ff9800;">🚗 طلبات الرحلات الواردة</h3>`;
            data.forEach(t => {
                html += `
                    <div style="background:#2a2a2a; padding:14px; border-radius:10px; margin-bottom:12px; border-right:4px solid #00e676;">
                        <div>📍 مكان الاستلام: <b style="color:#00e676;">${t.start_station}</b></div>
                        <div>🎯 الوجهة: <b>${t.end_station}</b></div>
                        <div>💰 السعر الصافي: <b style="color:#00e676;">${t.trip_price}</b></div>
                        <div>📱 هاتف الراكب: ${t.user_mobile}</div>
                        <button class="btn btn-green" onclick="acceptTrip(${t.id}, '${t.start_station}', '${t.end_station}', '${t.trip_price}')">قبول الرحلة والتوجه للراكب ✅</button>
                    </div>
                `;
            });
            container.innerHTML = html + `</div>`;
        }

        async function acceptTrip(id, start, end, price) {
            clearInterval(fetchInterval);
            activeTrip = { id, start, end, price };

            await supabaseClient.from('trips_data').update({ status: 'accepted' }).eq('id', id);

            const container = document.getElementById('captainContent');
            container.innerHTML = `
                <div class="card">
                    <h3 style="color:#00e676; margin-top:0;">🚀 جاري التوجه للراكب</h3>
                    <p>📍 الاستلام: <b>${start}</b> | 🎯 الوجهة: <b>${end}</b> | 💰 السعر: <b>${price}</b></p>
                    <div id="captainMap" class="map-container"></div>

                    <button class="btn btn-green" id="btnArrived" onclick="arrivedAtPassenger()">📍 وصلت لمكان الراكب</button>
                    
                    <div id="timerContainer" style="display:none;">
                        <div class="timer-box" id="timerBox">⏱️ وقت الانتظار: 03:00</div>
                        <button class="btn btn-red" id="btnCancelFine" style="display:none;" onclick="cancelWithFine()">❌ إلغاء الرحلة وتطبيق غرامة (20 ج.م)</button>
                    </div>

                    <hr style="border-color:#333; margin:15px 0;">

                    <div style="background:#2a2a2a; padding:12px; border-radius:8px; text-align:center;">
                        <label>🔑 أدخل كود الـ PIN المأخوذ من الراكب لبدء المشوار:</label>
                        <input type="number" id="inputPin" placeholder="****" style="text-align:center; font-size:20px; letter-spacing:4px;" />
                        <button class="btn btn-green" onclick="startTripWithPin()">بدء الرحلة الآن 🚗</button>
                    </div>
                </div>
            `;

            const map = L.map('captainMap').setView([30.0561, 31.3285], 14);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);
            L.marker([30.0561, 31.3285]).addTo(map).bindPopup(`🟢 موقع الراكب: ${start}`).openPopup();
        }

        async function arrivedAtPassenger() {
            document.getElementById('btnArrived').style.display = 'none';
            document.getElementById('timerContainer').style.display = 'block';

            await supabaseClient.from('trips_data').update({ status: 'arrived' }).eq('id', activeTrip.id);

            waitTimer = setInterval(() => {
                timeLeft--;
                let min = Math.floor(timeLeft / 60);
                let sec = timeLeft % 60;
                document.getElementById('timerBox').innerText = `⏱️ وقت الانتظار: 0${min}:${sec < 10 ? '0' : ''}${sec}`;

                if (timeLeft <= 0) {
                    clearInterval(waitTimer);
                    document.getElementById('timerBox').innerText = "⚠️ انتهت مهلة الانتظار (3 دقائق)";
                    document.getElementById('timerBox').style.color = "#ff5252";
                    document.getElementById('btnCancelFine').style.display = 'block';
                }
            }, 1000);
        }

        async function cancelWithFine() {
            await supabaseClient.from('trips_data').update({ status: 'cancelled' }).eq('id', activeTrip.id);
            alert('تم إلغاء الرحلة وتطبيق غرامة 20 ج.م على الراكب (10 للكابتن + 10 للسيستم)');
            window.location.reload();
        }

        async function startTripWithPin() {
            const enteredPin = document.getElementById('inputPin').value.trim();
            if (!enteredPin || enteredPin.length !== 4) {
                alert('الرجاء إدخال كود PIN صحيح مكون من 4 أرقام.');
                return;
            }

            if(waitTimer) clearInterval(waitTimer);
            await supabaseClient.from('trips_data').update({ status: 'started' }).eq('id', activeTrip.id);
            alert('تم تأكيد الكود وبدء الرحلة بنجاح! اتجه نحو الوجهة 🚀');
        }
    </script>
</body>
</html>
