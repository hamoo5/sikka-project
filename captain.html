<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كومبو - لوحة الكابتن المتكاملة</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        body { margin: 0; padding: 0; background: #070b19; color: #f8fafc; min-height: 100vh; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 440px; padding: 16px; margin: auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; background: #0f172a; padding: 12px 16px; border-radius: 16px; border: 1px solid #1e293b; }
        .user-info { display: flex; align-items: center; gap: 10px; }
        .avatar-circle { width: 34px; height: 34px; background: linear-gradient(135deg, #22c55e, #15803d); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 14px; color: #fff; }
        .user-welcome { font-size: 13px; font-weight: 700; color: #22c55e; }
        .logout-btn { background: rgba(239, 68, 68, 0.1); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.3); padding: 5px 10px; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 11px; }
        .card-box { background: #0f172a; border: 1px solid #1e293b; border-radius: 20px; padding: 18px; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4); margin-bottom: 16px; }
        .card-title { font-size: 15px; font-weight: 800; color: #fff; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid #1e293b; padding-bottom: 8px; }
        .map-container { position: relative; width: 100%; height: 220px; margin-bottom: 14px; }
        #map { width: 100%; height: 100%; border-radius: 14px; border: 1px solid #334155; z-index: 1; }
        .request-card { background: #050b14; border: 1px solid #334155; border-radius: 14px; padding: 14px; margin-bottom: 10px; }
        .req-info { font-size: 12px; color: #94a3b8; margin-bottom: 6px; font-weight: 600; }
        .req-loc { font-size: 13px; color: #fff; font-weight: 700; margin-bottom: 8px; }
        .btn-action { background: linear-gradient(135deg, #22c55e, #15803d); color: #fff; border: none; padding: 12px; width: 100%; border-radius: 10px; font-weight: 800; font-size: 14px; cursor: pointer; margin-top: 8px; }
        .pin-input { width: 100%; padding: 11px; text-align: center; font-size: 20px; letter-spacing: 4px; background: #050b14; border: 1px solid #334155; color: #fff; border-radius: 10px; margin: 8px 0; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="user-info">
                <div class="avatar-circle">ع</div>
                <div class="user-welcome">أهلاً كابتن، <span>عبدالله</span></div>
            </div>
            <button class="logout-btn" onclick="logout()">خروج</button>
        </div>

        <div class="card-box">
            <div class="card-title">🟢 رادار الطلبات الحية</div>
            <div class="map-container"><div id="map"></div></div>
            <div id="trip-control-area">
                <div class="request-card">
                    <div class="req-info">🟢 رحلة جديدة (UberX Saver) - 25.7 كم</div>
                    <div class="req-loc">من: البحث الجنائي 65، قسم المعادي</div>
                    <div class="req-loc" style="color: #ef4444;">إلى: Garden 8، القاهرة الجديدة</div>
                    <div style="font-size: 14px; color: #38bdf8; font-weight: 900; margin-bottom: 8px;">السعر: 68.67 ج.م</div>
                    <button class="btn-action" onclick="acceptTrip()">اقبل الرحلة ⚡</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const SUPABASE_URL = 'https://pmpzilqpcomoodaksbhw.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_tjYI1IKegMFywNCqGPdKng_fSGIe7Zx';
        let supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let map, captainMarker, riderPickupMarker, activeTripId = 1;
        
        const captainIcon = L.divIcon({ html: '<div style="background-color: #2563eb; width: 24px; height: 24px; border-radius: 50%; border: 3px solid #fff;"></div>', iconSize: [24,24], iconAnchor: [12,12] });
        const greenPinIcon = L.divIcon({ html: '<div style="background-color: #22c55e; width: 22px; height: 22px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); border: 2px solid #fff;"></div>', iconSize: [22,22], iconAnchor: [11,22] });

        function initMap() {
            // إحداثيات مبدئية في المعادي (نقطة انطلاق الراكب)
            let riderLat = 29.9602, riderLng = 31.2569;
            
            map = L.map('map').setView([riderLat, riderLng], 13);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

            // وضع دبوس موقع الراكب الأخضر فوراً على خريطة الكابتن
            riderPickupMarker = L.marker([riderLat, riderLng], {icon: greenPinIcon}).addTo(map)
                .bindPopup('موقع الراكب: البحث الجنائي 65، المعادي').openPopup();

            if (navigator.geolocation) {
                navigator.geolocation.watchPosition(async position => {
                    let lat = position.coords.latitude;
                    let lng = position.coords.longitude;

                    if (!captainMarker) {
                        captainMarker = L.marker([lat, lng], {icon: captainIcon}).addTo(map).bindPopup('موقعك (الكابتن)');
                    } else {
                        captainMarker.setLatLng([lat, lng]);
                    }

                    await supabaseClient
                        .from('trips')
                        .update({ captain_lat: lat, captain_lng: lng })
                        .eq('id', activeTripId);

                }, err => {}, { enableHighAccuracy: true });
            }
        }

        function acceptTrip() {
            document.getElementById('trip-control-area').innerHTML = `
                <div class="request-card" style="text-align: center;">
                    <div style="color: #eab308; font-weight: 700; margin-bottom: 8px;">⏳ جار انتظار الراكب...</div>
                    <div style="font-size: 11px; color: #94a3b8; margin-bottom: 6px;">أدخل رقم التعريف الشخصي (PIN) للراكب:</div>
                    <input type="password" maxlength="4" id="pin-code" class="pin-input" placeholder="----">
                    <button class="btn-action" onclick="verifyPin()">تأكيد وبدء الرحلة 🚀</button>
                </div>
            `;
        }

        function verifyPin() {
            let pin = document.getElementById('pin-code').value;
            if(pin.length === 4) {
                document.getElementById('trip-control-area').innerHTML = `
                    <div class="request-card" style="text-align: center;">
                        <div style="color: #22c55e; font-weight: 900; font-size: 14px; margin-bottom: 6px;">🚗 الرحلة جارية الآن نحو Garden 8</div>
                        <div style="font-size: 12px; color: #94a3b8;">موقعك يُبث لايف للراكب على الخريطة بنجاح.</div>
                        <button class="btn-action" style="background:#ef4444; margin-top:12px;" onclick="endTrip()">إنهاء الرحلة</button>
                    </div>
                `;
            } else {
                alert('الرجاء إدخال رمز الأمان المكون من 4 أرقام صحيحاً.');
            }
        }

        function endTrip() {
            alert('تم إنهاء الرحلة بنجاح وشكراً لاستخدامك كومبو!');
            location.reload();
        }

        function logout() { window.location.href = 'index.html'; }
        initMap();
    </script>
</body>
</html>
