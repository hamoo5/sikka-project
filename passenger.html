<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>كومبو - واجهة الراكب الاحترافية</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * { box-sizing: border-box; font-family: Tahoma, sans-serif; }
        body { background: #121212; color: #fff; margin: 0; padding: 10px; direction: rtl; }
        .top-bar { background: #000; padding: 12px; display: flex; justify-content: space-between; border-radius: 8px; margin-bottom: 10px; border: 1px solid #333; }
        .card { background: #181818; padding: 14px; border-radius: 12px; margin-bottom: 12px; border: 1px solid #333; }
        
        .btn-blue { background: #0066cc; color: #fff; border: none; padding: 14px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; text-align: center; margin-bottom: 10px; font-size: 14px; }
        .btn-green { background: #00875a; color: #fff; border: none; padding: 16px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; text-align: center; font-size: 16px; }
        
        .input-box { width: 100%; padding: 12px; background: #222; border: 1px solid #444; color: #fff; border-radius: 8px; margin-top: 6px; margin-bottom: 6px; font-size: 14px; outline: none; }
        label { font-size: 12px; color: #aaa; display: block; }
        
        /* نتائج البحث المنسدلة زي جوجل ماب */
        .suggestions-list { background: #222; border: 1px solid #444; border-radius: 8px; max-height: 150px; overflow-y: auto; margin-bottom: 10px; display: none; }
        .suggestion-item { padding: 10px; font-size: 13px; border-bottom: 1px solid #333; cursor: pointer; }
        .suggestion-item:hover { background: #333; color: #00e676; }

        .map-container { width: 100%; height: 260px; border-radius: 10px; margin: 10px 0; border: 1px solid #444; }
        .hint-text { font-size: 11px; color: #00e676; text-align: center; margin-bottom: 5px; }
        
        .info-box { background: #1e1e1e; padding: 12px; border-radius: 8px; border: 1px dashed #00e676; margin-bottom: 12px; text-align: center; font-size: 13px; color: #00e676; font-weight: bold; }
        .pin-box { font-size: 26px; font-weight: bold; letter-spacing: 6px; color: #00e676; background: #111; padding: 10px; border-radius: 8px; text-align: center; margin: 10px 0; border: 1px dashed #00e676; }
    </style>
</head>
<body>

    <div class="top-bar">
        <b>🚗 كومبو - واجهة الراكب</b>
        <a href="captain.html" style="color:#00e676; text-decoration:none; font-weight:bold;">صفحة الكابتن ➔</a>
    </div>

    <div class="card" id="formCard">
        <button class="btn-blue" onclick="useCurrentLocation()">📍 استخدام موقعي الحالي (جلب اسم الشارع)</button>
        
        <label>مكان الاستلام (من):</label>
        <input type="text" id="startInput" class="input-box" value="جاري تحديد اسم الشارع..." />
        
        <label>الوجهة (إلى - بحث مثل جوجل ماب):</label>
        <input type="text" id="endInput" class="input-box" placeholder="اكتب اسم الشارع أو المنطقة للبحث..." oninput="searchPlaces(this.value, 'endSuggestions')" />
        <div id="endSuggestions" class="suggestions-list"></div>

        <div class="hint-text">💡 اسحب الدبوس الأزرق على الخريطة لتحديث اسم الشارع تلقائياً!</div>
        <div id="map" class="map-container"></div>

        <div class="info-box">
            🛣️ المسافة: 17.9 كم | ⏱️ الوقت: 19 دقيقة | 💰 السعر: 159 ج.م
        </div>

        <label>رقم الهاتف:</label>
        <input type="text" id="phoneInput" class="input-box" value="01255555588" />

        <button class="btn-green" onclick="requestTrip()">اطلب الرحلة الآن 🚀</button>
    </div>

    <!-- كارت حالة الرحلة -->
    <div class="card" id="statusCard" style="display:none; text-align:center;">
        <div id="statusBadge" style="background:#222; color:#ff9800; padding:12px; border-radius:8px; font-weight:bold; border:1px solid #333; margin-bottom: 10px;">⏳ في انتظار قبول الكابتن...</div>
        <div id="statusMap" class="map-container"></div>
        <div id="pinContainer" style="display:none;">
            <label style="font-size:12px; color:#aaa;">كود الـ PIN الخاص بك (أعطه للكابتن عند ركوب السيارة):</label>
            <div class="pin-box">4480</div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://pmpzilqpcomoodaksbhw.supabase.co";
        const SUPABASE_KEY = "sb_publishable_tjYI1IKegMFywNCqGPdKng_fSGIe7Zx";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let map = null, statusMap = null, activeTripId = null, mainMarker = null;

        window.onload = function() {
            map = L.map('map').setView([30.0561, 31.3285], 15);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);
            
            mainMarker = L.marker([30.0561, 31.3285], { draggable: true }).addTo(map)
                .bindPopup("🟢 اسحبني لتحديد موقعك").openPopup();

            // جلب اسم الشارع تلقائياً عند تحريك الدبوس (Reverse Geocoding)
            mainMarker.on('dragend', async function(e) {
                const pos = mainMarker.getLatLng();
                await getStreetName(pos.lat, pos.lng, 'startInput');
            });

            // جلب الشارع الافتراضي عند الفتح
            getStreetName(30.0561, 31.3285, 'startInput');
        };

        // دالة جلب اسم الشارع الحقيقي من الإحداثيات (زي جوجل ماب)
        async function getStreetName(lat, lng, elementId) {
            try {
                let res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=18&addressdetails=1`);
                let data = await res.json();
                if (data && data.display_name) {
                    let shortName = data.display_name.split(',')[0] + '، ' + (data.address.city || data.address.town || 'القاهرة');
                    document.getElementById(elementId).value = shortName;
                }
            } catch (err) {
                document.getElementById(elementId).value = `خط عرض: ${lat.toFixed(4)}, خط طول: ${lng.toFixed(4)}`;
            }
        }

        // دالة البحث التفاعلي عن الشوارع والأماكن
        async function searchPlaces(query, containerId) {
            const listContainer = document.getElementById(containerId);
            if (query.length < 3) {
                listContainer.style.display = 'none';
                return;
            }

            try {
                let res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query + ' Cairo')}&limit=5`);
                let results = await res.json();
                
                listContainer.innerHTML = '';
                if (results.length > 0) {
                    listContainer.style.display = 'block';
                    results.forEach(place => {
                        let div = document.createElement('div');
                        div.className = 'suggestion-item';
                        div.innerText = place.display_name;
                        div.onclick = function() {
                            document.getElementById('endInput').value = place.display_name.split(',')[0];
                            listContainer.style.display = 'none';
                            map.setView([parseFloat(place.lat), parseFloat(place.lon)], 16);
                            L.marker([parseFloat(place.lat), parseFloat(place.lon)]).addTo(map).bindPopup("🎯 الوجهة").openPopup();
                        };
                        listContainer.appendChild(div);
                    });
                } else {
                    listContainer.style.display = 'none';
                }
            } catch (err) {
                console.log('خطأ في البحث');
            }
        }

        function useCurrentLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(async (pos) => {
                    const lat = pos.coords.latitude;
                    const lng = pos.coords.longitude;
                    map.setView([lat, lng], 16);
                    mainMarker.setLatLng([lat, lng]);
                    await getStreetName(lat, lng, 'startInput');
                });
            } else {
                alert('الخواص الجغرافية غير مدعومة في متصفحك');
            }
        }

        async function requestTrip() {
            const start = document.getElementById('startInput').value;
            const end = document.getElementById('endInput').value;
            const phone = document.getElementById('phoneInput').value;

            const { data, error } = await supabaseClient.from('trips_data').insert([{
                start_station: start,
                end_station: end,
                trip_price: '159_pending',
                user_mobile: phone
            }]).select();

            if (error) {
                alert('خطأ في إرسال الطلب: ' + error.message);
                return;
            }

(data && data.length > 0) {
                activeTripId = data[0].id;
                document.getElementById('formCard').style.display = 'none';
                document.getElementById('statusCard').style.display = 'block';
                
                initStatusMap();
                listenToTripUpdates();
            }
        }

        function initStatusMap() {
            if (!statusMap) {
                statusMap = L.map('statusMap').setView([30.0561, 31.3285], 14);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(statusMap);
                L.marker([30.0561, 31.3285]).addTo(statusMap).bindPopup("🟢 نقطة الاستلام").openPopup();
            }
        }

        function listenToTripUpdates() {
            setInterval(async () => {
                if (!activeTripId) return;
                const { data } = await supabaseClient.from('trips_data').select('*').eq('id', activeTripId).single();
                if (!data) return;

                const badge = document.getElementById('statusBadge');
                if (data.trip_price === '159_accepted') {
                    badge.innerText = "🚗 الكابتن قبل الرحلة وهو في الطريق إليك!";
                    badge.style.color = "#00e676";
                } else if (data.trip_price === '159_arrived') {
                    badge.innerText = "📍 الكابتن وصل موقعك، أعطه كود PIN (4480)";
                    badge.style.color = "#ff9800";
                    document.getElementById('pinContainer').style.display = 'block';
                } else if (data.trip_price === '159_started') {
                    badge.innerText = "🎯 الرحلة جارية الآن نحو نقطة النزول النهائية!";
                    badge.style.color = "#00e676";
                    statusMap.setView([30.0421, 31.2355], 14);
                    L.marker([30.0421, 31.2355]).addTo(statusMap).bindPopup("🎯 وجهة النزول").openPopup();
                } else if (data.trip_price === '159_completed') {
                    alert('تم إنهاء الرحلة بنجاح! شكراً لاستخدامك كومبو.');
                    window.location.reload();
                }
            }, 2000);
        }
    </script>
</body>
</html>
