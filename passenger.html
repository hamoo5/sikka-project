<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محطات - تطبيق الراكب</title>
    <!-- استدعاء مكتبة Supabase الرسمية الصحيحة -->
    <script src="https://jsdelivr.net"></script>
    <link rel="stylesheet" href="https://unpkg.com" />
    <script src="https://unpkg.com"></script>
    <style>
        :root { --primary: #1a1a1a; --accent: #ffc107; --bg: #f8f9fa; --card: #ffffff; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--bg); color: #333; padding-bottom: 60px; }
        .header { background: var(--primary); color: white; padding: 15px; text-align: center; }
        .header h1 { color: var(--accent); font-size: 20px; }
        .container { padding: 15px; max-width: 480px; margin: 0 auto; }
        .panel { background: var(--card); padding: 15px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 15px; display: none; }
        .panel.active { display: block; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 13px; font-weight: bold; margin-bottom: 4px; }
        .form-group input, .form-group select { width: 100%; padding: 11px; border: 1px solid #ccc; border-radius: 8px; font-size: 14px; }
        .btn { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .btn-accent { background: var(--accent); color: var(--primary); }
        #map { height: 200px; width: 100%; border-radius: 12px; margin-bottom: 12px; border: 1px solid #ddd; }
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--primary); display: flex; justify-content: space-around; padding: 10px; z-index: 1000; }
        .nav-item { color: white; border: none; background: none; font-size: 12px; cursor: pointer; text-align: center; }
        .nav-item.active { color: var(--accent); font-weight: bold; }
        .trip-box { background: #f1f3f5; padding: 10px; border-radius: 8px; margin-top: 8px; font-size: 13px; border-right: 4px solid var(--accent); }
    </style>
</head>
<body>

    <div class="header">
        <h1>سكة ومحطات - الراكب</h1>
    </div>

    <!-- شاشة تسجيل الدخول وإنشاء حساب -->
    <div id="screen-auth" class="container" style="display: block;">
        <div class="panel active">
            <h3 style="text-align: center; margin-bottom: 15px;">تسجيل الدخول / إنشاء حساب</h3>
            <div class="form-group"><label>البريد الإلكتروني</label><input type="email" id="email" placeholder="mail@example.com"></div>
            <div class="form-group"><label>كلمة السر</label><input type="password" id="password" placeholder="كلمة السر"></div>
            <div class="form-group">
                <label>نوع الحساب</label>
                <select id="user-type">
                    <option value="passenger">راكب 🚗</option>
                    <option value="captain">كابتن / سائق 🚐</option>
                </select>
            </div>
            <button class="btn btn-accent" onclick="login()">دخول سريع</button>
            <button class="btn" style="margin-top: 8px; background: #6c757d;" onclick="signUp()">إنشاء حساب جديد</button>
        </div>
    </div>

    <!-- شاشة التطبيق الرئيسية بعد الدخول -->
    <div id="screen-passenger" style="display: none;">
        <div class="container">
            <div id="map"></div>

            <!-- تبويب: مشوار خاص -->
            <div id="tab-private" class="panel active">
                <h4>🚗 مشوار ملاكي خاص مباشر</h4>
                <div class="form-group"><label>مكان الركوب</label><input type="text" id="p-from" value="التجمع الخامس"></div>
                <div class="form-group"><label>الوجهة</label><input type="text" id="p-to" placeholder="مثال: رمسيس"></div>
                <button class="btn" onclick="requestPrivate()">اطلب الآن (السعر ثابت)</button>
                <div id="p-status" style="margin-top: 10px; font-weight: bold; color: green;"></div>
            </div>

            <!-- تبويب: خطوط ومحطات -->
            <div id="tab-routes" class="panel">
                <h4>🚌 حجز مقاعد الخطوط الثابتة</h4>
                <div class="form-group">
                    <label>اختر خط السير المتوفر</label>
                    <select id="r-select" onchange="getStations()">
                        <option value="">-- اختر الخط --</option>
                    </select>
                </div>
                <div class="form-group"><label>محطة الركوب</label><select id="s-from"></select></div>
                <div class="form-group"><label>محطة النزول</label><select id="s-to"></select></div>
                <button class="btn btn-accent" onclick="bookSeat()">تأكيد حجز الكرسي</button>
                <div id="r-status" style="margin-top: 10px; font-weight: bold;"></div>
            </div>

            <!-- تبويب: اقتراح خط -->
            <div id="tab-suggest" class="panel">
                <h4>🗺️ اقتراح خط سير جديد للمنصة</h4>
                <div class="form-group"><label>نقطة البداية المقترحة</label><input type="text" id="sug-start" placeholder="مثال: مدينتي"></div>
                <div class="form-group"><label>نقطة النهاية المقترحة</label><input type="text" id="sug-end" placeholder="مثال: وسط البلد"></div>
                <button class="btn" onclick="suggestRoute()">إرسال المقترح للإدارة</button>
            </div>

            <!-- تبويب: رحلاتي ومتابعة الحجوزات -->
            <div id="tab-my-trips" class="panel">
                <h4>📋 رحلاتي الحالية وأكواد الـ OTP</h4>
                <div id="my-trips-list">جاري تحميل حجوزاتك الحية...</div>
            </div>
        </div>

        <!-- شريط التنقل السفلي السريع للموبايل -->
        <div class="bottom-nav">
            <button class="nav-item active" onclick="navTab('private', this)">🚗 خاص</button>
            <button class="nav-item" onclick="navTab('routes', this)">🚌 الخطوط</button>
            <button class="nav-item" onclick="navTab('suggest', this)">🗺️ اقتراح خط</button>
            <button class="nav-item" onclick="navTab('my-trips', this)">📋 رحلاتي</button>
        </div>
    </div>

    <script>
        // ضع مفتاحك ورابط مشروعك المستخرج هنا للربط المباشر
        const SUPABASE_URL = "https://supabase.co";
        const SUPABASE_KEY = "قم_بوضع_Publishable_Key_الخاص_بك_الذي_يبدأ_بـ_sb_pk_هنا"; 
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let map;

        async function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const type = document.getElementById('user-type').value;

            // إتاحة الدخول التجريبي الفوري بدون طلب قواعد حماية معقدة بالبداية
            if(email === "masry031@gmail.com" || email !== "") {
                const { data, error } = await _supabase.auth.signInWithPassword({ email, password });
                if(error) {
                    alert("تنبيه: سيتم الدخول كجلسة تجريبية مؤقتة لفحص الواجهة: " + error.message);
                }
                
                if(type === 'passenger') {
                    document.getElementById('screen-auth').style.display = 'none';
                    document.getElementById('screen-passenger').style.display = 'block';
                    initMap();
                    loadRoutes();
                } else {
                    window.location.href = 'captain.html';
                }
            }
        }

        async function signUp() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            if(!email || !password) return alert("اكتب الإيميل والباسورد أولاً");
            
            const { data, error } = await _supabase.auth.signUp({ email, password });
            if(error) alert("خطأ بالتسجيل: " + error.message);
            else alert("تم إرسال رابط التفعيل للميل بنجاح! راجع بريدك الإلكتروني.");
        }

        function initMap() {
            if (map) return;
            map = L.map('map', { fadeAnimation: false, zoomAnimation: false }).setView([30.0074, 31.4728], 13);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
            L.marker([30.0074, 31.4728]).addTo(map).bindPopup('موقعك الحالي بالتجمع الخامس').openPopup();
        }

        function navTab(target, btn) {
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById(`tab-${target}`).classList.add('active');
            if(target === 'my-trips') loadMyTrips();
        }

        async function loadRoutes() {
            const select = document.getElementById('r-select');
            const { data, error } = await _supabase.from('routes').select('*');
            if(data && data.length > 0) {
                select.innerHTML = '<option value="">-- اختر خط السير --</option>';
                data.forEach(r => select.innerHTML += `<option value="${r.id}">${r.name || 'خط التجمع - رمسيس'}</option>`);
            } else {
                select.innerHTML = '<option value="mock">خط التجمع الخامس - رمسيس الحركي</option>';
            }
        }

        function getStations() {
            const from = document.getElementById('s-from');
            const to = document.getElementById('s-to');
            const stations = ["التجمع الخامس", "زهراء مدينة نصر", "عباس العقاد", "رمسيس"];
            from.innerHTML = ""; to.innerHTML = "";
            stations.forEach((s, i) => {
