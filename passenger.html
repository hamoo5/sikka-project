<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كومبو - الرحلة المتكاملة</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        body { margin: 0; padding: 0; background: #070b19; color: #f8fafc; min-height: 100vh; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 440px; padding: 16px; margin: auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; background: #0f172a; padding: 12px 16px; border-radius: 16px; border: 1px solid #1e293b; }
        .user-info { display: flex; align-items: center; gap: 10px; }
        .avatar-circle { width: 34px; height: 34px; background: linear-gradient(135deg, #38bdf8, #2563eb); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 14px; color: #fff; }
        .user-welcome { font-size: 13px; font-weight: 700; color: #38bdf8; }
        .logout-btn { background: rgba(239, 68, 68, 0.1); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.3); padding: 5px 10px; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 11px; }
        .card-box { background: #0f172a; border: 1px solid #1e293b; border-radius: 20px; padding: 18px; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4); margin-bottom: 16px; }
        .card-title { font-size: 15px; font-weight: 800; color: #fff; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid #1e293b; padding-bottom: 8px; }
        .map-container { position: relative; width: 100%; height: 220px; margin-bottom: 10px; border-radius: 14px; overflow: hidden; border: 1px solid #334155; }
        #map { width: 100%; height: 100%; z-index: 1; }
        .form-group { margin-bottom: 12px; text-align: right; }
        .label { font-size: 11px; color: #94a3b8; margin-bottom: 4px; display: block; font-weight: 700; text-transform: uppercase; }
        .input-box { width: 100%; padding: 11px; border-radius: 12px; background: #050b14; border: 1px solid #334155; color: #fff; font-size: 13px; }
        .trip-summary { background: rgba(56, 189, 248, 0.08); border: 1px solid rgba(56, 189, 248, 0.3); border-radius: 12px; padding: 12px; margin-bottom: 12px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; text-align: center; }
        .summary-label { font-size: 9px; color: #94a3b8; font-weight: 700; margin-bottom: 2px; }
        .summary-value { font-size: 12px; color: #38bdf8; font-weight: 900; }
        .btn-request { background: linear-gradient(135deg, #38bdf8, #2563eb); color: #fff; border: none; padding: 14px; width: 100%; border-radius: 12px; font-weight: 800; font-size: 15px; cursor: pointer; margin-top: 6px; }
        .active-trip-box { background: rgba(56, 189, 248, 0.05); border: 1px solid #38bdf8; border-radius: 16px; padding: 20px; text-align: center; display: none; }
        .pin-display { font-size: 32px; font-weight: 900; letter-spacing: 6px; color: #38bdf8; margin: 12px 0; background: #050b14; padding: 10px; border-radius: 12px; border: 1px dashed #38bdf8; }
        .status-badge { background: rgba(234, 179, 8, 0.15); color: #eab308; border: 1px solid rgba(234, 179, 8, 0.3); padding: 5px 14px; border-radius: 16px; font-size: 12px; font-weight: 700; display: inline-block; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="user-info">
                <div class="avatar-circle">م</div>
                <div class="user-welcome">أهلاً، <span>محمد عبد</span></div>
            </div>
            <button class="logout-btn" onclick="logout()">خروج</button>
        </div>

        <div class="card-box" id="booking-card">
            <div class="card-title">🗺️ طلب رحلة كومبو الذكية</div>
            <div class="map-container"><div id="map"></div></div>

            <div class="trip-summary">
                <div><div class="summary-label">المسافة</div><div class="summary-value">25.7 كم</div></div>
                <div><div class="summary-label">الوقت المتوقع</div><div class="summary-value">27 دقيقة</div></div>
                <div><div class="summary-label">السعر الإجمالي</div><div class="summary-value">68.67 ج.م</div></div>
            </div>

            <div class="form-group">
                <label class="label" style="color: #22c55e;">🟢 نقطة الانطلاق</label>
                <input type="text" class="input-box" value="البحث الجنائي 65، قسم المعادي">
            </div>

            <div class="form-group">
                <label class="label" style="color: #ef4444;">🔴 نقطة الوصول</label>
                <input type="text" class="input-box" value="Garden 8، صلاح الدين عبد الكريم، القاهرة الجديدة">
            </div>

            <button class="btn-request" onclick="requestRide()">تأكيد وطلب الرحلة ⚡</button>
        </div>

        <div class="active-trip-box" id="active-trip-card">
            <span class="status-badge">⏳ الكابتن في طريقه إليك...</span>
            <div style="font-size: 12px; color: #94a3b8; margin-top: 14px; font-weight: 600;">رمز الأمان للرحلة (PIN):</div>
            <div class="pin-display">4829</div>
            <p style="font-size: 11px; color: #cbd5e1; margin: 0; line-height: 1.5;">أعطِ هذا الرقم للكابتن عند ركوب السيارة لتأكيد الرحلة.</p>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        let map;
        function initMap() {
            // إحداثيات المعادي و القاهرة الجديدة
            let pickup = [29.9602, 31.2569];
            let dropoff = [30.0333, 31.4333];

            map = L.map('map').setView(pickup, 12);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);
            
            L.marker(pickup, {icon: L.divIcon({html: '<div style="background:#22c55e;width:18px;height:18px;border-radius:50%;border:2px solid #fff"></div>', iconSize:[18,18]})}).addTo(map).bindPopup('الانطلاق');
            L.marker(dropoff, {icon: L.divIcon({html: '<div style="background:#ef4444;width:18px;height:18px;border-radius:50%;border:2px solid #fff"></div>', iconSize:[18,18]})}).addTo(map).bindPopup('الوصول');

            setTimeout(() => { map.invalidateSize(); }, 500);
        }
        function requestRide() {
            document.getElementById('booking-card').style.display = 'none';
            document.getElementById('active-trip-card').style.display = 'block';
        }
        function logout() { window.location.href = 'index.html'; }
        window.onload = initMap;
    </script>
</body>
</html>
