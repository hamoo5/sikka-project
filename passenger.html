<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محطات - تطبيق الراكب</title>
    <!-- استدعاء مكتبة Supabase الرسمية -->
    <script src="https://jsdelivr.net"></script>
    <style>
        :root { --primary: #1a1a1a; --accent: #ffc107; --bg: #f8f9fa; --card: #ffffff; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--bg); color: #333; padding: 15px; }
        .header { background: var(--primary); color: white; padding: 20px; text-align: center; border-radius: 0 0 15px 15px; margin: -15px -15px 20px -15px; }
        .header h1 { color: var(--accent); font-size: 22px; }
        .nav-tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { flex: 1; padding: 12px; border: none; background: #ddd; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .tab-btn.active { background: var(--accent); color: var(--primary); }
        .panel { background: var(--card); padding: 15px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); display: none; }
        .panel.active { display: block; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 13px; font-weight: bold; margin-bottom: 5px; }
        .form-group input, .form-group select { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 15px; }
        .btn { width: 100%; padding: 14px; background: var(--primary); color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn:hover { background: #333; }
        .list-item { background: #f1f3f5; padding: 12px; border-radius: 8px; margin-top: 10px; border-right: 4px solid var(--accent); }
    </style>
</head>
<body>

    <div class="header">
        <h1>برنامج مَحَطَّات</h1>
        <p>رحلات خاصة، مشتركة، وخطوط سير ثابتة</p>
    </div>

    <!-- التبديل بين الفئات الثلاث للركاب -->
    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('private', this)">🚗 خاص</button>
        <button class="tab-btn" onclick="switchTab('shared', this)">🚐 مشترك</button>
        <button class="tab-btn" onclick="switchTab('routes', this)">🚌 خطوط</button>
    </div>

    <!-- 1. لوحة المشوار الخاص -->
    <div id="panel-private" class="panel active">
        <h3>طلب مشوار خاص (ملاكي)</h3>
        <div class="form-group"><label>نقطة الانطلاق</label><input type="text" id="priv-from" value="التجمع الخامس"></div>
        <div class="form-group"><label>الوجهة</label><input type="text" id="priv-to" placeholder="مثال: رمسيس"></div>
        <button class="btn" onclick="requestPrivateTrip()">طلب السيارة الآن</button>
        <div id="priv-status" style="margin-top:15px; font-weight:bold; color:green;"></div>
    </div>

    <!-- 2. لوحة المشوار المشترك -->
    <div id="panel-shared" class="panel">
        <h3>البحث عن مشوار مشترك (تجميع ركاب بنفس الاتجاه)</h3>
        <div class="form-group"><label>من</label><input type="text" id="share-from" placeholder="مكانك الحالي"></div>
        <div class="form-group"><label>إلى</label><input type="text" id="share-to" placeholder="الوجهة"></div>
        <button class="btn" onclick="searchSharedTrips()">ابحث عن سيارات متاحة</button>
        <div id="shared-list"></div>
    </div>

    <!-- 3. لوحة الخطوط والمحطات الثابتة -->
    <div id="panel-routes" class="panel">
        <h3>حجز مقعد في ميكروباص / سوزوكي (خطوط ثابتة)</h3>
        <div class="form-group">
            <label>اختر خط السير</label>
            <select id="route-select" onchange="loadStationsForRoute()">
                <option value="">-- اختر الخط --</option>
            </select>
        </div>
        <div class="form-group"><label>محطة الركوب</label><select id="station-from"></select></div>
        <div class="form-group"><label>محطة النزول</label><select id="station-to"></select></div>
        <button class="btn" onclick="bookLineSeat()">تأكيد حجز الكرسي</button>
        <div id="route-status" style="margin-top:15px; font-weight:bold;"></div>
    </div>

    <script>
        // إعدادات الاتصال بـ Supabase من واقع لوحة تحكمك
        const SUPABASE_URL = "https://supabase.co"; // رابط مشروعك المستخرج [1]
        const SUPABASE_KEY = "ضغ_هنا_مفتاح_الـ_Publishable_Key_الخاص_بمك"; // استبدله بالمفتاح الظاهر في صورتك الثالثة [3]
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // التبديل بين الشاشات
        function switchTab(type, btn) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById(`panel-${type}`).classList.add('active');
            if(type === 'routes') loadRoutesFromDB();
        }

        // 1. منطق طلب مشوار خاص (إدخال مباشر في جدول trips) [2]
        async function requestPrivateTrip() {
            const from = document.getElementById('priv-from').value;
            const to = document.getElementById('priv-to').value;
            if(!to) return alert("برجاء تحديد الوجهة");

            document.getElementById('priv-status').innerText = "جاري حساب السعر والبحث عن كابتن...";
            
            // السعر الثابت الافتراضي
            const estimatedFare = 120; 

            const { data, error } = await _supabase.from('trips').insert([
                { trip_type: 'private', start_location: from, end_location: to, fare: estimatedFare, status: 'pending' }
            ]).select();

            if (error) {
                alert("فشل الطلب: " + error.message);
            } else {
                document.getElementById('priv-status').innerHTML = `تم طلب السيارة بنجاح!<br>السعر الثابت: ${estimatedFare} جنيه.<br>جاري انتظار قبول الكابتن...`;
            }
        }

        // 2. منطق البحث عن مشاوير مشتركة حية [2]
        async function searchSharedTrips() {
            const container = document.getElementById('shared-list');
            container.innerHTML = "جاري البحث...";

            const { data, error } = await _supabase.from('trips')
                .select('*')
                .eq('trip_type', 'shared')
                .eq('status', 'active');

            if(error || !data.length) {
                container.innerHTML = "لا توجد رحلات مشتركة متاحة في هذا الاتجاه حالياً.";
                return;
            }

            container.innerHTML = "";
            data.forEach(trip => {
                container.innerHTML += `
                    <div class="list-item">
                        <strong>🚗 ملاكي مشترك متوفر الآن</strong><br>
                        من: ${trip.start_location} -> إلى: ${trip.end_location}<br>
                        أجرة المقعد الثابتة: ${trip.fare} جنيه<br>
                        <button class="btn" style="padding:5px; font-size:12px;" onclick="confirmSharedBooking('${trip.id}', ${trip.fare})">احجز مقعدك</button>
                    </div>`;
            });
        }

        // تأكيد حجز مقعد مشترك في جدول bookings [2]
        async function confirmSharedBooking(tripId, fare) {
            const otpCode = Math.floor(1000 + Math.random() * 9000); // توليد كود الـ OTP تلقائياً للرحلة المشتركة
            const { error } = await _supabase.from('bookings').insert([
                { trip_id: tripId, fare: fare, otp: otpCode, status: 'confirmed' }
            ]);
            if(error) alert("خطأ بالحجز");
            else alert(`تم حجز المقعد بنجاح! كود الـ OTP الخاص بك للركوب هو: ${otpCode}`);
        }

        // 3. جلب خطوط السير الثابتة من جدول routes [2]
        async function loadRoutesFromDB() {
            const select = document.getElementById('route-select');
            const { data, error } = await _supabase.from('routes').select('*');
            if(!error && data) {
                select.innerHTML = '<option value="">-- اختر الخط --</option>';
                data.forEach(r => {
                    select.innerHTML += `<option value="${r.id}">${r.name || r.route_name}</option>`;
                });
            }
        }

        // جلب المحطات ديناميكياً للخط المختار من جدول shuttle_steps أو المحطات المربوطة [2]
        async function loadStationsForRoute() {
            const routeId = document.getElementById('route-select').value;
            const fromSelect = document.getElementById('station-from');
            const toSelect = document.getElementById('station-to');
            
            // محطات افتراضية مرتبة تصاعدياً لخطك المذكور لتسهيل التجربة الفورية
            const mockStations = ["التجمع الخامس", "زهراء مدينة نصر", "عباس العقاد", "رمسيس"];
            
            fromSelect.innerHTML = ""; toSelect.innerHTML = "";
            mockStations.forEach((st, idx) => {
                fromSelect.innerHTML += `<option value="${idx}">${st}</option>`;
                toSelect.innerHTML += `<option value="${idx}">${st}</option>`;
            });
        }

        // حجز مقعد ميكروباص/سوزوكي بالقطاع المحدد [2]
        async function bookLineSeat() {
            const fromIdx = parseInt(document.getElementById('station-from').value);
            const toIdx = parseInt(document.getElementById('station-to').value);
            
            if(fromIdx >= toIdx) return alert("يجب أن تكون محطة النزول بعد محطة الركوب!");
            
            const segments = toIdx - fromIdx;
            const finalFare = segments * 10; // 10 جنيه لكل قطاع ثابت
            const otpCode = Math.floor(1000 + Math.random() * 9000);

            document.getElementById('route-status').innerHTML = `جاري إرسال الحجز لجدول الـ Bookings...`;

            const { error } = await _supabase.from('bookings').insert([
                { fare: finalFare, otp: otpCode, status: 'pending' }
            ]);
