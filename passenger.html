<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>موقف - كومبو | واجهة الراكب</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />

  <style>
    body { font-family: system-ui, -apple-system, sans-serif; padding: 12px; background: #f4f4f9; direction: rtl; text-align: right; margin: 0; }
    .card { background: #fff; padding: 15px; border-radius: 12px; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    input, select, button { width: 100%; padding: 12px; margin: 6px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 15px; }
    button { background: #28a745; color: white; border: none; font-weight: bold; cursor: pointer; }
    button:hover { background: #218838; }
    .btn-secondary { background: #007bff; }
    .btn-gps { background: #17a2b8; }
    .btn-danger { background: #dc3545; }
    .mode-selector { display: flex; gap: 8px; margin-bottom: 12px; }
    .mode-btn { flex: 1; padding: 10px; background: #e9ecef; border: 2px solid #ccc; color: #333; border-radius: 8px; font-weight: bold; cursor: pointer; text-align: center; font-size: 14px; }
    .mode-btn.active { background: #007bff; color: white; border-color: #0056b3; }
    #map { height: 320px; width: 100%; border-radius: 10px; margin: 10px 0; border: 1px solid #ccc; z-index: 1; }
    .hidden { display: none; }
    .leaflet-routing-container { display: none !important; }
    #trip-status { background: #e8f4fd; border: 1px solid #b6effb; color: #055160; padding: 12px; border-radius: 8px; margin: 10px 0; font-size: 14px; line-height: 1.6; display: none; }
  </style>
</head>
<body>

  <!-- 1. شاشة تسجيل الدخول السريعة -->
  <div id="auth-section" class="card">
    <h2 style="text-align: center;">🚏 مشروع كومبو - الراكب</h2>
    <input type="text" id="user_name" placeholder="اسمك الكريم" value="أحمد">
    <input type="tel" id="user_phone" placeholder="رقم الموبايل" value="01112142750">
    <button class="btn-secondary" type="button" onclick="handleAuth()">دخول وحجز رحلة 🚀</button>
  </div>

  <!-- 2. واجهة الحجز والخريطة -->
  <div id="app-section" class="card hidden">
    <h3 style="margin-top:0;" id="app-title">🚏 تحديد خط السير والموقف</h3>

    <div class="mode-selector">
      <div id="mode-shared" class="mode-btn active" onclick="switchRideMode('shared')">🚐 خط سير / موقف (تشاركي)</div>
      <div id="mode-private" class="mode-btn" onclick="switchRideMode('private')">🚗 رحلة خاصة (ملاكي)</div>
    </div>
    
    <div id="booking-controls">
      <button class="btn-gps" type="button" onclick="getMyLocation()">📍 تحديد موقعي الحالي (GPS)</button>

      <div id="shared-options">
        <label style="font-weight:bold; font-size:13px; color:#555;">وسيلة النقل:</label>
        <select id="vehicle_type">
          <option value="microbus">🚐 ميكروباص (خطوط سير ومواقف)</option>
          <option value="suzuki">🚐 سوزوكي (تشاركي مرن)</option>
          <option value="private_shared">🚗 ملاكي تشاركي (حجز مقاعد)</option>
        </select>

        <label style="font-weight:bold; font-size:13px; color:#555; margin-top:6px; display:block;">عدد المقاعد:</label>
        <select id="seats_count">
          <option value="1">مقعد واحد (1)</option>
          <option value="2">مقعدان (2)</option>
          <option value="3">3 مقاعد</option>
          <option value="4">4 مقاعد</option>
        </select>
      </div>
      
      <label style="font-weight:bold; font-size:13px; color:#555; margin-top:8px; display:block;">موقف الانطلاق (الدبوس الأخضر 🟢):</label>
      <input type="text" id="pickup_loc" placeholder="اسحب الدبوس على الخريطة">

      <label style="font-weight:bold; font-size:13px; color:#555; margin-top:8px; display:block;">وجهة الوصول (الدبوس الأحمر 🔴):</label>
      <input type="text" id="dropoff_loc" placeholder="اسحب الدبوس الأحمر">
    </div>

    <div id="trip-status">اسحب الدبابيس على الخريطة لتحديد خط السير...</div>

    <button id="action-btn" type="button" onclick="requestRide()" style="background:#28a745;">🚀 تأكيد حجز المقاعد والرحلة</button>
    <button id="cancel-btn" type="button" class="btn-danger hidden" onclick="cancelRide()">❌ إلغاء الطلب</button>

    <div id="map"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL = 'https://pmpzilqpcomoodaksbhw.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_tjYI1IKegMFywNCqGPdKng_fSGIe7Zx';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let map, routingControl;
    let pickupCoords = null, dropoffCoords = null;
    let pickupMarker = null, dropoffMarker = null;
    let currentMode = 'shared';
    let currentTripId = null;

    const greenIcon = L.icon({
      iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-green.png',
      shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/images/marker-shadow.png',
      iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34], shadowSize: [41, 41]
    });

    const redIcon = L.icon({
      iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-red.png',
      shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/images/marker-shadow.png',
      iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34], shadowSize: [41, 41]
    });

    function switchRideMode(mode) {
      currentMode = mode;
      document.getElementById('mode-shared').classList.toggle('active', mode === 'shared');
      document.getElementById('mode-private').classList.toggle('active', mode === 'private');
      document.getElementById('shared-options').style.display = (mode === 'shared') ? 'block' : 'none';
      if (pickupCoords && dropoffCoords) drawRoute();
    }

    function handleAuth() {
      const name = document.getElementById('user_name').value || 'راكب';
      const phone = document.getElementById('user_phone').value;
      if (!phone) { alert('أدخل رقم الموبايل من فضلك'); return; }
      
      localStorage.setItem('passenger_name', name);
      localStorage.setItem('passenger_phone', phone);

      document.getElementById('auth-section').classList.add('hidden');
      document.getElementById('app-section').classList.remove('hidden');
      setTimeout(initMap, 200);
    }

    function initMap() {
      if (map) return;
      map = L.map('map').setView([30.0444, 31.2357], 13);
      
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { 
        attribution: '&copy; OpenStreetMap' 
      }).addTo(map);

      const center = map.getCenter();
      pickupCoords = center;
      pickupMarker = L.marker(center, {icon: greenIcon, draggable: true}).addTo(map);
      updatePickupAddress(center.lat, center.lng);

      pickupMarker.on('dragend', async function(e) {
        const pos = e.target.getLatLng();
        pickupCoords = pos;
        await updatePickupAddress(pos.lat, pos.lng);
        if (dropoffCoords) drawRoute();
      });

      const dropoffDefault = L.latLng(center.lat + 0.015, center.lng + 0.015);
      dropoffCoords = dropoffDefault;
      dropoffMarker = L.marker(dropoffDefault, {icon: redIcon, draggable: true}).addTo(map);
      updateDropoffAddress(dropoffDefault.lat, dropoffDefault.lng);

      dropoffMarker.on('dragend', async function(e) {
        const pos = e.target.getLatLng();
        dropoffCoords = pos;
        await updateDropoffAddress(pos.lat, pos.lng);
        if (pickupCoords) drawRoute();
      });

      drawRoute();
    }

    async function updatePickupAddress(lat, lng) {
      document.getElementById('pickup_loc').value = `${lat.toFixed(4)}, ${lng.toFixed(4)}`;
    }

    async function updateDropoffAddress(lat, lng) {
      document.getElementById('dropoff_loc').value = `${lat.toFixed(4)}, ${lng.toFixed(4)}`;
    }

    function drawRoute() {
      if (!pickupCoords || !dropoffCoords) return;
      if (routingControl) map.removeControl(routingControl);
      
      routingControl = L.Routing.control({
        waypoints: [pickupCoords, dropoffCoords],
        routeWhileDragging: false,
        addWaypoints: false,
        createMarker: function() { return null; },
        lineOptions: { styles: [{ color: '#007bff', opacity: 0.85, weight: 6 }] }
      }).addTo(map);

      routingControl.on('routesfound', function(e) {
        const routes = e.routes;
        if (routes && routes.length > 0) {
          const distanceKm = (routes[0].summary.totalDistance / 1000).toFixed(1);
          let estimatedPrice = (currentMode === 'shared') ? 
            Math.round((5 + (distanceKm * 2.5)) * parseInt(document.getElementById('seats_count').value)) : 
            Math.round(10 + (distanceKm * 5));

          const statusDiv = document.getElementById('trip-status');
          statusDiv.style.display = 'block';
          statusDiv.innerHTML = `📊 المسافة: ${distanceKm} كم | التكلفة التقريبية: <b>${estimatedPrice} جنيه</b>`;
        }
      });
    }

    function getMyLocation() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(async position => {
          const coords = L.latLng(position.coords.latitude, position.coords.longitude);
          pickupCoords = coords;
          pickupMarker.setLatLng(coords);
          document.getElementById('pickup_loc').value = `${coords.lat.toFixed(4)}, ${coords.lng.toFixed(4)}`;
          map.setView(coords, 16);
          if (dropoffCoords) drawRoute();
        });
      }
    }

    async function requestRide() {
      const pin = Math.floor(1000 + Math.random() * 9000);
      const vehicleType = (currentMode === 'shared') ? document.getElementById('vehicle_type').value : 'private_special';
      const seatsCount = (currentMode === 'shared') ? parseInt(document.getElementById('seats_count').value) : 1;
      
      const { data, error } = await supabase.from('trips').insert([
        {
          passenger_name: localStorage.getItem('passenger_name'),
          passenger_phone: localStorage.getItem('passenger_phone'),
          pickup_location: document.getElementById('pickup_loc').value,
          dropoff_location: document.getElementById('dropoff_loc').value,
          vehicle_type: vehicleType,
          seats_count: seatsCount,
          pin_code: pin,
          status: 'pending',
          pickup_lat: pickupCoords.lat,
          pickup_lng: pickupCoords.lng,
          dropoff_lat: dropoffCoords.lat,
          dropoff_lng: dropoffCoords.lng
        }
      ]).select();

      if (error) { alert('خطأ في إرسال الرحلة'); return; }

      if (data && data.length > 0) {
        currentTripId = data[0].id;
        supabase.channel(`trip_${currentTripId}`).on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'trips', filter: `id=eq.${currentTripId}` }, payload => {
          if (payload.new.status === 'accepted') {
            document.getElementById('trip-status').innerHTML = `🎉 تم قبول الرحلة! كود التحقق (PIN): <b>${payload.new.pin_code}</b>`;
          }
        }).subscribe();
      }

      document.getElementById('booking-controls').classList.add('hidden');
      document.getElementById('action-btn').classList.add('hidden');
      document.getElementById('cancel-btn').classList.remove('hidden');
      document.getElementById('trip-status').style.display = 'block';
      document.getElementById('trip-status').innerHTML = `🔄 تم إرسال الطلب بنجاح! كود الـ PIN الخاص بك: <b style="color:#d9534f; font-size:18px;">${pin}</b>`;
    }

    async function cancelRide() {
      if (currentTripId) await supabase.from('trips').update({ status: 'cancelled' }).eq('id', currentTripId);
      location.reload();
    }
  </script>
</body>
</html>
