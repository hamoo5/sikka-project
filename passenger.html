<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محطات - تطبيق الراكب الذكي</title>
    <!-- استدعاء مكتبة Supabase الرسمية -->
    <script src="https://jsdelivr.net"></script>
    <!-- استدعاء مكتبة الخرائط التفاعلية المجانية -->
    <link rel="stylesheet" href="https://unpkg.com" />
    <script src="https://unpkg.com"></script>
    <style>
        :root { --primary: #1a1a1a; --accent: #ffc107; --bg: #f8f9fa; --card: #ffffff; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--bg); color: #333; padding: 15px; }
        .header { background: var(--primary); color: white; padding: 20px; text-align: center; border-radius: 0 0 15px 15px; margin: -15px -15px 20px -15px; }
        .header h1 { color: var(--accent); font-size: 22px; }
        .auth-container, .app-container { display: none; max-width: 450px; margin: 0 auto; }
        .active-container { display: block; }
        .panel { background: var(--card); padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 15px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 13px; font-weight: bold; margin-bottom: 5px; }
        .form-group input, .form-group select { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 15px; }
        .nav-tabs { display: flex; gap: 10px; margin-bottom: 15px; }
        .tab-btn { flex: 1; padding: 12px; border: none; background: #ddd; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .tab-btn.active { background: var(--accent); color: var(--primary); }
        .btn { width: 100%; padding: 14px; background: var(--primary); color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 5px; }
        .btn-alt { background: none; color: var(--primary); border: 2px solid var(--primary); margin-top: 10px; }
        /* تصميم الخريطة لتبدو مدمجة وذكية */
        #map { height: 250px; width: 100%; border-radius: 12px; margin-bottom: 15px; box-shadow: inset 0 0 10px rgba(0,0,0,0.1); border: 1px solid #ddd; }
        .panel-content { display: none; }
        .panel-content.active { display: block; }
    </style>
</head>
<body>

    <div class="header">
        <h1>برنامج مَحَطَّات</h1>
        <p>ربط ذكي وتتبع مباشر للرحلات</p>
    </div>

    <!-- ==================== شاشة تسجيل الدخول وإنشاء الحساب ==================== -->
    <div id="auth-screen" class="auth-container active-container">
        <div class="panel">
            <h2 id="auth-title" style="margin-bottom:15px; text-align:center;">تسجيل الدخول</h2>
            <div class="form-group">
                <label>البريد الإلكتروني (أو رقم الموبايل كميل)</label>
                <input type="email" id="auth-email" placeholder="name@example.com">
            </div>
            <div class="form-group">
                <label>كلمة السر</label>
                <input type="password" id="auth-password" placeholder="أدخل كلمة السر">
            </div>
            <button class="btn" id="btn-primary-auth" onclick="handleAuth()">دخول</button>
            <button class="btn btn-alt" id="btn-toggle-auth" onclick="toggleAuthMode()">ليس لديك حساب؟ سجل الآن</button>
        </div>
    </div>

    <!-- ==================== شاشة التطبيق الرئيسية بعد الدخول ==================== -->
    <div id="app-screen" class="app-container">
        <!-- الخريطة الحية للتتبع -->
        <div id="map"></div>

        <div class="nav-tabs">
            <button class="tab-btn active" onclick="switchTab('private', this)">🚗 خاص</button>
            <button class="tab-btn" onclick="switchTab('shared', this)">🚐 مشترك</button>
            <button class="tab-btn" onclick="switchTab('routes', this)">🚌 خطوط</button>
        </div>

        <!-- 1. مشوار خاص -->
        <div id="panel-private" class="panel panel-content active">
            <h3>طلب مشوار ملاكي خاص</h3>
            <div class="form-group"><label>نقطة الانطلاق</label><input type="text" id="priv-from" value="التجمع الخامس - شارع التسعين"></div>
            <div class="form-group"><label>الوجهة</label><input type="text" id="priv-to" placeholder="أدخل وجهتك بالتحديد"></div>
            <button class="btn" onclick="requestPrivateTrip()">طلب السيارة الآن</button>
            <div id="priv-status" style="margin-top:10px; color:green; font-weight:bold;"></div>
        </div>

        <!-- 2. مشوار مشترك -->
        <div id="panel-shared" class="panel panel-content">
            <h3>مشاوير مشتركة قريبة</h3>
            <button class="btn" onclick="searchSharedTrips()">ابحث عن سيارات في اتجاهك</button>
            <div id="shared-list" style="margin-top:10px;"></div>
        </div>

        <!-- 3. خطوط ومحطات -->
        <div id="panel-routes" class="panel panel-content">
            <h3>حجز مقعد (ميكروباص / سوزوكي)</h3>
            <div class="form-group">
                <label>اختر خط السير</label>
                <select id="route-select" onchange="loadStations()">
                    <option value="">-- تحميل الخطوط من الداتا بيز --</option>
                </select>
            </div>
            <div class="form-group"><label>محطة الركوب</label><select id="station-from"></select></div>
            <div class="form-group"><label>محطة النزول</label><select id="station-to"></select></div>
            <button class="btn" onclick="bookLineSeat()">تأكيد حجز المقعد</button>
            <div id="route-status" style="margin-top:10px; font-weight:bold;"></div>
        </div>
        
        <button class="btn btn-alt" style="border-color:#dc3545; color:#dc3545;" onclick="handleLogout()">تسجيل الخروج</button>
    </div>

    <script>
        // دمج بيانات مشروعك المستخرجة من الصور الحية
        const SUPABASE_URL = "https://supabase.co"; 
        const SUPABASE_KEY = "قم_بنسخ_المفتاح_الكامل_الذي_يبدأ_بـ_sb_pk_من_صورتك_الثالثة_وضعه_هنا"; 
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let map, userMarker;
        let isSignUpMode = false;

        // تبديل واجهة الدخول / التسجيل
        function toggleAuthMode() {
            isSignUpMode = !isSignUpMode;
            document.getElementById('auth-title').innerText = isSignUpMode ? "إنشاء حساب جديد" : "تسجيل الدخول";
            document.getElementById('btn-primary-auth').innerText = isSignUpMode ? "سجل حسابك" : "دخول";
            document.getElementById('btn-toggle-auth').innerText = isSignUpMode ? "لديك حساب بالفعل؟ سجل دخولك" : "ليس لديك حساب؟ سجل الآن";
        }

        // معالجة الدخول والتسجيل عبر Supabase Auth الحقيقي
        async function handleAuth() {
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;

            if(!email || !password) return alert("برجاء إدخال البريد الإلكتروني وكلمة السر");

            if (isSignUpMode) {
                const { data, error } = await _supabase.auth.signUp({ email, password });
                if (error) alert("خطأ في التسجيل: " + error.message);
                else alert("تم إنشاء الحساب! برجاء مراجعة بريدك الإلكتروني لتأكيد الحساب ثم سجل دخولك.");
            } else {
                const { data, error } = await _supabase.auth.signInWithPassword({ email, password });
                if (error) alert("بيانات الدخول خاطئة: " + error.message);
                else checkUserSession();
            }
        }

        // فحص حالة الجلسة وتأمين شاشات التطبيق
        async function checkUserSession() {
            const { data: { session } } = await _supabase.auth.getSession();
            if (session) {
                document.getElementById('auth-screen').classList.remove('active-container');
                document.getElementById('app-screen').classList.add('active-container');
                initMap(); // تشغيل الخريطة فور الدخول الناجح
                loadRoutesFromDB();
            } else {
                document.getElementById('auth-screen').classList.add('active-container');
                document.getElementById('app-screen').classList.remove('active-container');
            }
        }

        // تسجيل الخروج
        async function handleLogout() {
            await _supabase.auth.signOut();
            checkUserSession();
        }

        // تهيئة وتشغيل الخريطة الحية للموقع الجغرافي للراكب والتتبع
        function initMap() {
            if (map) return; 
            // افتراضياً تفتح على إحداثيات القاهرة والتجمع الخامس بشكل دقيق جداً
            map = L.map('map').setView([30.0261, 31.4913], 13); 
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
            
            userMarker = L.marker([30.0261, 31.4913]).addTo(map)
                .bindPopup('موقعك الحالي في التجمع الخامس').openPopup();

            // محاولة جلب موقع الموبايل الحقيقي بالـ GPS لو الراكب سمح بالصلاحية
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(position => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    map.setView([lat, lon], 14);
                    userMarker.setLatLng([lat, lon]).bindPopup('تم تحديد موقعك بدقة').openPopup();
                });
            }
        }

        // التنقل بين فئات الركوب الثلاثة
        function switchTab(type, btn) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.panel-content').forEach(p => p.classList.remove('active'));
            btn.classList.add('active');
