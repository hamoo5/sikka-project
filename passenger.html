<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة كومبو - لوحة الراكب</title>
    <style>
        body { margin: 0; padding: 20px; font-family: 'Segoe UI', Tahoma, sans-serif; background: #0f172a; color: #fff; text-align: center; }
        .card { background: #1e293b; padding: 20px; border-radius: 12px; max-width: 400px; margin: auto; border: 1px solid #334155; }
        .user-img { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; margin-bottom: 10px; border: 2px solid #38bdf8; }
        .btn { background: #2563eb; color: #fff; border: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 15px; }
    </style>
</head>
<body>

    <div class="card">
        <h2>مشروع كومبو - الراكب 🚏</h2>
        
        <!-- مكان ظهور صورة المستخدم -->
        <div id="user-image-container"></div>
        
        <h3 id="display-name" style="color: #38bdf8; margin: 5px 0;">جاري التحميل...</h3>
        <p id="display-phone" style="color: #94a3b8; font-size: 14px;"></p>
        
        <hr style="border: 0; border-top: 1px solid #334155; margin: 15px 0;">
        
        <p style="font-size: 14px;">مرحباً بك في منصتك لحجز الرحلات والتوصيل</p>
        
        <button class="btn" onclick="logout()">تسجيل الخروج</button>
    </div>

    <script>
        // جلب بيانات المستخدم المسجل من الذاكرة المحلية
        const userData = JSON.parse(localStorage.getItem('combo_user'));

        if (!userData) {
            alert('يرجى تسجيل الدخول أولاً!');
            window.location.href = 'index.html';
        } else {
            // عرض البيانات الحقيقية للمستخدم
            document.getElementById('display-name').innerText = userData.full_name || 'مستخدم كومبو';
            document.getElementById('display-phone').innerText = userData.phone || '';

            if (userData.profile_image) {
                document.getElementById('user-image-container').innerHTML = `<img src="${userData.profile_image}" class="user-img" alt="صورة البروفايل">`;
            }
        }

        function logout() {
            localStorage.removeItem('combo_user');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
