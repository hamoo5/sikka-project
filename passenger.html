<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>كومبو - واجهة الراكب</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />

  <style>
    body { font-family: system-ui, -apple-system, sans-serif; padding: 12px; background: #f4f4f9; direction: rtl; text-align: right; margin: 0; }
    .card { background: #fff; padding: 15px; border-radius: 12px; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    input, button { width: 100%; padding: 12px; margin: 6px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 15px; }
    button { background: #28a745; color: white; border: none; font-weight: bold; cursor: pointer; }
    button:hover { background: #218838; }
    .btn-secondary { background: #007bff; }
    .btn-gps { background: #17a2b8; }
    .btn-fav { background: #ffc107; color: #222; }
    .btn-route { background: #6f42c1; }
    #map { height: 350px; width: 100%; border-radius: 10px; margin: 10px 0; border: 1px solid #ccc; z-index: 1; }
    .hidden { display: none; }
    .toggle-link { color: #007bff; text-align: center; cursor: pointer; margin-top: 10px; display: block; font-weight: bold; }
    .leaflet-routing-container { display: none !important; }
  </style>
</head>
<body>

  <!-- 1. تسجيل الدخول -->
  <div id="auth-section" class="card">
    <h2 id="auth-title">تسجيل دخول الراكب</h2>
    <div id="name-field" class="hidden">
      <input type="text" id="user_name" placeholder="الاسم الكامل">
    </div>
    <input type="tel" id="user_phone" placeholder="رقم الموبايل">
    <input type="password" id="user_password" placeholder="كلمة المرور">
    
    <button id="auth-btn" class="btn-secondary" onclick="handleAuth()">دخول</button>
    <span class="toggle-link" id="toggle-auth-mode" onclick="toggleAuthMode()">ليس لديك حساب؟ سجل حساب جديد</span>
  </div>

  <!-- 2. الخريطة والطلب -->
  <div id="app-section" class="card hidden">
    <h3 style="margin-top:0;">🗺️ تحديد موقع الرحلة وخط السير</h3>
    
    <button class="btn-gps" onclick="getMyLocation()">📍 تحديد موقعي الحالي (GPS)</button>
    
    <label style="font-weight:bold; font-size:13px; color:#555;">موقع الركوب (نقطة الانطلاق):</label>
    <div style="display:flex; gap:5px;">
      <input type="text" id="pickup_loc" placeholder="اكتب الشارع أو اضغط على الخريطة" style="margin:0;">
      <button style="width:30%; margin:0; background:#007bff;" onclick="searchLocation('pickup')">بحث</button>
    </div>

    <label style="font-weight:bold; font-size:13px; color:#555; margin-top:8px; display:block;">وجهة النزول (الوصول):</label>
    <div style="display:flex; gap:5px;">
      <input type="text" id="dropoff_loc" placeholder="اكتب الوجهة أو اضغط على الخريطة" style="margin:0;">
      <button style="width:30%; margin:0; background:#007bff;" onclick="searchLocation('dropoff')">بحث</button>
    </div>

    <button class="btn-route" onclick="drawRoute()">🛣️ عرض خط السير على الخريطة</button>

    <div id="map"></div>
    
    <button class="btn-fav" onclick="saveFavoriteTrip()">⭐ حفظ الرحلة في المفضلة</button>
    <button onclick="requestRide()">طلب المشوار الآن</button>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>

  <script type="module">
    import { supabase } from './supabase.js';

    let isRegistering = false;
    let map, routingControl;
    let pickupCoords = null;
    let dropoffCoords = null;
    let pickupMarker = null;
    let dropoffMarker = null;

    window.toggleAuthMode = function() {
      isRegistering = !isRegistering;
      document.getElementById('auth-title').innerText = isRegistering ? 'إنشاء حساب جديد' : 'تسجيل دخول الراكب';
      document.getElementById('name-field').classList.toggle('hidden', !isRegistering);
      document.getElementById('auth-btn').innerText = isRegistering ? 'إنشاء الحساب' : 'دخول';
      document.getElementById('toggle-auth-mode').innerText = isRegistering ? 'لديك حساب بالفعل؟ سجل دخولك' : 'ليس لديك حساب؟ سجل حساب جديد';
    };

    window.handleAuth = async function() {
      const phone = document.getElementById('user_phone').value;
      const password = document.getElementById('user_password').value;
      const name = document.getElementById('user_name').value;

      if (!phone || !password) { alert('من فضلك أدخل رقم الموبايل وكلمة المرور'); return; }

      if (isRegistering) {
        if (!name) { alert('من فضلك ادخل الاسم'); return; }
        const { error } = await supabase.from('users').insert([{ name, phone, password, role: 'passenger' }]);
        if (error) { alert('خطأ في التسجيل: ' + error.message); } 
        else { alert('تم إنشاء الحساب بنجاح! يمكنك الدخول الآن.'); toggleAuthMode(); }
      } else {
        const { data, error } = await supabase.from('users').select('*').eq('phone', phone).eq('password', password).single();
        if (error || !data) {
          alert('رقم الموبايل أو كلمة المرور غير صحيحة');
        } else {
          document.getElementById('auth-section').classList.add('hidden');
          document.getElementById('app-section').classList.remove('hidden');
          setTimeout(initMap, 200);
        }
      }
    };

    function initMap() {
      if (map) return;
      map = L.map('map').setView([30.0444, 31.2357], 13);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap'
      }).addTo(map);

      // الضغط المباشر على الخريطة لتحديد النقاط بالترتيب
      map.on('click', async function(e) {
        const lat = e.latlng.lat;
        const lng = e.latlng.lng;
        const coords = L.latLng(lat, lng);
        const address = await getAddressName(lat, lng);

        if (!pickupCoords) {
          pickupCoords = coords;
          document.getElementById('pickup_loc').value = address;
          if (pickupMarker) map.removeLayer(pickupMarker);
          pickupMarker = L.marker(coords).addTo(map);
          map.setView(coords, 14);
        } else if (!dropoffCoords) {
          dropoffCoords = coords;
          document.getElementById('dropoff_loc').value = address;
          if (dropoffMarker) map.removeLayer(dropoffMarker);
          dropoffMarker = L.marker(coords).addTo(map);
          map.setView(coords, 14);
          drawRoute();
        } else {
          pickupCoords = coords;
          document.getElementById('pickup_loc').value = address;
          if (pickupMarker) map.removeLayer(pickupMarker);
          pickupMarker = L.marker(coords).addTo(map);
          dropoffCoords = null;
          document.getElementById('dropoff_loc').value = '';
          if (dropoffMarker) map.removeLayer(dropoffMarker);
          if (routingControl) map.removeControl(routingControl);
          map.setView(coords, 14);
        }
      });
    }

    async function getAddressName(lat, lng) {
      try {
        const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&accept-language=ar`);
        const data = await res.json();
        if (data && data.display_name) {
          return data.display_name.split(',').slice(0, 3).join(',');
        }
      } catch (e) {}
      return `${lat.toFixed(4)}, ${lng.toFixed(4)}`;
    }

    window.searchLocation = async function(type) {
      const inputId = type === 'pickup' ? 'pickup_loc' : 'dropoff_loc';
      let query = document.getElementById(inputId).value;
      if (!query) { alert('اكتب اسم الشارع أو المنطقة أولاً للبحث'); return; }

      if (!query.includes('القاهرة') && !query.includes('الجيزة') && !query.includes('مصر')) {
        query += ", القاهرة, مصر";
      }

      try {
        const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&countrycodes=eg&limit=1&accept-language=ar`);
        const results = await res.json();
        
        if (results && results.length > 0) {
          const lat = parseFloat(results[0].lat);
          const lon = parseFloat(results[0].lon);
          const coords = L.latLng(lat, lon);
          
          if (type === 'pickup') {
            pickupCoords = coords;
            if (pickupMarker) map.removeLayer(pickupMarker);
            pickupMarker = L.marker(coords).addTo(map);
          } else {
            dropoffCoords = coords;
            if (dropoffMarker) map.removeLayer(dropoffMarker);
            dropoffMarker = L.marker(coords).addTo(map);
          }

          document.getElementById(inputId).value = results[0].display_name.split(',').slice(0, 3).join(',');
          map.setView(coords, 15);

          if (pickupCoords && dropoffCoords) {
            drawRoute();
          }
        } else {
          alert('لم يتم العثور على المكان، تأكد من كتابة اسم الشارع والمدينة بوضوح.');
        }
      } catch (e) {
        alert('حدث خطأ أثناء البحث.');
      }
    };

    window.drawRoute = function() {
      if (!pickupCoords || !dropoffCoords) {
        alert('حدد نقطة الركوب ونقطة الوصول أولاً');
        return;
      }

      if (routingControl) {
        map.removeControl(routingControl);
      }

      routingControl = L.Routing.control({
        waypoints: [pickupCoords, dropoffCoords],
        routeWhileDragging: false,
        addWaypoints: false,
        createMarker: function() { return null; },
        lineOptions: {
          styles: [{ color: '#007bff', opacity: 0.85, weight: 6 }]
        }
      }).addTo(map);
    };

    window.getMyLocation = function() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(async position => {
          const lat = position.coords.latitude;
          const lng = position.coords.longitude;
          pickupCoords = L.latLng(lat, lng);
          const address = await getAddressName(lat, lng);
          
          document.getElementById('pickup_loc').value = address;
          if (pickupMarker) map.removeLayer(pickupMarker);
          pickupMarker = L.marker(pickupCoords).addTo(map);
          map.setView(pickupCoords, 16);
        }, () => {
          alert('تعذر تحديد موقعك بالـ GPS.');
        });
      }
    };

    window.saveFavoriteTrip = function() {
      const pickup = document.getElementById('pickup_loc').value;
      const dropoff = document.getElementById('dropoff_loc').value;
      if (!pickup || !dropoff) { alert('حدد المكانين أولاً'); return; }
      localStorage.setItem('fav_pickup', pickup);
      localStorage.setItem('fav_dropoff', dropoff);
      alert('⭐ تم حفظ الرحلة في المفضلة!');
    };

    window.requestRide = async function() {
      const pickup = document.getElementById('pickup_loc').value;
      const dropoff = document.getElementById('dropoff_loc').value;
      if (!pickup || !dropoff) { alert('أكمل بيانات الرحلة أولاً'); return; }
      const { error } = await supabase.from('bookings').insert([{ pickup_location: pickup, dropoff_location: dropoff, trip_type: 'private', status: 'pending' }]);
      if (error) alert('خطأ: ' + error.message);
      else alert('تم إرسال طلب رحلتك بنجاح!');
    };
  </script>
</body>
</html>
