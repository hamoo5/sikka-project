<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كومبو - حجز رحلة ذكية</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        body { margin: 0; padding: 0; background: #070b19; color: #f8fafc; min-height: 100vh; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 440px; padding: 16px; margin: auto; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; background: #0f172a; padding: 12px 16px; border-radius: 16px; border: 1px solid #1e293b; }
        .user-info { display: flex; align-items: center; gap: 10px; }
        .avatar-circle { width: 34px; height: 34px; background: linear-gradient(135deg, #38bdf8, #2563eb); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 14px; color: #fff; }
        .user-welcome { font-size: 13px; font-weight: 700; color: #38bdf8; }
        .logout-btn { background: rgba(239, 68, 68, 0.1); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.3); padding: 5px 10px; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 11px; }

        .card-box { background: #0f172a; border: 1px solid #1e293b; border-radius: 20px; padding: 18px; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4); margin-bottom: 16px; }
        .card-title { font-size: 15px; font-weight: 800; color: #fff; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid #1e293b; padding-bottom: 8px; }

        #map { width: 100%; height: 240px; border-radius: 14px; border: 1px solid #334155; margin-bottom: 10px; z-index: 1; }
        
        .form-group { margin-bottom: 12px; text-align: right; }
        .label { font-size: 11px; color: #94a3b8; margin-bottom: 4px; display: block; font-weight: 700; text-transform: uppercase; }
        
        .input-box {
            width: 100%; padding: 12px; border-radius: 12px;
            background: #050b14; border: 1px solid #334155;
            color: #fff; font-size: 13px;
        }

        .mode-selector { display: flex; gap: 8px; margin-bottom: 10px; }
        .mode-btn { flex: 1; padding: 8px; border-radius: 10px; border: 1px solid #334155; background: #050b14; color: #94a3b8; font-size: 12px; font-weight: 700; cursor: pointer; text-align: center; }
        .mode-btn.active { border-color: #38bdf8; background: rgba(56, 189, 248, 0.1); color: #38bdf8; }

        .vehicle-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 6px; }
        .v-card {
            background: #050b14; border: 1px solid #334155;
            padding: 10px 6px; border-radius: 12px; text-align: center;
            cursor: pointer; transition: all 0.2s;
        }
        .v-card.active { border-color: #38bdf8; background: rgba(56, 189, 248, 0.08); }
        .v-name { font-size: 12px; font-weight: 700; color: #cbd5e1; margin-top: 4px; }
        .v-card.active .v-name { color: #38bdf8; }

        .btn-request {
            background: linear-gradient(135deg, #38bdf8, #2563eb);
            color: #fff; border: none; padding: 14px; width: 100%;
            border-radius: 12px; font-weight: 800; font-size: 15px;
            cursor: pointer; box-shadow: 0 6px 20px rgba(37, 99, 235, 0.4);
            margin-top: 6px;
        }

        .active-trip-box { background: rgba(56, 189, 248, 0.05); border: 1px solid #38bdf8; border-radius: 16px; padding: 20px; text-align: center; }
        .pin-display { font-size: 32px; font-weight: 900; letter-spacing: 6px; color: #38bdf8; margin: 12px 0; background: #050b14; padding: 10px; border-radius: 12px; border: 1px dashed #38bdf8; }
        .status-badge { background: rgba(234, 179, 8, 0.15); color: #eab308; border: 1px solid rgba(234, 179, 8, 0.3); padding: 5px 14px; border-radius: 16px; font-size: 12px; font-weight: 700; display: inline-block; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div class="user-info">
                <div class="avatar-circle" id="user-initial">ك</div>
                <div class="user-welcome">أهلاً، <span id="rider-name">جاري التحميل...</span></div>
            </div>
            <button class="logout-btn" onclick="logout()">خروج</button>
        </div>

        <div class="card-box" id="booking-card">
            <div class="card-title">🗺️ حدد خط سير الرحلة على الخريطة</div>

            <!-- أزرار التبديل لتحديد نقطة الانطلاق أو الوجهة -->
            <div class="mode-selector">
                <div class="mode-btn active" id="btn-mode-pickup" onclick="setSelectionMode('pickup')">📍 حدد نقطة الانطلاق</div>
                <div class="mode-btn" id="btn-mode-dropoff" onclick="setSelectionMode('dropoff')">🏁 حدد وجهة الوصول</div>
            </div>

            <div id="map"></div>
            <div style="font-size: 11px; color: #38bdf8; text-align: center; margin-bottom: 10px;" id="map-instruction">انقر على الخريطة لتحديد مكان الانطلاق بدقة</div>

            <div class="form-group">
                <label class="label">نقطة الانطلاق (موقع الركوب)</label>
                <input type="text" id="pickup-loc" class="input-box" placeholder="انقر على الخريطة لتحديده..." readonly>
            </div>

            <div class="form-group">
                <label class="label">وجهة الوصول (نقطة الوصول)</label>
                <input type="text" id="dropoff-loc" class="input-box" placeholder="اختر من زر الوجهة واضغط الخريطة..." readonly>
            </div>

            <div class="form-group">
                <label class="label">فئة المركبة</label>
                <div class="vehicle-grid">
                    <div class="v-card active" onclick="selectVehicle('ملاكي', this)">
                        <div style="font-size: 18px;">🚗</div>
                        <div class="v-name">ملاكي</div>
                    </div>
                    <div class="v-card" onclick="selectVehicle('سوزوكي', this)">
                        <div style="font-size: 18px;">🚐</div>
                        <div class="v-name">سوزوكي</div>
                    </div>
                    <div class="v-card" onclick="selectVehicle('ميكروباص', this)">
                        <div style="font-size: 18px;">🚌</div>
                        <div class="v-name">ميكروباص</div>
                    </div>
                </div>
            </div>

            <button class="btn-request" onclick="requestRide()">تأكيد وطلب الرحلة ⚡</button>
        </div>

        <div class="card-box" id="active-trip-card" style="display:none;">
            <div class="active-trip-box">
                <span class="status-badge" id="trip-status">⏳ في انتظار قبول الكابتن...</span>
                <div style="font-size: 12px; color: #94a3b8; margin-top: 14px; font-weight: 600;">رمز الأمان للرحلة (PIN):</div>
                <div class="pin-display" id="trip-pin">----</div>
                <p style="font-size: 11px; color: #cbd5e1; margin: 0; line-height: 1.5;">أعطِ هذا الرقم للكابتن عند ركوب السيارة.</p>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const SUPABASE_URL = 'https://pmpzilqpcomoodaksbhw.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_tjYI1IKegMFywNCqGPdKng_fSGIe7Zx';
        let supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = null;
        let selectedVehicleType = 'ملاكي';
        let map;
        let pickupMarker = null;
        let dropoffMarker = null;
        let currentMode = 'pickup'; // 'pickup' أو 'dropoff'

        function initRiderPage() {
            const stored = localStorage.getItem('combo_user');
            if (!stored) {
                window.location.href = 'rider-register.html';
                return;
            }
            currentUser = JSON.parse(stored);
            const name = currentUser.full_name || 'راكب كومبو';
            document.getElementById('rider-name').innerText = name;
            document.getElementById('user-initial').innerText = name.charAt(0);

            // إعداد خريطة واضحة ونظيفة بدون أخطاء API Keys
            map = L.map('map').setView([30.0444, 31.2357], 13);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; OpenStreetMap contributors',
                maxZoom: 19
            }).addTo(map);

            map.on('click', async function(e) {
                const lat = e.latlng.lat;
                const lon = e.latlng.lng;

                try {
                    let response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&accept-language=ar`);
                    let data = await response.json();
                    let addressName = data.display_name || 'موقع محدد على الخريطة';

                    if (currentMode === 'pickup') {
                        if (pickupMarker) map.removeLayer(pickupMarker);
                        pickupMarker = L.marker([lat, lon], {
                            icon: L.icon({
                                iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-green.xout.png' // تفادي الأخطاء أو استخدام الافتراضي
                            })
                        }).addTo(map);
                        document.getElementById('pickup-loc').value = addressName;
                        pickupMarker.bindPopup(`<b>📍 الانطلاق:</b><br>${addressName}`).openPopup();
                    } else {
                        if (dropoffMarker) map.removeLayer(dropoffMarker);
                        dropoffMarker = L.marker([lat, lon]).addTo(map);
                        document.getElementById('dropoff-loc').value = addressName;
                        dropoffMarker.bindPopup(`<b>🏁 الوجهة:</b><br>${addressName}`).openPopup();
                    }
                } catch (err) {
                    alert('تعذر جلب اسم الشارع، حاول مرة أخرى.');
                }
            });
        }

        function setSelectionMode(mode) {
            currentMode = mode;
            document.getElementById('btn-mode-pickup').classList.remove('active');
            document.getElementById('btn-mode-dropoff').classList.remove('active');

            if (mode === 'pickup') {
                document.getElementById('btn-mode-pickup').classList.add('active');
                document.getElementById('map-instruction').innerText = 'انقر على الخريطة لتحديد مكان الانطلاق بدقة';
            } else {
                document.getElementById('btn-mode-dropoff').classList.add('active');
                document.getElementById('map-instruction').innerText = 'انقر على الخريطة لتحديد وجهة الوصول بدقة';
            }
        }

        function selectVehicle(type, element) {
            selectedVehicleType = type;
            document.querySelectorAll('.v-card').forEach(el => el.classList.remove('active'));
            element.classList.add('active');
        }

        async function requestRide() {
            const pickup = document.getElementById('pickup-loc').value.trim();
            const dropoff = document.getElementById('dropoff-loc').value.trim();

            if (!pickup) {
                alert('يرجى تحديد نقطة الانطلاق على الخريطة أولاً.');
                return;
            }
            if (!dropoff) {
                alert('يرجى تحديد وجهة الوصول على الخريطة أولاً.');
                return;
            }

            const generatedPin = Math.floor(1000 + Math.random() * 9000).toString();

            document.getElementById('booking-card').style.display = 'none';
            document.getElementById('active-trip-card').style.display = 'block';
            document.getElementById('trip-pin').innerText = generatedPin;
        }

        function logout() {
            localStorage.removeItem('combo_user');
            window.location.href = 'rider-register.html';
        }

        initRiderPage();
    </script>
</body>
</html>
