<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>كومبو - واجهة الراكب</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />

  <style>
    body { font-family: system-ui, -apple-system, sans-serif; padding: 12px; background: #f4f4f9; direction: rtl; text-align: right; margin: 0; }
    .card { background: #fff; padding: 15px; border-radius: 12px; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    input, button { width: 100%; padding: 12px; margin: 6px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 15px; }
    button { background: #28a745; color: white; border: none; font-weight: bold; cursor: pointer; }
    button:hover { background: #218838; }
    .btn-secondary { background: #007bff; }
    .btn-gps { background: #17a2b8; }
    #map { height: 350px; width: 100%; border-radius: 10px; margin: 10px 0; border: 1px solid #ccc; z-index: 1; }
    .hidden { display: none; }
    .toggle-link { color: #007bff; text-align: center; cursor: pointer; margin-top: 10px; display: block; font-weight: bold; }
    .leaflet-routing-container { display: none !important; }
    #trip-status { background: #e8f4fd; border: 1px solid #b6effb; color: #055160; padding: 12px; border-radius: 8px; margin: 10px 0; font-size: 14px; line-height: 1.6; display: none; }
  </style>
</head>
<body>

  <!-- 1. تسجيل الدخول -->
  <div id="auth-section" class="card">
    <h2 id="auth-title">تسجيل دخول الراكب</h2>
    <div id="name-field" class="hidden">
      <input type="text" id="user_name" placeholder="الاسم الكامل">
    </div>
    <input type="tel" id="user_phone" placeholder="رقم الموبايل">
    <input type="password" id="user_password" placeholder="كلمة المرور">
    
    <button id="auth-btn" class="btn-secondary" onclick="handleAuth()">دخول</button>
    <span class="toggle-link" id="toggle-auth-mode" onclick="toggleAuthMode()">ليس لديك حساب؟ سجل حساب جديد</span>
  </div>

  <!-- 2. الخريطة والطلب -->
  <div id="app-section" class="card hidden">
    <h3 style="margin-top:0;">🗺️ حجز وتحديد الرحلة</h3>
    
    <button class="btn-gps" onclick="getMyLocation()">📍 تحديد موقعي الحالي (GPS)</button>
    
    <label style="font-weight:bold; font-size:13px; color:#555;">موقع الركوب (نقطة الانطلاق - أخضر 🟢):</label>
    <div style="display:flex; gap:5px;">
      <input type="text" id="pickup_loc" placeholder="اكتب الشارع أو اضغط على الخريطة" style="margin:0;">
      <button style="width:30%; margin:0; background:#007bff;" onclick="searchPickupLocation()">بحث</button>
    </div>

    <label style="font-weight:bold; font-size:13px; color:#555; margin-top:8px; display:block;">وجهة النزول (الوصول - أحمر 🔴):</label>
    <div style="display:flex; gap:5px;">
      <input type="text" id="dropoff_loc" placeholder="اكتب وجهة النزول أو اضغط الخريطة" style="margin:0;">
      <button style="width:30%; margin:0; background:#007bff;" onclick="searchDropoffLocation()">بحث</button>
    </div>

    <!-- صندوق تفاصيل الرحلة يظهر أوتوماتيك -->
    <div id="trip-status">حدد نقطة الانطلاق والوصول ليتم حساب الرحلة أوتوماتيكياً...</div>

    <button onclick="requestRide()" style="background:#28a745;">🚀 تأكيد وطلب المشوار الآن</button>

    <div id="map"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>

  <script type="module">
    import { supabase } from './supabase.js';

    let isRegistering = false;
    let map, routingControl;
    let pickupCoords = null, dropoffCoords = null;
    let pickupMarker = null, dropoffMarker = null, captainMarker = null;
    let activeBookingId = null;

    const greenIcon = L.icon({
      iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-green.png',
      shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/images/marker-shadow.png',
      iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34], shadowSize: [41, 41]
    });

    const redIcon = L.icon({
      iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-red.png',
      shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/images/marker-shadow.png',
      iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34], shadowSize: [41, 41]
    });

    window.toggleAuthMode = function() {
      isRegistering = !isRegistering;
      document.getElementById('auth-title').innerText = isRegistering ? 'إنشاء حساب جديد' : 'تسجيل دخول الراكب';
      document.getElementById('name-field').classList.toggle('hidden', !isRegistering);
      document.getElementById('auth-btn').innerText = isRegistering ? 'إنشاء الحساب' : 'دخول';
      document.getElementById('toggle-auth-mode').innerText = isRegistering ? 'لديك حساب بالفعل؟ سجل دخولك' : 'ليس لديك حساب؟ سجل حساب جديد';
    };

    window.handleAuth = async function() {
      const phone = document.getElementById('user_phone').value;
      const password = document.getElementById('user_password').value;
      const name = document.getElementById('user_name').value;

      if (!phone || !password) { alert('أدخل رقم الموبايل وكلمة المرور'); return; }

      if (isRegistering) {
        if (!name) { alert('ادخل الاسم'); return; }
        const { error } = await supabase.from('users').insert([{ name, phone, password, role: 'passenger' }]);
        if (error) { alert('خطأ: ' + error.message); } 
        else { alert('تم إنشاء الحساب بنجاح!'); toggleAuthMode(); }
      } else {
        const { data, error } = await supabase.from('users').select('*').eq('phone', phone).eq('password', password).single();
        if (error || !data) {
          alert('رقم الموبايل أو كلمة المرور غير صحيحة');
        } else {
          document.getElementById('auth-section').classList.add('hidden');
          document.getElementById('app-section').classList.remove('hidden');
          setTimeout(initMap, 200);
        }
      }
    };

    function initMap() {
      if (map) return;
      map = L.map('map').setView([30.0444, 31.2357], 13);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap'
      }).addTo(map);

      map.on('click', async function(e) {
        const lat = e.latlng.lat, lng = e.latlng.lng;
        const coords = L.latLng(lat, lng);
        const address = await getAddressName(lat, lng);

        if (!pickupCoords) {
          pickupCoords = coords;
          document.getElementById('pickup_loc').value = address;
          if (pickupMarker) { pickupMarker.setLatLng(coords); } 
          else { 
            pickupMarker = L.marker(coords, {icon: greenIcon, draggable: true}).addTo(map);
            pickupMarker.on('dragend', async function(event) {
              const pos = event.target.getLatLng();
              pickupCoords = pos;
              document.getElementById('pickup_loc').value = await getAddressName(pos.lat, pos.lng);
              if (pickupCoords && dropoffCoords) drawRoute();
            });
          }
          map.setView(coords, 14);
        } else if (!dropoffCoords) {
          dropoffCoords = coords;
          document.getElementById('dropoff_loc').value = address;
          if (dropoffMarker) { dropoffMarker.setLatLng(coords); } 
          else { 
            dropoffMarker = L.marker(coords, {icon: redIcon, draggable: true}).addTo(map);
            dropoffMarker.on('dragend', async function(event) {
              const pos = event.target.getLatLng();
              dropoffCoords = pos;
              document.getElementById('dropoff_loc').value = await getAddressName(pos.lat, pos.lng);
              if (pickupCoords && dropoffCoords) drawRoute();
            });
          }
          map.setView(coords, 14);
          drawRoute(); // رسم المسار أوتوماتيك بمجرد اكتمال النقطتين
        } else {
          pickupCoords = coords;
          document.getElementById('pickup_loc').value = address;
          if (pickupMarker) { pickupMarker.setLatLng(coords); } 
          else { 
            pickupMarker = L.marker(coords, {icon: greenIcon, draggable: true}).addTo(map);
          }
          dropoffCoords = null;
          document.getElementById('dropoff_loc').value = '';
          if (dropoffMarker) { map.removeLayer(dropoffMarker); dropoffMarker = null; }
          if (routingControl) map.removeControl(routingControl);
          document.getElementById('trip-status').style.display = 'none';
          map.setView(coords, 14);
        }
      });
    }

    async function getAddressName(lat, lng) {
      try {
        const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&accept-language=ar`);
        const data = await res.json();
        if (data && data.display_name) return data.display_name.split(',').slice(0, 3).join(',');
      } catch (e) {}
      return `${lat.toFixed(4)}, ${lng.toFixed(4)}`;
    }

    window.searchPickupLocation = async function() {
      let query = document.getElementById('pickup_loc').value;
      if (!query) { alert('اكتب مكان الانطلاق أولاً'); return; }
      if (!query.includes('القاهرة') && !query.includes('الجيزة') && !query.includes('مصر')) query += ", القاهرة, مصر";

      try {
        const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&countrycodes=eg&limit=1&accept-language=ar`);
        const results = await res.json();
        if (results && results.length > 0) {
          pickupCoords = L.latLng(parseFloat(results[0].lat), parseFloat(results[0].lon));
          document.getElementById('pickup_loc').value = results[0].display_name.split(',').slice(0, 3).join(',');
          
          if (pickupMarker) {
            pickupMarker.setLatLng(pickupCoords);
          } else {
            pickupMarker = L.marker(pickupCoords, {icon: greenIcon, draggable: true}).addTo(map);
            pickupMarker.on('dragend', async function(event) {
              const pos = event.target.getLatLng();
              pickupCoords = pos;
              document.getElementById('pickup_loc').value = await getAddressName(pos.lat, pos.lng);
              if (pickupCoords && dropoffCoords) drawRoute();
            });
          }
          map.setView(pickupCoords, 15);
          if (pickupCoords && dropoffCoords) drawRoute(); // رسم المسار أوتوماتيك
        } else {
          alert('لم يتم العثور على مكان الانطلاق');
        }
      } catch (e) { alert('خطأ في البحث'); }
    };

    window.searchDropoffLocation = async function() {
      let query = document.getElementById('dropoff_loc').value;
      if (!query) { alert('اكتب وجهة الوصول أولاً'); return; }
      if (!query.includes('القاهرة') && !query.includes('الجيزة') && !query.includes('مصر')) query += ", القاهرة, مصر";

      try {
        const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&countrycodes=eg&limit=1&accept-language=ar`);
        const results = await res.json();
        if (results && results.length > 0) {
          dropoffCoords = L.latLng(parseFloat(results[0].lat), parseFloat(results[0].lon));
          document.getElementById('dropoff_loc').value = results[0].display_name.split(',').slice(0, 3).join(',');
          
          if (dropoffMarker) {
            dropoffMarker.setLatLng(dropoffCoords);
          } else {
            dropoffMarker = L.marker(dropoffCoords, {icon: redIcon, draggable: true}).addTo(map);
            dropoffMarker.on('dragend', async function(event) {
              const pos = event.target.getLatLng();
              dropoffCoords = pos;
              document.getElementById('dropoff_loc').value = await getAddressName(pos.lat, pos.lng);
              if (pickupCoords && dropoffCoords) drawRoute();
            });
          }
          map.setView(dropoffCoords, 15);
          if (pickupCoords && dropoffCoords) drawRoute(); // رسم المسار أوتوماتيك
        } else {
          alert('لم يتم العثور على وجهة الوصول');
        }
      } catch (e) { alert('خطأ في البحث'); }
    };

    function drawRoute() {
      if (!pickupCoords || !dropoffCoords) return;
      if (routingControl) map.removeControl(routingControl);
      
      routingControl = L.Routing.control({
        waypoints: [pickupCoords, dropoffCoords],
        routeWhileDragging: false,
        addWaypoints: false,
        createMarker: function() { return null; },
        lineOptions: { styles: [{ color: '#007bff', opacity: 0.85, weight: 6 }] }
      }).addTo(map);

      routingControl.on('routesfound', function(e) {
        const routes = e.routes;
        if (routes && routes.length > 0) {
          const summary = routes[0].summary;
          const distanceKm = (summary.totalDistance / 1000).toFixed(1);
          const durationMin = Math.round(summary.totalTime / 60);
          const estimatedPrice = Math.round(10 + (distanceKm * 5));

          const statusDiv = document.getElementById('trip-status');
          statusDiv.style.display = 'block';
          statusDiv.innerHTML = `
            📊 <b>تفاصيل الرحلة المتاحة:</b><br>
            📏 المسافة: ${distanceKm} كم | ⏱️ الوقت التقديري: ${durationMin} دقيقة<br>
            💰 السعر المقدر: ${estimatedPrice} جنيه
          `;
        }
      });
    }

    window.getMyLocation = function() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(async position => {
          const lat = position.coords.latitude, lng = position.coords.longitude;
          pickupCoords = L.latLng(lat, lng);
          const address = await getAddressName(lat, lng);
          document.getElementById('pickup_loc').value = address;
          
          if (pickupMarker) {
            pickupMarker.setLatLng(pickupCoords);
          } else {
            pickupMarker = L.marker(pickupCoords, {icon: greenIcon, draggable: true}).addTo(map);
            pickupMarker.on('dragend', async function(event) {
              const pos = event.target.getLatLng();
              pickupCoords = pos;
              document.getElementById('pickup_loc').value = await getAddressName(pos.lat, pos.lng);
              if (pickupCoords && dropoffCoords) drawRoute();
            });
          }
          map.setView(pickupCoords, 16);
          if (pickupCoords && dropoffCoords) drawRoute();
        }, () => { alert('تعذر تحديد موقعك بالـ GPS.'); });
      }
    };

    window.requestRide = async function() {
      const pickup = document.getElementById('pickup_loc').value;
      const dropoff = document.getElementById('dropoff_loc').value;
      if (!pickup || !dropoff) { alert('أكمل بيانات الرحلة'); return; }

      const { data, error } = await supabase.from('bookings').insert([{ 
        pickup_location: pickup, 
        dropoff_location: dropoff, 
        status: 'pending',
        pickup_lat: pickupCoords ? pickupCoords.lat : 30.0444,
        pickup_lng: pickupCoords ? pickupCoords.lng : 31.2357
      }]).select();

      if (error) {
        alert('خطأ في الطلب: ' + error.message);
      } else {
        activeBookingId = data[0].id;
        const statusDiv = document.getElementById('trip-status');
        statusDiv.style.display = 'block';
        statusDiv.innerHTML = "🔄 تم إرسال طلبك بنجاح، جاري البحث عن كابتن قريب منك...";
      }
    };
  </script>
</body>
</html>
