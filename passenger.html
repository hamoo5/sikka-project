<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>كومبو - واجهة الراكب</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * { box-sizing: border-box; font-family: Tahoma, sans-serif; }
        body { background: #121212; color: #fff; margin: 0; padding: 0; direction: rtl; }
        .top-bar { background: #000; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; }
        .container { padding: 12px; }
        .card { background: #1e1e1e; padding: 16px; border-radius: 12px; margin-bottom: 12px; border: 1px solid #333; }
        .btn { background: #fff; color: #000; border: none; padding: 14px; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; width: 100%; text-align: center; margin-top: 10px; }
        .btn-green { background: #00875a; color: #fff; }
        .btn-blue { background: #0288d1; color: #fff; margin-bottom: 8px; padding: 10px; font-size: 13px; }
        input { width: 100%; padding: 12px; margin-top: 6px; margin-bottom: 4px; background: #2a2a2a; border: 1px solid #444; color: #fff; border-radius: 8px; font-size: 14px; }
        label { font-size: 13px; color: #bbb; }
        .map-container { width: 100%; height: 260px; border-radius: 10px; margin: 10px 0; border: 1px solid #444; z-index: 1; }
        .pin-box { font-size: 32px; font-weight: bold; letter-spacing: 8px; color: #00e676; background: #111; padding: 12px; border-radius: 8px; text-align: center; margin: 10px 0; border: 1px dashed #00e676; }
        
        /* تصميم الشات */
        .chat-box { background: #181818; border: 1px solid #333; border-radius: 10px; padding: 10px; height: 180px; overflow-y: auto; margin-top: 10px; display: flex; flex-direction: column; gap: 8px; }
        .chat-msg { max-width: 80%; padding: 8px 12px; border-radius: 8px; font-size: 13px; }
        .chat-msg.me { background: #00875a; color: #fff; align-self: flex-end; }
        .chat-msg.other { background: #333; color: #fff; align-self: flex-start; }
    </style>
</head>
<body>

    <div class="top-bar">
        <span style="font-weight: bold; font-size: 16px;">🚗 كومبو - طلب رحلة</span>
        <a href="captain.html" style="color: #00e676; text-decoration: none; font-size: 13px; font-weight: bold;">صفحة الكابتن ➔</a>
    </div>

    <div class="container">
        <!-- شاشة الطلب -->
        <div class="card" id="passengerFormCard">
            <h3 style="margin-top:0;">📍 حدد موقع الانطلاق والوجهة بدقة</h3>
            <button class="btn btn-blue" onclick="getMyLocation()">📍 استخدام موقعي الحالي على الخريطة</button>

            <label>مكان الاستلام (من):</label>
            <input type="text" id="pStartInput" placeholder="اسم الشارع..." />

            <label>الوجهة (إلى):</label>
            <input type="text" id="pEndInput" placeholder="الوجهة..." />

            <div id="passengerMap" class="map-container"></div>

            <div style="background:#2a2a2a; padding:10px; border-radius:8px; font-size:13px; margin-top:8px;">
                📏 المسافة: <b id="txtDistance" style="color:#00e676;">0 كم</b> | ⏱️ الوقت: <b id="txtDuration" style="color:#ff9800;">0 دقيقة</b> | 💰 السعر: <b id="txtPrice" style="color:#00e676;">0 ج.م</b>
            </div>

            <label style="margin-top:8px; display:block;">رقم الهاتف:</label>
            <input type="tel" id="pPhone" placeholder="01xxxxxxxxx" maxlength="11" />

            <button class="btn btn-green" onclick="requestTripFinal()">اطلب الرحلة الآن 🚀</button>
        </div>

        <!-- شاشة متابعة الرحلة والشات -->
        <div class="card" id="passengerStatusCard" style="display:none; text-align:center;">
            <span style="display:inline-block; padding:6px 12px; border-radius:6px; background:#333; color:#ff9800; font-weight:bold;" id="tripStateBadge">⏳ جاري البحث عن كابتن...</span>
            
            <div id="passengerPinContainer" style="margin-top:15px;">
                <label>كود الـ PIN الخاص بك (أعطه للكابتن عند الركوب):</label>
                <div class="pin-box" id="tripPinCode">----</div>
            </div>

            <hr style="border-color:#333; margin:15px 0;">

            <!-- الشات المباشر -->
            <h4 style="text-align:right; margin:5px 0;">💬 المحادثة مع الكابتن</h4>
            <div class="chat-box" id="pChatBox">
                <div class="chat-msg other">تم إنشاء الطلب وفي انتظار قبول الكابتن</div>
            </div>
            <div style="display:flex; gap:6px; margin-top:8px;">
                <input type="text" id="pChatInput" placeholder="اكتب رسالتك للكابتن..." style="margin:0;">
                <button class="btn btn-green" style="width:70px; margin:0;" onclick="sendPassengerMessage()">إرسال</button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://pmpzilqpcomoodaksbhw.supabase.co";
        const SUPABASE_KEY = "sb_publishable_tjYI1IKegMFywNCqGPdKng_fSGIe7Zx";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let passMap = null, startLat = 30.0561, startLng = 31.3285, endLat = 29.9602, endLng = 31.2569;
        let startMarker, endMarker, routeLayer;
        let calculatedDistKm = 5.0, calculatedMin = 15, finalPrice = 75;
        let activeTripId = null, generatedPin = Math.floor(1000 + Math.random() * 9000).toString();

        window.onload = function() {
            passMap = L.map('passengerMap').setView([startLat, startLng], 13);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(passMap);
            startMarker = L.marker([startLat, startLng], {draggable: true}).addTo(passMap);
            endMarker = L.marker([endLat, endLng], {draggable: true}).addTo(passMap);

            startMarker.on('dragend', () => { startLat = startMarker.getLatLng().lat; startLng = startMarker.getLatLng().lng; fetchRouteOSRM(); });
            endMarker.on('dragend', () => { endLat = endMarker.getLatLng().lat; endLng = endMarker.getLatLng().lng; fetchRouteOSRM(); });

            document.getElementById('pStartInput').value = "طريق النصر";
            document.getElementById('pEndInput').value = "شارع صلاح الدين";
            fetchRouteOSRM();
        };

        function getMyLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition((pos) => {
                    startLat = pos.coords.latitude; startLng = pos.coords.longitude;
                    startMarker.setLatLng([startLat, startLng]);
                    passMap.setView([startLat, startLng], 15);
                    fetchRouteOSRM();
                }, null, { enableHighAccuracy: true });
            }
        }

        async function fetchRouteOSRM() {
            try {
                const res = await (await fetch(`https://router.project-osrm.org/route/v1/driving/${startLng},${startLat};${endLng},${endLat}?overview=full&geometries=geojson`)).json();
                if (res.routes && res.routes.length > 0) {
                    const route = res.routes[0];
                    calculatedDistKm = (route.distance / 1000);
                    calculatedMin = Math.round(route.duration / 60);
                    finalPrice = Math.round(20 + (calculatedDistKm * 6.5) + (calculatedMin * 1.2));

                    document.getElementById('txtDistance').innerText = `${calculatedDistKm.toFixed(1)} كم`;
                    document.getElementById('txtDuration').innerText = `${calculatedMin} دقيقة`;
                    document.getElementById('txtPrice').innerText = `${finalPrice} ج.م`;

                    if (routeLayer) passMap.removeLayer(routeLayer);
                    routeLayer = L.geoJSON(route.geometry, { style: { color: '#00e676', weight: 5 } }).addTo(passMap);
                }
            } catch (e) {}
        }

        async function requestTripFinal() {
            const phone = document.getElementById('pPhone').value.trim();
            if (!phone || phone.length < 11) { alert('الرجاء إدخال رقم هاتف صحيح'); return; }

            const { data, error } = await supabaseClient.from('trips_data').insert([{
                start_station: document.getElementById('pStartInput').value || "موقعي",
                end_station: document.getElementById('pEndInput').value || "الوجهة",
                trip_price: `${finalPrice} ج.م`,
                user_mobile: phone,
                trip_pin: generatedPin,
                status: 'pending',
                notes: ''
            }]).select();

            if (data && data.length > 0) {
                activeTripId = data[0].id;
                document.getElementById('passengerFormCard').style.display = 'none';
                document.getElementById('passengerStatusCard').style.display = 'block';
                document.getElementById('tripPinCode').innerText = generatedPin;
                listenToTripUpdates();
            }
        }

        function listenToTripUpdates() {
            setInterval(async () => {
                if (!activeTripId) return;
                const { data } = await supabaseClient.from('trips_data').select('*').eq('id', activeTripId).single();
                if (data) {
                    if (data.status === 'accepted') document.getElementById('tripStateBadge').innerText = "🚗 الكابتن قبل الرحلة وهو في الطريق إليك";
                    else if (data.status === 'arrived') document.getElementById('tripStateBadge').innerText = "📍 الكابتن وصل لموقعك وانتظارك جاري (3 دقائق)";
                    else if (data.status === 'started') document.getElementById('tripStateBadge').innerText = "🚀 الرحلة جارية الآن نحو الوجهة";
                    else if (data.status === 'cancelled') document.getElementById('tripStateBadge').innerText = "❌ تم إلغاء الرحلة لعدم الحضور - تم إضافة غرامة 20 ج.م عليك";

                    if (data.notes && data.notes !== window.lastChat) {
                        window.lastChat = data.notes;
                        const chatBox = document.getElementById('pChatBox');
                        chatBox.innerHTML = `<div class="chat-msg other">${data.notes}</div>`;
                    }
                }
            }, 2500);
        }

        async function sendPassengerMessage() {
            const txt = document.getElementById('pChatInput').value.trim();
            if (!txt || !activeTripId) return;
            const chatBox = document.getElementById('pChatBox');
            chatBox.innerHTML += `<div class="chat-msg me">راكب: ${txt}</div>`;
            document.getElementById('pChatInput').value = '';

            await supabaseClient.from('trips_data').update({ notes: `راكب: ${txt}` }).eq('id', activeTripId);
        }
    </script>
</body>
</html>
