<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كومبو - حجز رحلة ذكية</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        body { margin: 0; padding: 0; background: #070b19; color: #f8fafc; min-height: 100vh; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 440px; padding: 16px; margin: auto; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; background: #0f172a; padding: 12px 16px; border-radius: 16px; border: 1px solid #1e293b; }
        .user-info { display: flex; align-items: center; gap: 10px; }
        .avatar-circle { width: 34px; height: 34px; background: linear-gradient(135deg, #38bdf8, #2563eb); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 14px; color: #fff; }
        .user-welcome { font-size: 13px; font-weight: 700; color: #38bdf8; }
        .logout-btn { background: rgba(239, 68, 68, 0.1); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.3); padding: 5px 10px; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 11px; }

        .card-box { background: #0f172a; border: 1px solid #1e293b; border-radius: 20px; padding: 18px; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4); margin-bottom: 16px; }
        .card-title { font-size: 15px; font-weight: 800; color: #fff; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid #1e293b; padding-bottom: 8px; }

        /* حاوية الخريطة الحية */
        .map-container { position: relative; width: 100%; height: 230px; margin-bottom: 10px; }
        #map { width: 100%; height: 100%; border-radius: 14px; border: 1px solid #334155; z-index: 1; }

        /* أزرار التبديل لاختيار الدبوس المراد تحريكه */
        .pin-switcher { display: flex; gap: 6px; margin-bottom: 8px; }
        .pin-switch-btn { flex: 1; padding: 8px; border-radius: 10px; border: 1px solid #334155; background: #050b14; color: #94a3b8; font-size: 12px; font-weight: 700; cursor: pointer; text-align: center; }
        .pin-switch-btn.active-pickup { border-color: #22c55e; background: rgba(34, 197, 94, 0.15); color: #22c55e; }
        .pin-switch-btn.active-dropoff { border-color: #ef4444; background: rgba(239, 68, 68, 0.15); color: #ef4444; }

        .gps-btn {
            position: absolute; bottom: 12px; left: 12px; z-index: 1000;
            background: #0f172a; color: #38bdf8; border: 1px solid #38bdf8;
            padding: 6px 10px; border-radius: 8px; font-size: 11px; font-weight: 700;
            cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        
        .form-group { margin-bottom: 12px; text-align: right; }
        .label { font-size: 11px; color: #94a3b8; margin-bottom: 4px; display: block; font-weight: 700; text-transform: uppercase; }
        
        .input-box {
            width: 100%; padding: 11px; border-radius: 12px;
            background: #050b14; border: 1px solid #334155;
            color: #fff; font-size: 13px;
        }
        .input-box:focus { border-color: #38bdf8; outline: none; }

        .vehicle-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 6px; }
        .v-card {
            background: #050b14; border: 1px solid #334155;
            padding: 10px 6px; border-radius: 12px; text-align: center;
            cursor: pointer; transition: all 0.2s;
        }
        .v-card.active { border-color: #38bdf8; background: rgba(56, 189, 248, 0.08); }
        .v-name { font-size: 12px; font-weight: 700; color: #cbd5e1; margin-top: 4px; }
        .v-card.active .v-name { color: #38bdf8; }

        .btn-request {
            background: linear-gradient(135deg, #38bdf8, #2563eb);
            color: #fff; border: none; padding: 14px; width: 100%;
            border-radius: 12px; font-weight: 800; font-size: 15px;
            cursor: pointer; box-shadow: 0 6px 20px rgba(37, 99, 235, 0.4);
            margin-top: 6px;
        }

        .active-trip-box { background: rgba(56, 189, 248, 0.05); border: 1px solid #38bdf8; border-radius: 16px; padding: 20px; text-align: center; }
        .pin-display { font-size: 32px; font-weight: 900; letter-spacing: 6px; color: #38bdf8; margin: 12px 0; background: #050b14; padding: 10px; border-radius: 12px; border: 1px dashed #38bdf8; }
        .status-badge { background: rgba(234, 179, 8, 0.15); color: #eab308; border: 1px solid rgba(234, 179, 8, 0.3); padding: 5px 14px; border-radius: 16px; font-size: 12px; font-weight: 700; display: inline-block; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div class="user-info">
                <div class="avatar-circle" id="user-initial">ك</div>
                <div class="user-welcome">أهلاً، <span id="rider-name">جاري التحميل...</span></div>
            </div>
            <button class="logout-btn" onclick="logout()">خروج</button>
        </div>

        <div class="card-box" id="booking-card">
            <div class="card-title">🗺️ الخريطة الحية - حدد موقعك ووجهتك</div>

            <!-- أزرار التبديل لاختيار الدبوس المراد تحريكه على الخريطة -->
            <div class="pin-switcher">
                <div class="pin-switch-btn active-pickup" id="switch-pickup" onclick="setActivePin('pickup')">📍 تحريك دبوس الانطلاق</div>
                <div class="pin-switch-btn" id="switch-dropoff" onclick="setActivePin('dropoff')">🏁 تحريك دبوس الوصول</div>
            </div>

            <div class="map-container">
                <div id="map"></div>
                <button class="gps-btn" onclick="goToCurrentLocation()">🎯 موقعي</button>
            </div>
            <div style="font-size: 11px; color: #38bdf8; text-align: center; margin-bottom: 10px;" id="map-hint">حرك الخريطة لتعديل مكان الانطلاق الأخضر</div>

            <div class="form-group">
                <label class="label">1. نقطة الانطلاق (مكان الركوب)</label>
                <input type="text" id="pickup-loc" class="input-box" placeholder="اختر من الخريطة أو اكتب هنا...">
            </div>

            <div class="form-group">
                <label class="label">2. نقطة الوصول (مكان النزول)</label>
                <input type="text" id="dropoff-loc" class="input-box" placeholder="اختر من الخريطة أو اكتب هنا...">
            </div>

            <div class="form-group">
                <label class="label">فئة المركبة</label>
                <div class="vehicle-grid">
                    <div class="v-card active" onclick="selectVehicle('ملاكي', this)">
                        <div style="font-size: 18px;">🚗</div>
                        <div class="v-name">ملاكي</div>
                    </div>
                    <div class="v-card" onclick="selectVehicle('سوزوكي', this)">
                        <div style="font-size: 18px;">🚐</div>
                        <div class="v-name">سوزوكي</div>
                    </div>
                    <div class="v-card" onclick="selectVehicle('ميكروباص', this)">
                        <div style="font-size: 18px;">🚌</div>
                        <div class="v-name">ميكروباص</div>
                    </div>
                </div>
            </div>

            <button class="btn-request" onclick="requestRide()">تأكيد وطلب الرحلة ⚡</button>
        </div>

        <div class="card-box" id="active-trip-card" style="display:none;">
            <div class="active-trip-box">
                <span class="status-badge" id="trip-status">⏳ في انتظار قبول الكابتن...</span>
                <div style="font-size: 12px; color: #94a3b8; margin-top: 14px; font-weight: 600;">رمز الأمان للرحلة (PIN):</div>
                <div class="pin-display" id="trip-pin">----</div>
                <p style="font-size: 11px; color: #cbd5e1; margin: 0; line-height: 1.5;">أعطِ هذا الرقم للكابتن عند ركوب السيارة.</p>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const SUPABASE_URL = 'https://pmpzilqpcomoodaksbhw.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_tjYI1IKegMFywNCqGPdKng_fSGIe7Zx';
        let supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = null;
        let selectedVehicleType = 'ملاكي';
        let map;
        let pickupMarker, dropoffMarker;
        let activePinType = 'pickup'; // 'pickup' أو 'dropoff'

        function initRiderPage() {
            const stored = localStorage.getItem('combo_user');
            if (!stored) {
                window.location.href = 'rider-register.html';
                return;
            }
            currentUser = JSON.parse(stored);
            const name = currentUser.full_name || 'راكب كومبو';
            document.getElementById('rider-name').innerText = name;
            document.getElementById('user-initial').innerText = name.charAt(0);

            // تشغيل الخريطة الحية على القاهرة
            map = L.map('map').setView([30.0444, 31.2357], 14);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '&copy; OpenStreetMap'
            }).addTo(map);

            // إنشاء الدبوس الأخضر للانطلاق في المنتصف
            pickupMarker = L.marker([30.0444, 31.2357], {draggable: true}).addTo(map)
                .bindPopup('موقع الانطلاق (اختر أو حرك الدبوس)');

            // إنشاء الدبوس الأحمر للوصول قريب منه
            dropoffMarker = L.marker([30.0500, 31.2500], {draggable: true}).addTo(map)
                .bindPopup('موقع الوصول (اختر أو حرك الدبوس)');

            // تحديث العنوان عند سحب وإفلات الدبوس الأخضر
            pickupMarker.on('dragend', async function(e) {
                const pos = e.target.getLatLng();
                updateAddressFromLatLng(pos.lat, pos.lng, 'pickup');
            });

            // تحديث العنوان عند سحب وإفلات الدبوس الأحمر
            dropoffMarker.on('dragend', async function(e) {
                const pos = e.target.getLatLng();
                updateAddressFromLatLng(pos.lat, pos.lng, 'dropoff');
            });

            // النقر على الخريطة لتحريك الدبوس النشط حالياً
            map.on('click', function(e) {
                const lat = e.latlng.lat;
                const lng = e.latlng.lng;

                if (activePinType === 'pickup') {
                    pickupMarker.setLatLng([lat, lng]);
                    updateAddressFromLatLng(lat, lng, 'pickup');
                } else {
                    dropoffMarker.setLatLng([lat, lng]);
                    updateAddressFromLatLng(lat, lng, 'dropoff');
                }
            });

            // جلب العناوين الابتدائية للدبابيس
            updateAddressFromLatLng(30.0444, 31.2357, 'pickup');
            updateAddressFromLatLng(30.0500, 31.2500, 'dropoff');
        }

        // تبديل الدبوس النشط (الانطلاق أو الوصول)
        function setActivePin(type) {
            activePinType = type;
            const pickupBtn = document.getElementById('switch-pickup');
            const dropoffBtn = document.getElementById('switch-dropoff');
            const hint = document.getElementById('map-hint');

            if (type === 'pickup') {
                pickupBtn.className = 'pin-switch-btn active-pickup';
                dropoffBtn.className = 'pin-switch-btn';
                hint.innerText = 'حرك الخريطة أو انقر لتعديل مكان الانطلاق الأخضر';
                map.panTo(pickupMarker.getLatLng());
            } else {
                dropoffBtn.className = 'pin-switch-btn active-dropoff';
                pickupBtn.className = 'pin-switch-btn';
                hint.innerText = 'حرك الخريطة أو انقر لتعديل مكان الوصول الأحمر';
                map.panTo(dropoffMarker.getLatLng());
            }
        }

        // جلب اسم الشارع والموقع الجغرافي باللغة العربية
        async function updateAddressFromLatLng(lat, lng, type) {
            const inputId = type === 'pickup' ? 'pickup-loc' : 'dropoff-loc';
            try {
                let response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&accept-language=ar`);
                let data = await response.json();
                if (data.display_name) {
                    document.getElementById(inputId).value = data.display_name;
                }
            } catch (err) {
                document.getElementById(inputId).value = `خط عرض: ${lat.toFixed(4)}, طول: ${lng.toFixed(4)}`;
            }
        }

        function goToCurrentLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(position => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    map.setView([lat, lon], 16);
                    if (activePinType === 'pickup') {
                        pickupMarker.setLatLng([lat, lon]);
                        updateAddressFromLatLng(lat, lon, 'pickup');
                    } else {
                        dropoffMarker.setLatLng([lat, lon]);
                        updateAddressFromLatLng(lat, lon, 'dropoff');
                    }
                }, () => {
                    alert('تعذر تحديد موقعك الحالي.');
                });
            } else {
                alert('متصفحك لا يدعم تحديد الموقع.');
            }
        }

        function selectVehicle(type, element) {
            selectedVehicleType = type;
            document.querySelectorAll('.v-card').choice = type;
            document.querySelectorAll('.v-card').forEach(el => el.classList.remove('active'));
            element.classList.add('active');
        }

        async function requestRide() {
            const pickup = document.getElementById('pickup-loc').value.trim();
            const dropoff = document.getElementById('dropoff-loc').value.trim();

            if (!pickup || !dropoff) {
                alert('يرجى تحديد نقطة الانطلاق والوصول بدقة.');
                return;
            }

            const generatedPin = Math.floor(1000 + Math.random() * 9000).toString();

            document.getElementById('booking-card').style.display = 'none';
            document.getElementById('active-trip-card').style.display = 'block';
            document.getElementById('trip-pin').innerText = generatedPin;
        }

        function logout() {
            localStorage.removeItem('combo_user');
            window.location.href = 'rider-register.html';
        }

        initRiderPage();
    </script>
</body>
</html>
