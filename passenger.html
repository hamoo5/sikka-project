<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كومبو - حجز رحلة ذكية</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        body { margin: 0; padding: 0; background: #070b19; color: #f8fafc; min-height: 100vh; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 440px; padding: 16px; margin: auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; background: #0f172a; padding: 12px 16px; border-radius: 16px; border: 1px solid #1e293b; }
        .user-info { display: flex; align-items: center; gap: 10px; }
        .avatar-circle { width: 34px; height: 34px; background: linear-gradient(135deg, #38bdf8, #2563eb); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 14px; color: #fff; }
        .user-welcome { font-size: 13px; font-weight: 700; color: #38bdf8; }
        .logout-btn { background: rgba(239, 68, 68, 0.1); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.3); padding: 5px 10px; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 11px; }
        .card-box { background: #0f172a; border: 1px solid #1e293b; border-radius: 20px; padding: 18px; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4); margin-bottom: 16px; }
        .card-title { font-size: 15px; font-weight: 800; color: #fff; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid #1e293b; padding-bottom: 8px; }
        .map-container { position: relative; width: 100%; height: 210px; margin-bottom: 10px; }
        #map { width: 100%; height: 100%; border-radius: 14px; border: 1px solid #334155; z-index: 1; }
        .gps-btn { position: absolute; bottom: 12px; left: 12px; z-index: 1000; background: #0f172a; color: #38bdf8; border: 1px solid #38bdf8; padding: 6px 12px; border-radius: 8px; font-size: 11px; font-weight: 700; cursor: pointer; }
        .form-group { margin-bottom: 12px; text-align: right; }
        .label { font-size: 11px; color: #94a3b8; margin-bottom: 4px; display: block; font-weight: 700; text-transform: uppercase; }
        .input-row { display: flex; gap: 6px; }
        .input-box { flex: 1; padding: 11px; border-radius: 12px; background: #050b14; border: 1px solid #334155; color: #fff; font-size: 13px; }
        .search-btn { background: #1e293b; color: #38bdf8; border: 1px solid #334155; padding: 0 12px; border-radius: 12px; font-weight: 700; font-size: 12px; cursor: pointer; }
        .trip-summary { background: rgba(56, 189, 248, 0.08); border: 1px solid rgba(56, 189, 248, 0.3); border-radius: 12px; padding: 12px; margin-bottom: 12px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; text-align: center; }
        .summary-item { display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .summary-label { font-size: 9px; color: #94a3b8; font-weight: 700; margin-bottom: 2px; }
        .summary-value { font-size: 12px; color: #38bdf8; font-weight: 900; }
        .vehicle-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 6px; }
        .v-card { background: #050b14; border: 1px solid #334155; padding: 8px 4px; border-radius: 12px; text-align: center; cursor: pointer; }
        .v-card.active { border-color: #38bdf8; background: rgba(56, 189, 248, 0.08); }
        .v-name { font-size: 11px; font-weight: 700; color: #cbd5e1; margin-top: 4px; }
        .btn-request { background: linear-gradient(135deg, #38bdf8, #2563eb); color: #fff; border: none; padding: 14px; width: 100%; border-radius: 12px; font-weight: 800; font-size: 15px; cursor: pointer; margin-top: 6px; }
        .active-trip-box { background: rgba(56, 189, 248, 0.05); border: 1px solid #38bdf8; border-radius: 16px; padding: 20px; text-align: center; display: none; }
        .pin-display { font-size: 32px; font-weight: 900; letter-spacing: 6px; color: #38bdf8; margin: 12px 0; background: #050b14; padding: 10px; border-radius: 12px; border: 1px dashed #38bdf8; }
        .status-badge { background: rgba(234, 179, 8, 0.15); color: #eab308; border: 1px solid rgba(234, 179, 8, 0.3); padding: 5px 14px; border-radius: 16px; font-size: 12px; font-weight: 700; display: inline-block; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="user-info">
                <div class="avatar-circle" id="user-initial">ك</div>
                <div class="user-welcome">أهلاً، <span id="rider-name">محمد عبد</span></div>
            </div>
            <button class="logout-btn" onclick="logout()">خروج</button>
        </div>

        <div class="card-box" id="booking-card">
            <div class="card-title">🗺️ حجز رحلة - مسار الشوارع الذكي</div>
            <div class="map-container">
                <div id="map"></div>
                <button class="gps-btn" onclick="goToCurrentLocation()">🎯 موقعي</button>
            </div>

            <div class="trip-summary">
                <div class="summary-item"><div class="summary-label">المسافة</div><div class="summary-value" id="trip-distance">-- كم</div></div>
                <div class="summary-item"><div class="summary-label">الوقت</div><div class="summary-value" id="trip-duration">-- دقيقة</div></div>
                <div class="summary-item"><div class="summary-label">حالة الطريق</div><div class="summary-value" id="traffic-status" style="font-size: 11px;">--</div></div>
                <div class="summary-item"><div class="summary-label">السعر</div><div class="summary-value" id="trip-price">-- ج.م</div></div>
            </div>

            <div class="form-group">
                <label class="label" style="color: #22c55e;">🟢 نقطة الانطلاق</label>
                <div class="input-row">
                    <input type="text" id="pickup-loc" class="input-box" value="ميدان التحرير، قصر الدوبارة، القاهرة">
                    <button class="search-btn" onclick="searchLocation('pickup')">بحث</button>
                </div>
            </div>

            <div class="form-group">
                <label class="label" style="color: #ef4444;">🔴 نقطة الوصول</label>
                <div class="input-row">
                    <input type="text" id="dropoff-loc" class="input-box" value="13A، شارع بستان الدكم، عرابي">
                    <button class="search-btn" onclick="searchLocation('dropoff')">بحث</button>
                </div>
            </div>

            <div class="form-group">
                <label class="label">فئة المركبة</label>
                <div class="vehicle-grid">
                    <div class="v-card active" onclick="selectVehicle('ملاكي', this, 10, 2.0)"><div style="font-size: 16px;">🚗</div><div class="v-name">ملاكي</div></div>
                    <div class="v-card" onclick="selectVehicle('سكوتر', this, 7, 1.5)"><div style="font-size: 16px;">🛵</div><div class="v-name">سكوتر</div></div>
                    <div class="v-card" onclick="selectVehicle('سوزوكي', this, 8, 1.8)"><div style="font-size: 16px;">🚐</div><div class="v-name">سوزوكي</div></div>
                    <div class="v-card" onclick="selectVehicle('ميكروباص', this, 5, 1.2)"><div style="font-size: 16px;">🚌</div><div class="v-name">ميكروباص</div></div>
                </div>
            </div>

            <button class="btn-request" onclick="requestRide()">تأكيد وطلب الرحلة ⚡</button>
        </div>

        <div class="active-trip-box" id="active-trip-card">
            <span class="status-badge" id="trip-status">⏳ الكابتن في طريقه إليك...</span>
            <div style="font-size: 12px; color: #94a3b8; margin-top: 14px; font-weight: 600;">رمز الأمان للرحلة (PIN):</div>
            <div class="pin-display" id="trip-pin">4829</div>
            <p style="font-size: 11px; color: #cbd5e1; margin: 0; line-height: 1.5;">تابع تحرك الكابتن لايف على الخريطة بالأعلى.</p>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const SUPABASE_URL = 'https://pmpzilqpcomoodaksbhw.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_tjYI1IKegMFywNCqGPdKng_fSGIe7Zx';
        let supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let map, pickupMarker, dropoffMarker, captainLiveMarker, routeLayer;
        let ratePerKm = 10, ratePerMinute = 2.0;
        let rawRouteDistanceKm = 3.2, rawRouteDurationMin = 5;

        const greenPin = L.divIcon({ html: '<div style="background-color: #22c55e; width: 22px; height: 22px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); border: 2px solid #fff;"></div>', iconSize: [22,22], iconAnchor: [11,22] });
        const redPin = L.divIcon({ html: '<div style="background-color: #ef4444; width: 22px; height: 22px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); border: 2px solid #fff;"></div>', iconSize: [22,22], iconAnchor: [11,22] });
        const captainPin = L.divIcon({ html: '<div style="background-color: #2563eb; width: 24px; height: 24px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 0 10px rgba(0,0,0,0.5);"></div>', iconSize: [24,24], iconAnchor: [12,12] });

        function initMap() {
            map = L.map('map').setView([30.0444, 31.2357], 14);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

            pickupMarker = L.marker([30.0444, 31.2357], {icon: greenPin}).addTo(map).bindPopup('الانطلاق');
            dropoffMarker = L.marker([30.0550, 31.2450], {icon: redPin}).addTo(map).bindPopup('الوصول');

            fetchAndDrawRoute([31.2357, 30.0444], [31.2450, 30.0550]);
            listenToCaptainLive();
        }

        async function fetchAndDrawRoute(start, end) {
            try {
                let res = await fetch(`https://router.project-osrm.org/route/v1/driving/${start[0]},${start[1]};${end[0]},${end[1]}?overview=full&geometries=geojson`);
                let data = await res.json();
                if(data.routes && data.routes.length > 0) {
                    let route = data.routes[0];
                    rawRouteDistanceKm = route.distance / 1000;
                    rawRouteDurationMin = route.duration / 60;
                    document.getElementById('trip-distance').innerText = rawRouteDistanceKm.toFixed(1) + ' كم';
                    document.getElementById('trip-duration').innerText = Math.ceil(rawRouteDurationMin) + ' دقيقة';
                    document.getElementById('trip-price').innerText = Math.round(15 + (rawRouteDistanceKm * ratePerKm) + (rawRouteDurationMin * ratePerMinute)) + ' ج.م';
                    document.getElementById('traffic-status').innerText = '🟢 سالك';
                    
                    let coords = route.geometry.coordinates.map(c => [c[1], c[0]]);
                    if(routeLayer) map.removeLayer(routeLayer);
                    routeLayer = L.polyline(coords, {color: '#2563eb', weight: 6, opacity: 0.9}).addTo(map);
                    map.fitBounds(routeLayer.getBounds(), {padding: [30,30]});
                }
            } catch(e) {}
        }

        function listenToCaptainLive() {
            supabaseClient.channel('live-tracking')
                .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'trips' }, payload => {
                    let lat = payload.new.captain_lat;
                    let lng = payload.new.captain_lng;
                    if(lat && lng) {
                        if(!captainLiveMarker) {
                            captainLiveMarker = L.marker([lat, lng], {icon: captainPin}).addTo(map).bindPopup('الكابتن يتحرك إليك').openPopup();
                        } else {
                            captainLiveMarker.setLatLng([lat, lng]);
                        }
                    }
                }).subscribe();
        }

        function requestRide() {
            document.getElementById('booking-card').style.display = 'none';
            document.getElementById('active-trip-card').style.display = 'block';
        }

        function selectVehicle(type, el, km, min) {
            ratePerKm = km; ratePerMinute = min;
            document.querySelectorAll('.v-card').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
            fetchAndDrawRoute([31.2357, 30.0444], [31.2450, 30.0550]);
        }

        function logout() { localStorage.removeItem('combo_user'); window.location.href = 'rider-register.html'; }
        initMap();
    </script>
</body>
</html>
