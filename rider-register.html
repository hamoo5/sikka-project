<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كومبو راكب - حجز الرحلات والتنقل</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        body { margin: 0; padding: 0; background: #070b19; color: #fff; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .container { width: 100%; max-width: 420px; padding: 20px; }
        .epic-card { background: #0f172a; border: 1px solid #1e293b; padding: 36px 28px; border-radius: 28px; box-shadow: 0 20px 40px rgba(0,0,0,0.6); text-align: center; }
        .brand-logo { font-size: 26px; font-weight: 900; color: #fff; margin-bottom: 6px; }
        .brand-logo span { color: #38bdf8; }
        .tagline { font-size: 13px; color: #94a3b8; margin-bottom: 25px; }
        .input-mega { width: 100%; padding: 15px; border-radius: 14px; background: #050b14; border: 1px solid #334155; color: #fff; font-size: 15px; text-align: center; margin-bottom: 12px; }
        .input-mega:focus { border-color: #38bdf8; outline: none; }
        .btn-epic { background: #2563eb; color: #fff; border: none; padding: 16px; width: 100%; border-radius: 14px; font-weight: 700; cursor: pointer; font-size: 16px; transition: background 0.2s; }
        .btn-epic:hover { background: #1d4ed8; }
    </style>
</head>
<body>
    <div class="container">
        <div class="epic-card">
            <div class="brand-logo">كومبو راكب 🚏</div>
            <div class="tagline">احجز مقعدك وتنقل في مدينتك بأمان وراحة</div>
            
            <input type="text" id="r-name" class="input-mega" placeholder="الاسم بالكامل" style="text-align: right;">
            <input type="tel" id="r-phone" class="input-mega" placeholder="رقم الموبايل (01xxxxxxxxx)" maxlength="11" style="direction: ltr;">
            <input type="password" id="r-pass" class="input-mega" placeholder="كلمة المرور">
            
            <button class="btn-epic" onclick="registerRider()">تسجيل حساب راكب جديد ⚡</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://pmpzilqpcomoodaksbhw.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_tjYI1IKegMFywNCqGPdKng_fSGIe7Zx';
        let supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function registerRider() {
            const name = document.getElementById('r-name').value.trim();
            const phone = document.getElementById('r-phone').value.trim();
            const pass = document.getElementById('r-pass').value.trim();

            const phoneRegex = /^01[0125][0-9]{8}$/;
            if (!name || !pass) { alert('يرجى إدخال الاسم وكلمة المرور.'); return; }
            if (!phoneRegex.test(phone)) { alert('يرجى إدخال رقم موبايل مصري صحيح.'); return; }

            const newId = crypto.randomUUID();
            const riderObj = {
                id: newId,
                full_name: name,
                phone: phone,
                password: pass,
                user_type: 'rider',
                wallet_balance: 0.00
            };

            const { error } = await supabaseClient.from('profiles').insert([riderObj]);
            if (error) { alert('خطأ أثناء التسجيل: ' + error.message); return; }

            localStorage.setItem('combo_user', JSON.stringify(riderObj));
            window.location.href = 'passenger.html';
        }
    </script>
</body>
</html>
