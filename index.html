<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>كومبو - المنظومة الاحترافية</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * { box-sizing: border-box; }
        body { font-family: Tahoma, sans-serif; background: #121212; color: #fff; margin: 0; padding: 0; }
        .top-bar { background: #000; padding: 12px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; }
        .role-switcher { display: flex; gap: 5px; background: #222; padding: 4px; border-radius: 8px; }
        .role-tab { background: transparent; border: none; color: #aaa; padding: 6px 12px; font-weight: bold; border-radius: 6px; cursor: pointer; font-size: 13px; }
        .role-tab.active { background: #fff; color: #000; }
        
        .container { padding: 12px; }
        .card { background: #1e1e1e; padding: 16px; border-radius: 12px; margin-bottom: 12px; border: 1px solid #333; }
        .btn { background: #fff; color: #000; border: none; padding: 14px; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; width: 100%; text-align: center; margin-top: 10px; text-decoration: none; display: block; }
        .btn-green { background: #00875a; color: #fff; }
        .btn-blue { background: #0288d1; color: #fff; }
        
        input, select { width: 100%; padding: 12px; margin-top: 6px; margin-bottom: 12px; background: #2a2a2a; border: 1px solid #444; color: #fff; border-radius: 8px; font-size: 14px; }
        label { font-size: 13px; color: #bbb; }
        
        .ride-option { background: #2a2a2a; border: 2px solid #444; border-radius: 10px; padding: 12px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        .ride-option.selected { border-color: #00e676; background: #1a332c; }
        
        .status-badge { display: inline-block; padding: 6px 12px; border-radius: 6px; font-size: 13px; font-weight: bold; background: #333; color: #ff9800; }
        .pin-box { font-size: 26px; font-weight: bold; letter-spacing: 6px; color: #00e676; background: #111; padding: 10px; border-radius: 8px; text-align: center; margin: 10px 0; }
    </style>
</head>
<body>

    <div class="top-bar">
        <span style="font-weight: bold; font-size: 16px;">🚗 كومبو (Uber Style)</span>
        <div class="role-switcher">
            <button class="role-tab active" onclick="switchRole('passenger')">الراكب</button>
            <button class="role-tab" onclick="switchRole('captain')">الكابتن</button>
        </div>
    </div>

    <!-- ================= واجهة الراكب ================= -->
    <div id="passengerView" class="container">
        <!-- الخطوة 1: خطط مشوارك (من وإلى) -->
        <div class="card" id="passengerFormCard">
            <h3>📍 خطط لمشوارك (اختر المواقف)</h3>
            <label>مكان الاستلام (من)</label>
            <input type="text" id="pStart" value="فؤاد بيومي، الحي السابع" placeholder="ادخل مكان الاستلام" />
            
            <label>الوجهة (إلى - اختر الموقف)</label>
            <select id="pEndSelect">
                <option value="موقف بلبيس الجديد">موقف بلبيس الجديد (الساحة)</option>
                <option value="موقف العاشر من رمضان">موقف العاشر من رمضان (محطة النقل)</option>
                <option value="موقف السلام، الإسماعيلية، المرج">موقف السلام، الإسماعيلية، المرج</option>
                <option value="Garden 8 - التجمع الخامس">Garden 8 - التجمع الخامس</option>
            </select>

            <label>رقم الهاتف</label>
            <input type="tel" id="pPhone" placeholder="01xxxxxxxxx" maxlength="11" />
            
            <button class="btn" onclick="goToRideSelection()">التالي: اختيار نوع المركبة ➔</button>
        </div>

        <!-- الخطوة 2: اختيار نوع المشوار (سيارة / سكوتتر) -->
        <div class="card" id="passengerRideSelectCard" style="display:none;">
            <h3>🚗 اختيار مشوار</h3>
            
            <div class="ride-option selected" id="opt-car" onclick="selectVehicle('ملاكي - UberX', '139 ج.م')">
                <div>
                    <strong>سيارة ملاكي (UberX)</strong>
                    <div style="font-size:12px; color:#aaa;">أسرع، تكيف كامل</div>
                </div>
                <div style="font-weight:bold; font-size:16px;">139 ج.م</div>
            </div>

            <div class="ride-option" id="opt-bike" onclick="selectVehicle('سكوتتر - موتوسيكل', '114 ج.م')">
                <div>
                    <strong>سكوتتر (موتوسيكل)</strong>
                    <div style="font-size:12px; color:#aaa;">لتجاوز الزحام المروري</div>
                </div>
                <div style="font-weight:bold; font-size:16px;">114 ج.م</div>
            </div>

            <button class="btn btn-green" onclick="requestTripFinal()">اطلب الآن 🚀</button>
            <button class="btn" style="background:#333; color:#fff;" onclick="backToForm()">الرجوع لتعديل العنوان ↺</button>
        </div>

        <!-- الخطوة 3: حالة الرحلة وانتظار الكابتن -->
        <div class="card" id="passengerStatusCard" style="display:none; text-align:center;">
            <span class="status-badge" id="tripStateBadge">جاري البحث عن كابتن...</span>
            <p id="tripDetailsText" style="margin-top: 15px; font-size: 15px;"></p>
            <div id="passengerPinContainer" style="display:none;">
                <label>كود التحقق (PIN) أعطه للكابتن عند ركوب السيارة:</label>
                <div class="pin-box" id="tripPinCode">----</div>
            </div>
        </div>
    </div>

    <!-- ================= واجهة الكابتن ================= -->
    <div id="captainView" class="container" style="display:none;">
        <div id="captainContent">
            <div class="card" style="text-align:center;">
                <span class="status-badge">🟢 متصل - جاري استقبال المشاوير</span>
                <div id="availableTrips" style="margin-top: 15px;">جاري رصد الرحلات القريبة... 📡</div>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://pmpzilqpcomoodaksbhw.supabase.co";
        const SUPABASE_KEY = "sb_publishable_tjYI1IKegMFywNCqGPdKng_fSGIe7Zx";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentRole = 'passenger';
        let activeTripId = null;
        let selectedVehicleType = "ملاكي - UberX";
        let selectedPrice = "139 ج.م";
        let generatedPin = Math.floor(1000 + Math.random() * 9000).toString();
        let captainInTrip = false;
        let fetchInterval = null;

        function switchRole(role) {
            currentRole = role;
            if (role === 'passenger') {
                document.getElementById('passengerView').style.display = 'block';
                document.getElementById('captainView').style.display = 'none';
                document.querySelectorAll('.role-tab')[0].classList.add('active');
                document.querySelectorAll('.role-tab')[1].classList.remove('active');
            } else {
                document.getElementById('passengerView').style.display = 'none';
                document.getElementById('captainView').style.display = 'block';
                document.querySelectorAll('.role-tab')[1].classList.add('active');
                document.querySelectorAll('.role-tab')[0].classList.remove('active');
                if (!captainInTrip) startFetchingTrips();
            }
        }

        function goToRideSelection() {
            const phone = document.getElementById('pPhone').value.trim();
            if (!phone) { alert('ادخل رقم الهاتف'); return; }
            document.getElementById('passengerFormCard').style.display = 'none';
            document.getElementById('passengerRideSelectCard').style.display = 'block';
        }

        function backToForm() {
            document.getElementById('passengerRideSelectCard').style.display = 'none';
            document.getElementById('passengerFormCard').style.display = 'block';
        }

        function selectVehicle(type, price) {
            selectedVehicleType = type;
            selectedPrice = price;
            document.getElementById('opt-car').classList.remove('selected');
            document.getElementById('opt-bike').classList.remove('selected');
            if (type.includes('ملاكي')) {
                document.getElementById('opt-car').classList.add('selected');
            } else {
                document.getElementById('opt-bike').classList.add('selected');
            }
        }

        async function requestTripFinal() {
            const phone = document.getElementById('pPhone').value.trim();
            const startLoc = document.getElementById('pStart').value;
            const endLoc = document.getElementById('pEndSelect').value;

            const payload = {
                start_station: `${startLoc} [${selectedVehicleType}]`,
                end_station: endLoc,
                trip_price: selectedPrice,
                user_mobile: phone,
                status: 'pending',
                trip_pin: generatedPin
            };

            try {
                let res = await fetch(`${SUPABASE_URL}/rest/v1/trips_data`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`,
                        'Prefer': 'return=representation'
                    },
                    body: JSON.stringify(payload)
                });
                let result = await res.json();

                if (!res.ok || !result.length) {
                    const basicPayload = {
                        start_station: startLoc,
                        end_station: endLoc,
                        trip_price: selectedPrice,
                        user_mobile: phone
                    };
                    res = await fetch(`${SUPABASE_URL}/rest/v1/trips_data`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'apikey': SUPABASE_KEY,
                            'Authorization': `Bearer ${SUPABASE_KEY}`,
                            'Prefer': 'return=representation'
                        },
                        body: JSON.stringify(basicPayload)
                    });
                    result = await res.json();
                }

                if (res.ok && result.length > 0) {
                    activeTripId = result[0].id;
                    document.getElementById('passengerRideSelectCard').style.display = 'none';
                    const statusCard = document.getElementById('passengerStatusCard');
                    statusCard.style.display = 'block';
                    document.getElementById('tripStateBadge').innerText = "⏳ جارِ انتظار قبول الكابتن...";
                    document.getElementById('passengerPinContainer').style.display = 'block';
                    document.getElementById('tripPinCode').innerText = generatedPin;
                    listenToTripStatus();
                } else {
                    alert('خطأ في إرسال الطلب');
                }
            } catch (err) {
                alert('تعذر الاتصال بالسيرفر');
            }
        }

        function listenToTripStatus() {
            setInterval(async () => {
                if (!activeTripId) return;
                const { data } = await supabaseClient.from('trips_data').select('*').eq('id', activeTripId).single();
                if (data) {
                    if (data.status === 'accepted') {
                        document.getElementById('tripStateBadge').innerText = "🚗 الكابتن في الطريق إليك";
                        document.getElementById('tripDetailsText').innerHTML = `السعر: ${data.trip_price}<br>📍 الكابتن يقترب من موقعك`;
                    } else if (data.status === 'arrived') {
                        document.getElementById('tripStateBadge').innerText = "🟢 وصل الكابتن إليك!";
                        document.getElementById('tripDetailsText').innerHTML = `⏱️ <b>أعط الكابتن كود الـ PIN لبدء الرحلة!</b>`;
                    } else if (data.status === 'started') {
                        document.getElementById('tripStateBadge').innerText = "🚀 الرحلة جارية الآن نحو الوجهة";
                        document.getElementById('tripDetailsText').innerHTML = `🎯 الوجهة النهائية: <b>${data.end_station}</b><br>رحلة موفقة!`;
                    }
                }
            }, 3000);
        }

        function startFetchingTrips() {
            if (fetchInterval) clearInterval(fetchInterval);
            fetchAvailableTrips();
            fetchInterval = setInterval(fetchAvailableTrips, 4000);
        }

        async function fetchAvailableTrips() {
            if (captainInTrip) return;
            const container = document.getElementById('captainContent');
            const { data } = await supabaseClient.from('trips_data').select('*').order('id', { ascending: false });

            if (!data || data.length === 0) {
                container.innerHTML = `<div class="card" style="text-align:center;">📭 لا توجد مشاوير متاحة حالياً</div>`;
                return;
            }

            let html = `<div class="card"><h3 style="margin-top:0; color:#ff9800;">🚗 الرحلات المتاحة للقبول</h3>`;
            let found = false;
            data.forEach(t => {
                if (!t.status || t.status === 'pending') {
                    found = true;
                    html += `
                        <div style="background:#2a2a2a; padding:12px; border-radius:8px; margin-bottom:10px; text-align:right;">
                            <div>📍 الاستلام: ${t.start_station}</div>
                            <div>🎯 الوجهة: ${t.end_station}</div>
                            <div>💰 السعر: ${t.trip_price}</div>
                            <div>📱 الراكب: ${t.user_mobile}</div>
                            <button class="btn btn-green" onclick="acceptTrip(${t.id}, '${t.end_station}')">قبول المشوار والتوجه للراكب 🚗</button>
                        </div>
                    `;
                }
            });
            html += `</div>`;
            if (!found) {
                container.innerHTML = `<div class="card" style="text-align:center;">📭 لا توجد مشاوير جديدة حالياً</div>`;
            } else {
                container.innerHTML = html;
            }
        }

        async function acceptTrip(tripId, endStation) {
            captainInTrip = true;
            if (fetchInterval) clearInterval(fetchInterval);

            await supabaseClient.from('trips_data').update({ status: 'accepted' }).eq('id', tripId);
            
            const content = document.getElementById('captainContent');
            content.innerHTML = `
                <div class="card">
                    <h3>🚗 في طريقك للراكب</h3>
                    <a id="navBtn" class="btn btn-blue" target="_blank" href="https://www.google.com/maps/search/?api=1&query=Cairo">🗺️ فتح الاتجاهات لمكان الراكب</a>
                    <button class="btn btn-green" onclick="arriveToPassenger(${tripId}, '${endStation}')" style="margin-top:10px;">وصلت لمكان الراكب (أدخل PIN) 📍</button>
                </div>
            `;
        }

        async function arriveToPassenger(tripId, endStation) {
            const enteredPin = prompt("أدخل كود الـ PIN المكون من 4 أرقام الذي مع الراكب لبدء الرحلة:");
            if (!enteredPin) return;

            const { data } = await supabaseClient.from('trips_data').select('trip_pin').eq('id', tripId).single();
            
            if (!data || !data.trip_pin || data.trip_pin === enteredPin) {
                await supabaseClient.from('trips_data').update({ status: 'started' }).eq('id', tripId);
                
                const encodedDest = encodeURIComponent(endStation);
                const content = document.getElementById('captainContent');
                content.innerHTML = `
                    <div class="card" style="background:#004d40; text-align:center;">
                        <h3 style="color:#a5d6a7;">🚀 الرحلة جارية الآن نحو الوجهة</h3>
                        <p style="font-size:16px; margin:10px 0;">🎯 الوجهة النهائية: <b>${endStation}</b></p>
                        <a class="btn btn-blue" href="https://www.google.com/maps/search/?api=1&query=${encodedDest}" target="_blank">🗺️ فتح خريطة الوجهة النهائية على جوجل</a>
                    </div>
                `;
            } else {
                alert('⚠️ كود الـ PIN غير صحيح، تأكد من الراكب');
            }
        }
    </script>
</body>
</html>
