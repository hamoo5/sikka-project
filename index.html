<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة كومبو - انطلق بثقة</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; background: #0f172a; color: #fff; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .auth-card { background: #1e293b; padding: 30px; border-radius: 20px; width: 100%; max-width: 400px; border: 1px solid rgba(255,255,255,0.08); text-align: center; box-shadow: 0 15px 35px rgba(0,0,0,0.6); box-sizing: border-box; margin: 20px; position: relative; overflow: hidden; }
        .auth-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px; background: linear-gradient(90deg, #38bdf8, #2563eb); }
        .input-field { width: 100%; padding: 14px; margin: 10px 0; border-radius: 10px; background: #0f172a; border: 1px solid #334155; color: #fff; font-size: 15px; box-sizing: border-box; transition: all 0.3s ease; }
        .input-field:focus { border-color: #38bdf8; outline: none; box-shadow: 0 0 10px rgba(56, 189, 248, 0.2); }
        .btn { background: linear-gradient(135deg, #2563eb, #1d4ed8); color: #fff; border: none; padding: 14px; width: 100%; border-radius: 10px; font-weight: bold; cursor: pointer; margin-top: 15px; font-size: 16px; transition: transform 0.2s, background 0.2s; }
        .btn:active { transform: scale(0.98); }
        .select-box { width: 100%; padding: 14px; margin: 10px 0; border-radius: 10px; background: #0f172a; color: #fff; border: 1px solid #334155; font-size: 15px; box-sizing: border-box; }
        .hidden-step { display: none; }
        .badge { display: inline-block; background: rgba(56, 189, 248, 0.1); color: #38bdf8; padding: 5px 12px; border-radius: 20px; font-size: 12px; margin-bottom: 15px; font-weight: 600; }
    </style>
</head>
<body>

    <div class="auth-card">
        <div class="badge">منصة كومبو الذكية 🚗📦</div>
        <h2 id="form-title" style="margin: 0 0 5px 0; color: #fff; font-size: 22px;">أهلاً بك في رحلتك</h2>
        <p id="form-subtitle" style="font-size: 13px; color: #94a3b8; margin-bottom: 20px;">أدخل رقم الموبايل للبدء فوراً</p>
        
        <!-- الخطوة الأولى: رقم الموبايل -->
        <div id="step-phone">
            <input type="tel" id="user-phone" class="input-field" placeholder="رقم الموبايل (010xxxxxxxx)" maxlength="11" style="text-align: right; direction: ltr;">
            <button class="btn" onclick="proceedNextStep()">متابعة ⚡</button>
        </div>

        <!-- الخطوة الثانية: كتابة كلمة المرور وباقي البيانات -->
        <div id="step-extra-details" class="hidden-step">
            <input type="text" id="user-name" class="input-field" placeholder="الاسم بالكامل">
            
            <!-- حقل كلمة المرور متاح بوضوح -->
            <input type="password" id="user-password" class="input-field" placeholder="كلمة المرور">
            
            <div id="role-selection-box">
                <span style="display: block; text-align: right; font-size: 12px; color: #94a3b8; margin-top: 8px;">اختر نوع الحساب:</span>
                <select id="user-role" class="select-box">
                    <option value="rider">🚏 راكب (أرغب في التنقل والرحلات)</option>
                    <option value="driver">🚗 كابتن (أرغب في قيادة وتوصيل الركاب)</option>
                </select>
            </div>

            <button class="btn" id="action-btn-text" onclick="executeAuthAction()">تسجيل الحساب وانطلاق 🚀</button>
            <p style="margin-top: 15px; font-size: 12px; color: #38bdf8; cursor: pointer;" onclick="resetForm()">← تغيير رقم الموبايل</p>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://pmpzilqpcomoodaksbhw.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_tjYI1IKegMFywNCqGPdKng_fSGIe7Zx';
        let supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        let foundExistingUser = null;

        async function proceedNextStep() {
            const phone = document.getElementById('user-phone').value.trim();
            
            const phoneRegex = /^01[0125][0-9]{8}$/;
            if (!phoneRegex.test(phone)) {
                alert('يرجى إدخال رقم موبايل مصري صحيح مكون من 11 رقماً (يبدأ بـ 01).');
                return;
            }

            // الاستعلام من قاعدة البيانات Supabase
            let { data: user } = await supabaseClient.from('profiles').select('*').eq('phone', phone).single();

            // إخفاء خطوة رقم الموبايل وإظهار خطوة إدخال كلمة المرور
            document.getElementById('step-phone').style.display = 'none';
            const extraBox = document.getElementById('step-extra-details');
            extraBox.style.display = 'block';

            if (user) {
                // مستخدم قديم -> إظهار كلمة المرور فقط
                foundExistingUser = user;
                document.getElementById('form-title').innerText = `مرحباً بعودتك، ${user.full_name || 'بطل كومبو'}`;
                document.getElementById('form-subtitle').innerText = 'أدخل كلمة المرور الخاصة بك لتسجيل الدخول';
                
                document.getElementById('user-name').style.display = 'none';
                document.getElementById('user-password').style.display = 'block';
                document.getElementById('role-selection-box').style.display = 'none';
                document.getElementById('action-btn-text').innerText = 'تسجيل الدخول الفوري 🔓';
            } else {
                // مستخدم جديد -> إظهار كل الحقول للتسجيل
                foundExistingUser = null;
                document.getElementById('form-title').innerText = 'حساب جديد في كومبو';
                document.getElementById('form-subtitle').innerText = 'أكمل بياناتك البسيطة لتنضم إلينا';
                
                document.getElementById('user-name').style.display = 'block';
                document.getElementById('user-password').style.display = 'block';
                document.getElementById('role-selection-box').style.display = 'block';
                document.getElementById('action-btn-text').innerText = 'تسجيل الحساب وانطلاق 🚀';
            }
        }

        async function executeAuthAction() {
            const phone = document.getElementById('user-phone').value.trim();
            const password = document.getElementById('user-password').value.trim();

            if (!password) {
                alert('يرجى إدخال كلمة المرور.');
                return;
            }

            if (foundExistingUser) {
                // تسجيل الدخول
                if (foundExistingUser.password && foundExistingUser.password !== password) {
                    alert('كلمة المرور غير صحيحة!');
                    return;
                }
                currentUserRedirect(foundExistingUser);
            } else {
                // إنشـاء حساب جديد
                const name = document.getElementById('user-name').value.trim();
                const role = document.getElementById('user-role').value;

                if (!name) {
                    alert('يرجى إدخال الاسم بالكامل.');
                    return;
                }

                const newId = crypto.randomUUID();
                const newUserObj = {
                    id: newId,
                    full_name: name,
                    phone: phone,
                    password: password,
                    user_type: role,
                    wallet_balance: role === 'driver' ? 100.00 : 0.00
                };

                const { error } = await supabaseClient.from('profiles').insert([newUserObj]);
                if (error) {
                    alert('خطأ أثناء إنشاء الحساب: ' + error.message);
                    return;
                }

                currentUserRedirect(newUserObj);
            }
        }

        function resetForm() {
            document.getElementById('step-extra-details').style.display = 'none';
            document.getElementById('step-phone').style.display = 'block';
            document.getElementById('form-title').innerText = 'أهلاً بك في رحلتك';
            document.getElementById('form-subtitle').innerText = 'أدخل رقم الموبايل للبدء فوراً';
            document.getElementById('user-password').value = '';
        }

        function currentUserRedirect(user) {
            localStorage.setItem('combo_user', JSON.stringify(user));

            if (user.user_type === 'rider') {
                window.location.href = 'passenger.html';
            } else if (user.user_type === 'driver') {
                window.location.href = 'captain.html';
            } else {
                window.location.href = 'passenger.html';
            }
        }
    </script>
</body>
</html>
