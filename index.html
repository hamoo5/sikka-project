<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق كومبو - الإصدار الشامل</title>
    <!-- مكتبة Leaflet للخرائط -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- مكتبة Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { margin: 0; padding: 0; font-family: Tahoma, sans-serif; background: #0f172a; color: #fff; overflow: hidden; }
        #map { height: 100vh; width: 100vw; position: absolute; top: 0; left: 0; z-index: 1; }
        .top-bar { position: absolute; top: 15px; left: 50%; transform: translateX(-50%); z-index: 10; background: rgba(15, 23, 42, 0.9); padding: 8px 15px; border-radius: 30px; display: flex; gap: 10px; border: 1px solid rgba(255,255,255,0.1); }
        .tab-btn { background: transparent; border: none; color: #fff; padding: 8px 16px; border-radius: 20px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .tab-btn.active { background: #2563eb; color: #fff; }
        .panel { position: absolute; bottom: 20px; left: 20px; right: 20px; z-index: 10; background: rgba(15, 23, 42, 0.95); padding: 20px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(10px); max-width: 500px; margin: 0 auto; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .btn { background: #2563eb; color: #fff; border: none; padding: 12px; width: 100%; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px; font-size: 16px; }
        .btn:hover { background: #1d4ed8; }
        .select-box { width: 100%; padding: 10px; margin: 10px 0; border-radius: 8px; background: #1e293b; color: #fff; border: 1px solid #334155; font-size: 14px; }
    </style>
</head>
<body>

    <div class="top-bar">
        <button class="tab-btn active" onclick="switchView('rider')" id="btn-rider">واجهة الراكب</button>
        <button class="tab-btn" onclick="switchView('driver')" id="btn-driver">واجهة الكابتن</button>
    </div>

    <div id="map"></div>

    <div class="panel" id="control-panel">
        <h3 id="panel-title">جارٍ التحميل...</h3>
        <div id="panel-content">يرجى الانتظار قليلاً</div>
    </div>

    <script>
        const SUPABASE_URL = 'https://pmpzilqpcomoodaksbhw.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_tjYI1IKegMFywNCqGPdKng_fSGIe7Zx';
        let supabaseClient = null;

        try {
            supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        } catch (e) {
            console.error("خطأ في الاتصال بقاعدة البيانات:", e);
        }

        let currentView = 'rider';
        let map, pickupMarker, dropoffMarker, driverMarker;
        let pickupCoords = { lat: 30.0444, lng: 31.2357 };
        let dropoffCoords = null;
        let activeTripId = null;
        let driverEarnings = 0;
        let completedTripsCount = 0;

        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(initMap, 500);
        });

        function initMap() {
            try {
                map = L.map('map').setView([pickupCoords.lat, pickupCoords.lng], 13);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    maxZoom: 19,
                    attribution: '© OpenStreetMap'
                }).addTo(map);

                pickupMarker = L.marker([pickupCoords.lat, pickupCoords.lng]).addTo(map).bindPopup('موقع الانطلاق').openPopup();

                map.on('click', function(e) {
                    if (currentView === 'rider') {
                        dropoffCoords = e.latlng;
                        if (dropoffMarker) map.removeLayer(dropoffMarker);
                        dropoffMarker = L.marker([e.latlng.lat, e.latlng.lng]).addTo(map).bindPopup('موقع الوصول').openPopup();
                        showRideConfirmation();
                    }
                });

                renderRiderPanel();
            } catch (err) {
                console.error("خطأ في تشغيل الخريطة:", err);
            }
        }

        function switchView(view) {
            currentView = view;
            document.getElementById('btn-rider').classList.toggle('active', view === 'rider');
            document.getElementById('btn-driver').classList.toggle('active', view === 'driver');
            
            if (view === 'rider') {
                renderRiderPanel();
            } else {
                renderDriverPanel();
            }
            if(map) setTimeout(() => map.invalidateSize(), 200);
        }

        function renderRiderPanel() {
            document.getElementById('panel-title').innerText = "طلب رحلة جديدة (كومبو)";
            document.getElementById('panel-content').innerHTML = `
                <p style="margin: 5px 0; font-size: 14px;">انقر على الخريطة لتحديد مكان الوصول</p>
                <div id="ride-options" style="display:none;">
                    <label style="font-size: 13px; color: #94a3b8;">اختر نوع المركبة:</label>
                    <select id="vehicle-type" class="select-box">
                        <option value="ملاكي">سيارة ملاكي</option>
                        <option value="سوزوكي">سوزوكي</option>
                        <option value="ميكروباص">ميكروباص</option>
                    </select>
                </div>
                <button class="btn" onclick="requestRide()" id="req-btn" style="display:none;">تأكيد وطلب الرحلة (25 جنيه)</button>
            `;
            dropoffCoords = null;
            if (dropoffMarker && map) {
                map.removeLayer(dropoffMarker);
                dropoffMarker = null;
            }
        }

        function showRideConfirmation() {
            document.getElementById('ride-options').style.display = 'block';
            document.getElementById('req-btn').style.display = 'block';
        }

        async function requestRide() {
            if (!supabaseClient) return;
            const vehicle = document.getElementById('vehicle-type').value;
            const otp = Math.floor(1000 + Math.random() * 9000).toString();
            
            const { data, error } = await supabaseClient.from('trips').insert([
                {
                    pickup_lat: pickupCoords.lat,
                    pickup_lng: pickupCoords.lng,
                    dropoff_lat: dropoffCoords ? dropoffCoords.lat : pickupCoords.lat,
                    dropoff_lng: dropoffCoords ? dropoffCoords.lng : pickupCoords.lng,
                    fixed_price: 25.00,
                    otp_code: otp,
                    vehicle_type: vehicle,
                    status: 'SEARCHING'
                }
            ]).select();

            if (error) {
                alert('خطأ في إرسال الطلب: ' + error.message);
            } else {
                activeTripId = data[0].id;
                document.getElementById('panel-content').innerHTML = `
                    <p style="margin: 5px 0;">جارٍ البحث عن كابتن قريب (${vehicle})...</p>
                    <p style="color: #38bdf8; margin: 5px 0;">كود التأكيد الخاص بك: <b>${otp}</b></p>
                `;
                listenToTrip(activeTripId);
            }
        }

        function listenToTrip(tripId) {
            supabaseClient.channel('trip-changes-' + tripId)
                .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'trips', filter: `id=eq.${tripId}` }, payload => {
                    const trip = payload.new;
                    if (trip.status === 'ACCEPTED') {
                        document.getElementById('panel-content').innerHTML = `
                            <p style="color:#22c55e; font-weight: bold; margin: 5px 0;">تم قبول رحلتك! الكابتن يتحرك في الطريق إليك.</p>
                            <p style="margin: 5px 0;">كود التأكيد: <b>${trip.otp_code}</b></p>
                        `;
                        if (trip.driver_lat && trip.driver_lng) {
                            if (driverMarker) {
                                driverMarker.setLatLng([trip.driver_lat, trip.driver_lng]);
                            } else {
                                driverMarker = L.marker([trip.driver_lat, trip.driver_lng], {
                                    icon: L.divIcon({className: 'driver-icon', html: '🚗', iconSize: [30, 30]})
                                }).addTo(map).bindPopup('موقع الكابتن الحالي');
                            }
                        }
                    }
                })
                .subscribe();
        }

        function renderDriverPanel() {
            document.getElementById('panel-title').innerText = "واجهة الكابتن - الطلبات والأرباح";
            document.getElementById('panel-content').innerHTML = `
                <div style="background: #1e293b; padding: 10px; border-radius: 8px; margin-bottom: 10px; display: flex; justify-content: space-between; font-size: 14px;">
                    <span>الرحلات المكتملة: <b>${completedTripsCount}</b></span>
                    <span style="color: #22c55e;">الأرباح: <b>${driverEarnings} جنيه</b></span>
                </div>
                <button class="btn" onclick="fetchAvailableTrips()" style="margin-top:0;">تحديث قائمة الطلبات</button>
                <div id="trips-list" style="max-height: 130px; overflow-y: auto; margin-top: 10px;"></div>
            `;
            fetchAvailableTrips();
        }

        async function fetchAvailableTrips() {
            if (!supabaseClient) return;
            const { data, error } = await supabaseClient.from('trips').select('*').eq('status', 'SEARCHING');
            const listDiv = document.getElementById('trips-list');
            if (error || !data || !data.length) {
                listDiv.innerHTML = "<p style='color: #94a3b8; font-size: 14px;'>لا توجد طلبات متاحة حالياً.</p>";
                return;
            }
            listDiv.innerHTML = data.map(trip => `
                <div style="background:#1e293b; padding:10px; margin-top:8px; border-radius:6px; border: 1px solid #334155;">
                    <p style="margin: 0 0 5px 0;">المركبة: <b>${trip.vehicle_type || 'ملاكي'}</b> | السعر: <b>${trip.fixed_price} جنيه</b></p>
                    <button class="btn" style="margin-top:0; padding: 6px;" onclick="acceptTrip('${trip.id}', ${trip.pickup_lat}, ${trip.pickup_lng})">قبول الرحلة وبدء التوجيه</button>
                </div>
            `).join('');
        }

        async function acceptTrip(tripId, pLat, pLng) {
            if (!supabaseClient) return;
            const { error } = await supabaseClient
                .from('trips')
                .update({ status: 'ACCEPTED' })
                .eq('id', tripId);
                
            if (!error) {
                activeTripId = tripId;
                driverEarnings += 25;
                completedTripsCount += 1;
                alert('تم قبول الرحلة بنجاح! يتم توجيهك لموقع الراكب.');
                
                if(map) {
                    map.setView([pLat, pLng], 15);
                    L.marker([pLat, pLng]).addTo(map).bindPopup('موقع الراكب المطلوب').openPopup();
                }

                renderDriverActiveTrip(tripId);
            } else {
                alert('خطأ في قبول الرحلة: ' + error.message);
            }
        }

        function renderDriverActiveTrip(tripId) {
            document.getElementById('panel-content').innerHTML = `
                <p style="color:#22c55e; font-weight:bold; margin: 5px 0;">الرحلة نشطة - أنت في الطريق للراكب</p>
                <button class="btn" onclick="sendDriverLiveLocation('${tripId}')">تحديث وإرسال موقعي الحي للراكب</button>
            `;
        }

        function sendDriverLiveLocation(tripId) {
            if (!navigator.geolocation) {
                alert('خاصية تحديد الموقع غير متوفرة في متصفحك');
                return;
            }
            navigator.geolocation.getCurrentPosition(async (position) => {
                const lat = position.coords.latitude;
                const lng = position.coords.longitude;
                
                const { error } = await supabaseClient
                    .from('trips')
                    .update({ driver_lat: lat, driver_lng: lng })
                    .eq('id', tripId);

                if(!error) {
                    alert('تم تحديث وإرسال موقعك الحي للراكب بنجاح.');
                } else {
                    alert('خطأ في إرسال الموقع: ' + error.message);
                }
            }, () => {
                alert('تعذر الحصول على موقعك الحالي.');
            });
        }
    </script>
</body>
</html>
