<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة كومبو - تسجيل الدخول</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; background: #0f172a; color: #fff; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .auth-card { background: #1e293b; padding: 25px; border-radius: 16px; width: 100%; max-width: 400px; border: 1px solid rgba(255,255,255,0.1); text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5); box-sizing: border-box; margin: 20px; }
        .input-field { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; background: #0f172a; border: 1px solid #334155; color: #fff; font-size: 14px; box-sizing: border-box; }
        .btn { background: #2563eb; color: #fff; border: none; padding: 12px; width: 100%; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 12px; font-size: 16px; }
        .btn:hover { background: #1d4ed8; }
        .select-box { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; background: #0f172a; color: #fff; border: 1px solid #334155; font-size: 14px; box-sizing: border-box; }
        .file-label { display: block; text-align: right; font-size: 12px; color: #94a3b8; margin-top: 8px; }
    </style>
</head>
<body>

    <div class="auth-card">
        <h2 style="margin-top:0; color:#38bdf8;">منصة كومبو 🚗📦</h2>
        <p style="font-size:13px; color:#94a3b8; margin-bottom:15px;">سجل بياناتك للبدء في النظام</p>
        
        <input type="text" id="user-name" class="input-field" placeholder="الاسم بالكامل">
        <input type="text" id="user-phone" class="input-field" placeholder="رقم الموبايل (مثال: 01012345678)">
        <input type="password" id="user-password" class="input-field" placeholder="كلمة المرور">
        
        <span class="file-label">صورة شخصية (اختياري للراكب):</span>
        <input type="file" id="user-image" class="input-field" accept="image/*" style="padding: 8px;">

        <select id="user-role" class="select-box">
            <option value="rider">راكب</option>
            <option value="driver">كابتن</option>
        </select>

        <button class="btn" onclick="registerAndLogin()">دخول / تسجيل في النظام</button>
    </div>

    <script>
        const SUPABASE_URL = 'https://pmpzilqpcomoodaksbhw.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_tjYI1IKegMFywNCqGPdKng_fSGIe7Zx';
        let supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function convertImageToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        }

        async function registerAndLogin() {
            const name = document.getElementById('user-name').value.trim();
            const phone = document.getElementById('user-phone').value.trim();
            const password = document.getElementById('user-password').value.trim();
            const role = document.getElementById('user-role').value;
            const imageFile = document.getElementById('user-image').files[0];

            if (!name || !phone || !password) {
                alert('يرجى إدخال الاسم، رقم الموبايل، وكلمة المرور كاملاً.');
                return;
            }

            let imageUrl = '';
            if (imageFile) {
                try { imageUrl = await convertImageToBase64(imageFile); } catch (e) {}
            }

            let { data: existingUser } = await supabaseClient.from('profiles').select('*').eq('phone', phone).single();

            if (existingUser) {
                if (existingUser.password && existingUser.password !== password) {
                    alert('كلمة المرور غير صحيحة لهذا الرقم!');
                    return;
                }
                currentUserRedirect(existingUser);
            } else {
                const newId = crypto.randomUUID();
                const newUserObj = {
                    id: newId,
                    full_name: name,
                    phone: phone,
                    password: password,
                    user_type: role,
                    profile_image: imageUrl || null,
                    wallet_balance: role === 'driver' ? 100.00 : 0.00
                };

                const { error } = await supabaseClient.from('profiles').insert([newUserObj]);
                if (error) {
                    alert('خطأ أثناء حفظ البيانات: ' + error.message);
                    return;
                }

                currentUserRedirect(newUserObj);
            }
        }

        function currentUserRedirect(user) {
            localStorage.setItem('combo_user', JSON.stringify(user));

            if (user.user_type === 'rider') {
                window.location.href = 'passenger.html';
            } else if (user.user_type === 'driver') {
                window.location.href = 'captain.html';
            } else if (user.user_type === 'admin') {
                window.location.href = 'admin.html';
            }
        }
    </script>
</body>
</html>
