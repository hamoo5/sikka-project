<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>كومبو - المنظومة الاحترافية</title>
    <!-- استخدام تصميم خريطة احترافي وواضح جداً يشبه جوجل -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * { box-sizing: border-box; }
        body { font-family: Tahoma, sans-serif; background: #121212; color: #fff; margin: 0; padding: 0; }
        .top-bar { background: #000; padding: 12px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; }
        .role-switcher { display: flex; gap: 5px; background: #222; padding: 4px; border-radius: 8px; }
        .role-tab { background: transparent; border: none; color: #aaa; padding: 6px 12px; font-weight: bold; border-radius: 6px; cursor: pointer; font-size: 13px; }
        .role-tab.active { background: #fff; color: #000; }
        
        .container { padding: 12px; }
        .card { background: #1e1e1e; padding: 16px; border-radius: 12px; margin-bottom: 12px; border: 1px solid #333; }
        .btn { background: #fff; color: #000; border: none; padding: 14px; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; width: 100%; text-align: center; margin-top: 10px; text-decoration: none; display: block; }
        .btn-green { background: #00875a; color: #fff; }
        
        input { width: 100%; padding: 12px; margin-top: 6px; margin-bottom: 12px; background: #2a2a2a; border: 1px solid #444; color: #fff; border-radius: 8px; font-size: 14px; }
        label { font-size: 13px; color: #bbb; }
        
        .map-box { width: 100%; height: 350px; border-radius: 10px; margin-bottom: 10px; border: 2px solid #444; }
        .ride-option { background: #2a2a2a; border: 2px solid #444; border-radius: 10px; padding: 12px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        .ride-option.selected { border-color: #00e676; background: #1a332c; }
        
        .status-badge { display: inline-block; padding: 6px 12px; border-radius: 6px; font-size: 13px; font-weight: bold; background: #333; color: #ff9800; }
        .pin-box { font-size: 26px; font-weight: bold; letter-spacing: 6px; color: #00e676; background: #111; padding: 10px; border-radius: 8px; text-align: center; margin: 10px 0; }
    </style>
</head>
<body>

    <div class="top-bar">
        <span style="font-weight: bold; font-size: 16px;">🚗 كومبو (Uber Style)</span>
        <div class="role-switcher">
            <button class="role-tab active" onclick="switchRole('passenger')">الراكب</button>
            <button class="role-tab" onclick="switchRole('captain')">الكابتن</button>
        </div>
    </div>

    <!-- ================= واجهة الراكب ================= -->
    <div id="passengerView" class="container">
        <!-- الخطوة 1: اختيار الموقع والوجهة من على الخريطة مباشرة -->
        <div class="card" id="passengerFormCard">
            <h3>📍 حدد مكان الاستلام والوجهة من الخريطة</h3>
            <label>اضغط على الخريطة لتحديد (موقع الاستلام - من)</label>
            <div id="passengerMap" class="map-box"></div>
            <button class="btn" type="button" onclick="getPassengerCurrentLocation()">📍 استخدام جي بي إس (موقعي الحالي)</button>
            
            <label style="margin-top:10px; display:block;">الوجهة (إلى أين؟)</label>
            <input type="text" id="pEndInput" placeholder="ادخل اسم الوجهة (مثال: المعادي، التجمع)" />

            <label>رقم الهاتف</label>
            <input type="tel" id="pPhone" placeholder="01xxxxxxxxx" maxlength="11" />
            
            <button class="btn" onclick="goToRideSelection()">التالي: اختيار نوع المركبة ➔</button>
        </div>

        <!-- الخطوة 2: اختيار نوع المشوار -->
        <div class="card" id="passengerRideSelectCard" style="display:none;">
            <h3>🚗 اختيار مشوار</h3>
            
            <div class="ride-option selected" id="opt-car" onclick="selectVehicle('ملاكي - UberX', '145 ج.م')">
                <div>
                    <strong>سيارة ملاكي (UberX)</strong>
                    <div style="font-size:12px; color:#aaa;">مكيف بالكامل، أسرع وصول</div>
                </div>
                <div style="font-weight:bold; font-size:16px;">145 ج.م</div>
            </div>

            <div class="ride-option" id="opt-bike" onclick="selectVehicle('سكوتتر - موتوسيكل', '110 ج.م')">
                <div>
                    <strong>سكوتتر (موتوسيكل)</strong>
                    <div style="font-size:12px; color:#aaa;">لتجاوز الزحام المروري</div>
                </div>
                <div style="font-weight:bold; font-size:16px;">110 ج.م</div>
            </div>

            <button class="btn btn-green" onclick="requestTripFinal()">بحث عن أقرب كابتن 🔍</button>
            <button class="btn" style="background:#333; color:#fff;" onclick="backToForm()">الرجوع لتعديل الخريطة ↺</button>
        </div>

        <!-- الخطوة 3: حالة الرحلة وانتظار الكابتن -->
        <div class="card" id="passengerStatusCard" style="display:none; text-align:center;">
            <span class="status-badge" id="tripStateBadge">جاري البحث عن كابتن...</span>
            <p id="tripDetailsText" style="margin-top: 15px; font-size: 15px;"></p>
            <div id="passengerPinContainer" style="display:none;">
                <label>كود التحقق (PIN) أعطه للكابتن عند ركوب السيارة:</label>
                <div class="pin-box" id="tripPinCode">----</div>
            </div>
        </div>
    </div>

    <!-- ================= واجهة الكابتن ================= -->
    <div id="captainView" class="container" style="display:none;">
        <div id="captainContent">
            <div class="card" style="text-align:center;">
                <span class="status-badge">🟢 متصل - رصد الطلبات القريبة</span>
                <div id="availableTrips" style="margin-top: 15px;">جاري البحث عن رحلات قريبة... 📡</div>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://pmpzilqpcomoodaksbhw.supabase.co";
        const SUPABASE_KEY = "sb_publishable_tjYI1IKegMFywNCqGPdKng_fSGIe7Zx";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentRole = 'passenger';
        let activeTripId = null;
        let selectedVehicleType = "ملاكي - UberX";
        let selectedPrice = "145 ج.م";
        let generatedPin = Math.floor(1000 + Math.random() * 9000).toString();
        let captainInTrip = false;
        let fetchInterval = null;
        
        let passMap = null, pickupMarker = null;
        let pickupLat = 30.0444, pickupLng = 31.2357; // افتدراضي القاهرة
        let capInternalMap = null, capMarker = null;

        function switchRole(role) {
            currentRole = role;
            if (role === 'passenger') {
                document.getElementById('passengerView').style.display = 'block';
                document.getElementById('captainView').style.display = 'none';
                document.querySelectorAll('.role-tab')[0].classList.add('active');
                document.querySelectorAll('.role-tab')[1].classList.remove('active');
                setTimeout(() => {
                    initPassengerMap();
                }, 200);
            } else {
                document.getElementById('passengerView').style.display = 'none';
                document.getElementById('captainView').style.display = 'block';
                document.querySelectorAll('.role-tab')[1].classList.add('active');
                document.querySelectorAll('.role-tab')[0].classList.remove('active');
                if (!captainInTrip) startFetchingTrips();
            }
        }

        function initPassengerMap() {
            if (!passMap) {
                passMap = L.map('passengerMap').setView([30.0444, 31.2357], 13);
                // استخدام طبقة خريطة احترافية ونقية تشبه خرائط جوجل
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    maxZoom: 19,
                    attribution: '© OpenStreetMap'
                }).addTo(passMap);

                pickupMarker = L.marker([pickupLat, pickupLng], {draggable: true}).addTo(passMap)
                    .bindPopup("📍 اسحب الدبوس أو اضغط لتحديد موقع الاستلام").openPopup();

                passMap.on('click', function(e) {
                    pickupLat = e.latlng.lat;
                    pickupLng = e.latlng.lng;
                    pickupMarker.setLatLng([pickupLat, pickupLng]);
                });

                pickupMarker.on('dragend', function(e) {
                    const pos = pickupMarker.getLatLng();
                    pickupLat = pos.lat;
                    pickupLng = pos.lng;
                });
            }
            passMap.invalidateSize();
        }

        function getPassengerCurrentLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(pos => {
                    pickupLat = pos.coords.latitude;
                    pickupLng = pos.coords.longitude;
                    passMap.setView([pickupLat, pickupLng], 16);
                    pickupMarker.setLatLng([pickupLat, pickupLng]);
                    alert('تم تحديد موقعك بدقة من الـ GPS ✅');
                }, () => { alert('تعذر جلب الموقع، يرجى تحديده من الخريطة يدوياً'); }, { enableHighAccuracy: true });
            }
        }

        function goToRideSelection() {
            const endLoc = document.getElementById('pEndInput').value.trim();
            const phone = document.getElementById('pPhone').value.trim();
            
            if (!endLoc || !phone) { 
                alert('الرجاء كتابة الوجهة ورقم الهاتف'); 
                return; 
            }
            document.getElementById('passengerFormCard').style.display = 'none';
            document.getElementById('passengerRideSelectCard').style.display = 'block';
        }

        function backToForm() {
            document.getElementById('passengerRideSelectCard').style.display = 'none';
            document.getElementById('passengerFormCard').style.display = 'block';
            setTimeout(() => { if (passMap) passMap.invalidateSize(); }, 200);
        }

        function selectVehicle(type, price) {
            selectedVehicleType = type;
            selectedPrice = price;
            document.getElementById('opt-car').classList.remove('selected');
            document.getElementById('opt-bike').classList.remove('selected');
            if (type.includes('ملاكي')) {
                document.getElementById('opt-car').classList.add('selected');
            } else {
                document.getElementById('opt-bike').classList.add('selected');
            }
        }

        async function requestTripFinal() {
            const phone = document.getElementById('pPhone').value.trim();
            const endLoc = document.getElementById('pEndInput').value.trim();

            const payload = {
                start_station: `موقع الراكب (${pickupLat.toFixed(4)}, ${pickupLng.toFixed(4)}) [${selectedVehicleType}]`,
                end_station: endLoc,
                trip_price: selectedPrice,
                user_mobile: phone,
                status: 'pending',
                trip_pin: generatedPin
            };

            try {
                let res = await fetch(`${SUPABASE_URL}/rest/v1/trips_data`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`,
                        'Prefer': 'return=representation'
                    },
                    body: JSON.stringify(payload)
                });
                let result = await res.json();

                if (!res.ok || !result.length) {
                    const basicPayload = {
                        start_station: `خط عرض ${pickupLat.toFixed(2)}`,
                        end_station: endLoc,
                        trip_price: selectedPrice,
                        user_mobile: phone
                    };
                    res = await fetch(`${SUPABASE_URL}/rest/v1/trips_data`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'apikey': SUPABASE_KEY,
                            'Authorization': `Bearer ${SUPABASE_KEY}`,
                            'Prefer': 'return=representation'
                        },
                        body: JSON.stringify(basicPayload)
                    });
                    result = await res.json();
                }

                if (res.ok && result.length > 0) {
                    activeTripId = result[0].id;
                    document.getElementById('passengerRideSelectCard').style.display = 'none';
                    const statusCard = document.getElementById('passengerStatusCard');
                    statusCard.style.display = 'block';
                    document.getElementById('tripStateBadge').innerText = "⏳ جارِ البحث عن أقرب كابتن...";
                    document.getElementById('passengerPinContainer').style.display = 'block';
                    document.getElementById('tripPinCode').innerText = generatedPin;
                    listenToTripStatus();
                } else {
                    alert('خطأ في إرسال الطلب');
                }
            } catch (err) {
                alert('تعذر الاتصال بالسيرفر');
            }
        }

        function listenToTripStatus() {
            setInterval(async () => {
                if (!activeTripId) return;
                const { data } = await supabaseClient.from('trips_data').select('*').eq('id', activeTripId).single();
                if (data) {
                    if (data.status === 'accepted') {
                        document.getElementById('tripStateBadge').innerText = "🚗 الكابتن قبل رحلتك وهو في الطريق إليك";
                        document.getElementById('tripDetailsText').innerHTML = `السعر: ${data.trip_price}<br>📍 الكابتن يتحرك الآن على الخريطة لموقعك`;
                    } else if (data.status === 'arrived') {
                        document.getElementById('tripStateBadge').innerText = "🟢 وصل الكابتن إليك!";
                        document.getElementById('tripDetailsText').innerHTML = `⏱️ <b>أعط الكابتن كود الـ PIN لبدء الرحلة!</b>`;
                    } else if (data.status === 'started') {
                        document.getElementById('tripStateBadge').innerText = "🚀 الرحلة جارية الآن نحو الوجهة";
                        document.getElementById('tripDetailsText').innerHTML = `🎯 الوجهة النهائية: <b>${data.end_station}</b><br>رحلة موفقة!`;
                    }
                }
            }, 3000);
        }

        function startFetchingTrips() {
            if (fetchInterval) clearInterval(fetchInterval);
            fetchAvailableTrips();
            fetchInterval = setInterval(fetchAvailableTrips, 4000);
        }

        async function fetchAvailableTrips() {
            if (captainInTrip) return;
            const container = document.getElementById('captainContent');
            const { data } = await supabaseClient.from('trips_data').select('*').order('id', { ascending: false });

            if (!data || data.length === 0) {
                container.innerHTML = `<div class="card" style="text-align:center;">📭 لا توجد رحلات قريبة حالياً</div>`;
                return;
            }

            let html = `<div class="card"><h3 style="margin-top:0; color:#ff9800;">🚗 رحلات متاحة للقبول (حدد المسافة والوجهة)</h3>`;
            let found = false;
            data.forEach(t => {
                if (!t.status || t.status === 'pending') {
                    found = true;
                    html += `
                        <div style="background:#2a2a2a; padding:14px; border-radius:10px; margin-bottom:12px; text-align:right; border-right: 4px solid #00e676;">
                            <div style="font-size:15px; font-weight:bold; color:#00e676; margin-bottom:6px;">💰 السعر: ${t.trip_price}</div>
                            <div>📍 الاستلام (من): <b>${t.start_station}</b></div>
                            <div>🎯 الوجهة (إلى): <b>${t.end_station}</b></div>
                            <div style="font-size:13px; color:#aaa; margin:6px 0;">📏 المسافة التقريبية: ~5 كم (يبعد عنك 3 دقائق)</div>
                            <div>📱 هاتف الراكب: ${t.user_mobile}</div>
                            <div style="display:flex; gap:10px; margin-top:10px;">
                                <button class="btn btn-green" style="margin-top:0;" onclick="acceptTrip(${t.id}, '${t.start_station}', '${t.end_station}')">قبول الرحلة ✅</button>
                            </div>
                        </div>
                    `;
                }
            });
            html += `</div>`;
            if (!found) {
                container.innerHTML = `<div class="card" style="text-align:center;">📭 لا توجد رحلات جديدة حالياً</div>`;
            } else {
                container.innerHTML = html;
            }
        }

        async function acceptTrip(tripId, startStation, endStation) {
            captainInTrip = true;
            if (fetchInterval) clearInterval(fetchInterval);

            await supabaseClient.from('trips_data').update({ status: 'accepted' }).eq('id', tripId);
            
            const content = document.getElementById('captainContent');
            content.innerHTML = `
                <div class="card">
                    <h3>🚗 في طريقك لنقطة الاستلام (الراكب)</h3>
                    <p style="font-size:14px; color:#aaa;">📍 مكان الاستلام: <b>${startStation}</b></p>
                    <div id="internalCaptainMap" class="map-box"></div>
                    <button class="btn btn-green" onclick="arriveToPassenger(${tripId}, '${endStation}')" style="margin-top:10px;">وصلت لمكان الراكب (أدخل PIN) 📍</button>
                </div>
            `;

            setTimeout(() => {
                capInternalMap = L.map('internalCaptainMap').setView([pickupLat, pickupLng], 14);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(capInternalMap);
                L.marker([pickupLat, pickupLng]).addTo(capInternalMap).bindPopup("📍 موقع الراكب المطلوب").openPopup();

                if (navigator.geolocation) {
                    navigator.geolocation.watchPosition((pos) => {
                        const lat = pos.coords.latitude;
                        const lng = pos.coords.longitude;
                        if (capMarker) capInternalMap.removeLayer(capMarker);
                        capMarker = L.marker([lat, lng]).addTo(capInternalMap).bindPopup("🚗 موقعك الحالي").openPopup();
                    }, null, { enableHighAccuracy: true });
                }
            }, 300);
        }

        async function arriveToPassenger(tripId, endStation) {
            const enteredPin = prompt("أدخل كود الـ PIN المكون من 4 أرقام الذي مع الراكب لبدء الرحلة:");
            if (!enteredPin) return;

            const { data } = await supabaseClient.from('trips_data').select('trip_pin').eq('id', tripId).single();
            
            if (!data || !data.trip_pin || data.trip_pin === enteredPin) {
                await supabaseClient.from('trips_data').update({ status: 'started' }).eq('id', tripId);
                
                const content = document.getElementById('captainContent');
                content.innerHTML = `
                    <div class="card" style="background:#004d40;">
                        <h3 style="color:#a5d6a7; text-align:center;">🚀 الرحلة جارية الآن نحو الوجهة</h3>
                        <p style="font-size:16px; margin:10px 0; text-align:center;">🎯 الوجهة النهائية: <b>${endStation}</b></p>
                        <div id="internalDestMap" class="map-box"></div>
                    </div>
                `;

                setTimeout(() => {
                    const destMap = L.map('internalDestMap').setView([30.0444, 31.2357], 14);
                    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(destMap);

                    if (navigator.geolocation) {
                        navigator.geolocation.watchPosition((pos) => {
                            const lat = pos.coords.latitude;
                            const lng = pos.coords.longitude;
                            L.marker([lat, lng]).addTo(destMap).bindPopup("🚗 التوجيه للوجهة النهائية").openPopup();
                            destMap.setView([lat, lng], 15);
                        }, null, { enableHighAccuracy: true });
                    }
                }, 300);
            } else {
                alert('⚠️ كود الـ PIN غير صحيح، تأكد من الراكب');
            }
        }
    </script>
</body>
</html>
