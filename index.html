<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كومبو | تنقل بذكاء وأمان</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        body { 
            margin: 0; padding: 0; 
            background: #050b14; 
            background-image: radial-gradient(circle at 50% 0%, rgba(37, 99, 235, 0.18) 0%, transparent 60%);
            color: #fff; display: flex; align-items: center; justify-content: center; min-height: 100vh; 
        }
        .wrapper { width: 100%; max-width: 400px; padding: 20px; }
        
        .card-box { 
            background: rgba(15, 23, 42, 0.75); 
            backdrop-filter: blur(20px); 
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08); 
            padding: 32px 24px; border-radius: 28px; 
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7);
            text-align: center; position: relative; overflow: hidden;
        }

        .logo-area { font-weight: 900; font-size: 26px; color: #fff; margin-bottom: 8px; letter-spacing: -0.5px; }
        .logo-area span { color: #38bdf8; }
        .sub-desc { font-size: 13px; color: #94a3b8; margin-bottom: 25px; font-weight: 400; }

        /* تباين المود الفاخر */
        .segmented-control {
            display: flex; background: rgba(2, 6, 23, 0.9);
            border-radius: 14px; padding: 5px; margin-bottom: 25px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .seg-btn {
            flex: 1; padding: 12px; border: none; background: transparent;
            color: #64748b; font-size: 14px; font-weight: 700; border-radius: 10px;
            cursor: pointer; transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .seg-btn.active {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: #fff; box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4);
        }

        .input-wrapper { position: relative; margin-bottom: 16px; text-align: right; }
        .input-box { 
            width: 100%; padding: 15px 18px; border-radius: 14px; 
            background: rgba(2, 6, 23, 0.7); 
            border: 1px solid rgba(255, 255, 255, 0.08); 
            color: #fff; font-size: 15px; transition: all 0.3s ease; 
        }
        .input-box:focus { 
            border-color: #38bdf8; outline: none; 
            box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.15); 
            background: rgba(2, 6, 23, 0.95);
        }

        .select-custom { 
            width: 100%; padding: 15px 18px; border-radius: 14px; 
            background: rgba(2, 6, 23, 0.7); color: #fff; 
            border: 1px solid rgba(255, 255, 255, 0.08); font-size: 15px; 
            appearance: none; cursor: pointer; text-align: right;
        }

        .main-btn { 
            background: linear-gradient(135deg, #38bdf8, #2563eb); 
            color: #fff; border: none; padding: 16px; width: 100%; 
            border-radius: 14px; font-weight: 700; cursor: pointer; 
            margin-top: 10px; font-size: 16px; 
            box-shadow: 0 8px 25px rgba(37, 99, 235, 0.35);
            transition: transform 0.2s, opacity 0.2s; 
        }
        .main-btn:active { transform: scale(0.98); }
        
        .footer-link { margin-top: 18px; font-size: 13px; color: #38bdf8; cursor: pointer; display: inline-block; font-weight: 600; }
        .footer-link:hover { text-decoration: underline; }
        
        .form-pane { display: none; opacity: 0; transition: opacity 0.3s ease; }
        .form-pane.active { display: block; opacity: 1; }
    </style>
</head>
<body>

    <div class="wrapper">
        <div class="card-box">
            <div class="logo-area">كومبو <span>COMBO</span></div>
            <div class="sub-desc" id="dynamic-subtitle">بوابتك الذكية للتنقل الآمن والموثوق</div>
            
            <!-- أزرار التبديل العلوية الاحترافية -->
            <div class="segmented-control">
                <button class="seg-btn active" id="tab-login" onclick="switchMode('login')">تسجيل الدخول</button>
                <button class="seg-btn" id="tab-register" onclick="switchMode('register')">حساب جديد</button>
            </div>

            <!-- لوحة تسجيل الدخول -->
            <div id="pane-login" class="form-pane active">
                <div class="input-wrapper">
                    <input type="tel" id="l-phone" class="input-box" placeholder="رقم الموبايل (01xxxxxxxxx)" maxlength="11" style="text-align: right; direction: ltr;">
                </div>
                <div class="input-wrapper">
                    <input type="password" id="l-pass" class="input-box" placeholder="كلمة المرور">
                </div>
                <button class="main-btn" onclick="executeLogin()">دخول سريع ⚡</button>
                <span class="footer-link" onclick="executeForgotPass()">نسيت كلمة المرور؟</span>
            </div>

            <!-- لوحة إنشاء الحساب -->
            <div id="pane-register" class="form-pane">
                <div class="input-wrapper">
                    <input type="text" id="r-name" class="input-box" placeholder="الاسم بالكامل">
                </div>
                <div class="input-wrapper">
                    <input type="tel" id="r-phone" class="input-box" placeholder="رقم الموبايل (01xxxxxxxxx)" maxlength="11" style="text-align: right; direction: ltr;">
                </div>
                <div class="input-wrapper">
                    <input type="password" id="r-pass" class="input-box" placeholder="كلمة المرور الجديدة">
                </div>
                <div class="input-wrapper">
                    <select id="r-role" class="select-custom">
                        <option value="rider">🚏 راكب - أرغب في حجز رحلات وتنقل</option>
                        <option value="driver">🚗 كابتن - أرغب في القيادة وتوصيل الركاب</option>
                    </select>
                </div>
                <button class="main-btn" onclick="executeRegister()">إنشاء الحساب والانطلاق 🚀</button>
            </div>

        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://pmpzilqpcomoodaksbhw.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_tjYI1IKegMFywNCqGPdKng_fSGIe7Zx';
        let supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function switchMode(mode) {
            if (mode === 'login') {
                document.getElementById('tab-login').classList.add('active');
                document.getElementById('tab-register').classList.remove('active');
                document.getElementById('pane-login').classList.add('active');
                document.getElementById('pane-register').classList.remove('active');
                document.getElementById('dynamic-subtitle').innerText = 'أهلاً بعودتك، ادخل لحسابك فوراً';
            } else {
                document.getElementById('tab-register').classList.add('active');
                document.getElementById('tab-login').classList.remove('active');
                document.getElementById('pane-register').classList.add('active');
                document.getElementById('pane-login').classList.remove('active');
                document.getElementById('dynamic-subtitle').innerText = 'انضم إلينا وابدأ رحلتك معنا اليوم';
            }
        }

        async function executeLogin() {
            const phone = document.getElementById('l-phone').value.trim();
            const password = document.getElementById('l-pass').value.trim();

            const phoneRegex = /^01[0125][0-9]{8}$/;
            if (!phoneRegex.test(phone)) {
                alert('يرجى إدخال رقم موبايل مصري صحيح مكون من 11 رقماً.');
                return;
            }
            if (!password) {
                alert('يرجى إدخال كلمة المرور.');
                return;
            }

            let { data: user, error } = await supabaseClient.from('profiles').select('*').eq('phone', phone).single();

            if (error || !user) {
                alert('هذا الرقم غير مسجل لدينا، انضم إلينا عبر تبويب حساب جديد.');
                return;
            }

            if (user.password && user.password !== password) {
                alert('كلمة المرور غير صحيحة!');
                return;
            }

            saveAndRedirect(user);
        }

        async function executeRegister() {
            const name = document.getElementById('r-name').value.trim();
            const phone = document.getElementById('r-phone').value.trim();
            const password = document.getElementById('r-pass').value.trim();
            const role = document.getElementById('r-role').value;

            if (!name || !password) {
                alert('يرجى إكمال جميع الحقول المطلوبة.');
                return;
            }

            const phoneRegex = /^01[0125][0-9]{8}$/;
            if (!phoneRegex.test(phone)) {
                alert('يرجى إدخال رقم موبايل مصري صحيح مكون من 11 رقماً.');
                return;
            }

            let { data: existingUser } = await supabaseClient.from('profiles').select('*').eq('phone', phone).single();
            if (existingUser) {
                alert('رقم الموبايل مسجل مسبقاً، قم بتسجيل الدخول مباشرة.');
                switchMode('login');
                document.getElementById('l-phone').value = phone;
                return;
            }

            const newId = crypto.randomUUID();
            const newUserObj = {
                id: newId,
                full_name: name,
                phone: phone,
                password: password,
                user_type: role,
                wallet_balance: role === 'driver' ? 100.00 : 0.00
            };

            const { error } = await supabaseClient.from('profiles').insert([newUserObj]);
            if (error) {
                alert('خطأ أثناء إنشاء الحساب: ' + error.message);
                return;
            }

            alert('تم إنشاء حسابك بنجاح يا بطل!');
            saveAndRedirect(newUserObj);
        }

        async function executeForgotPass() {
            const phone = document.getElementById('l-phone').value.trim();
            if (!phone) {
                alert('يرجى كتابة رقم الموبايل أولاً في خانة تسجيل الدخول ثم اضغط على نسيت كلمة المرور.');
                return;
            }

            let { data: user } = await supabaseClient.from('profiles').select('*').eq('phone', phone).single();
            if (!user) {
                alert('هذا الرقم غير مسجل في النظام.');
                return;
            }

            const newPass = prompt('أدخل كلمة المرور الجديدة لحسابك:');
            if (!newPass) return;

            const { error } = await supabaseClient.from('profiles').update({ password: newPass }).eq('id', user.id);
            if (error) {
                alert('خطأ في التحديث: ' + error.message);
                return;
            }

            alert('تم تحديث كلمة المرور بنجاح، يمكنك تسجيل الدخول بها الآن!');
            document.getElementById('l-pass').value = newPass;
        }

        function saveAndRedirect(user) {
            localStorage.setItem('combo_user', JSON.stringify(user));
            if (user.user_type === 'driver') {
                window.location.href = 'captain.html';
            } else {
                window.location.href = 'passenger.html';
            }
        }
    </script>
</body>
</html>
