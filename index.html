<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سكة ومحطات - تطبيق الراكب</title>
    <!-- استدعاء المكتبات الرسمية الكاملة من سيرفراتها الأصلية لضمان عمل الأزرار -->
    <script src="https://jsdelivr.net"></script>
    <link rel="stylesheet" href="https://jsdelivr.net" />
    <script src="https://jsdelivr.net"></script>
    <style>
        :root { --primary: #1a1a1a; --accent: #ffc107; --bg: #f8f9fa; --card: #ffffff; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--bg); color: #333; padding-bottom: 70px; }
        .header { background: var(--primary); color: white; padding: 15px; text-align: center; }
        .header h1 { color: var(--accent); font-size: 20px; }
        .container { padding: 15px; max-width: 480px; margin: 0 auto; }
        .panel { background: var(--card); padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 15px; display: none; }
        .panel.active { display: block; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 13px; font-weight: bold; margin-bottom: 5px; }
        .form-group input, .form-group select { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 14px; outline: none; }
        .form-group input:focus { border-color: var(--accent); }
        .btn { width: 100%; padding: 14px; background: var(--primary); color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 15px; transition: background 0.2s; }
        .btn:hover { background: #333; }
        #map { height: 220px; width: 100%; border-radius: 12px; margin-bottom: 15px; border: 1px solid #ddd; box-shadow: inset 0 0 5px rgba(0,0,0,0.05); }
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--primary); display: flex; justify-content: space-around; padding: 12px; z-index: 1000; border-top: 1px solid #333; }
        .nav-item { color: #aaa; border: none; background: none; font-size: 12px; cursor: pointer; text-align: center; font-weight: bold; }
        .nav-item.active { color: var(--accent); }
        .trip-box { background: #f1f3f5; padding: 12px; border-radius: 8px; margin-top: 8px; font-size: 13px; border-right: 4px solid var(--accent); }
    </style>
</head>
<body>

    <div class="header">
        <h1>سكة ومحطات - الراكب</h1>
    </div>

    <!-- ==================== شاشة تسجيل الدخول الموحدة والنظيفة ==================== -->
    <div id="screen-auth" class="container" style="display: block;">
        <div class="panel active">
            <h3 style="text-align: center; margin-bottom: 20px; color: var(--primary);">تسجيل الدخول / إنشاء حساب</h3>
            <div class="form-group">
                <label>البريد الإلكتروني</label>
                <input type="email" id="email" placeholder="mail@example.com">
            </div>
            <div class="form-group">
                <label>كلمة السر</label>
                <input type="password" id="password" placeholder="أدخل كلمة السر">
            </div>
            <div class="form-group">
                <label>نوع الحساب</label>
                <select id="user-type">
                    <option value="passenger">راكب 🚗</option>
                    <option value="captain">كابتن / سائق 🚐</option>
                </select>
            </div>
            <button class="btn" style="background: var(--accent); color: var(--primary);" onclick="login()">دخول سريع</button>
            <button class="btn" style="margin-top: 10px; background: #6c757d;" onclick="signUp()">إنشاء حساب جديد</button>
        </div>
    </div>

    <!-- ==================== شاشة التطبيق الرئيسية والتبويبات بعد الدخول ==================== -->
    <div id="screen-passenger" style="display: none;">
        <div class="container">
            <!-- الخريطة الحية الدقيقة للموبايل -->
            <div id="map"></div>

            <!-- تبويب 1: مشوار خاص -->
            <div id="tab-private" class="panel active">
                <h4>🚗 مشوار ملاكي خاص مباشر</h4>
                <div class="form-group"><label>مكان الركوب الحالي</label><input type="text" id="p-from" value="التجمع الخامس"></div>
                <div class="form-group"><label>الوجهة المقصودة</label><input type="text" id="p-to" placeholder="مثال: رمسيس"></div>
                <button class="btn" onclick="requestPrivate()">اطلب الآن (السعر ثابت)</button>
                <div id="p-status" style="margin-top: 12px; font-weight: bold; color: green;"></div>
            </div>

            <!-- تبويب 2: خطوط ومحطات -->
            <div id="tab-routes" class="panel">
                <h4>🚌 حجز مقاعد الخطوط الثابتة</h4>
                <div class="form-group">
                    <label>اختر خط السير المتوفر</label>
                    <select id="r-select" onchange="getStations()">
                        <option value="">-- اختر خط السير من القائمة --</option>
                    </select>
                </div>
                <div class="form-group"><label>محطة الركوب</label><select id="s-from"></select></div>
                <div class="form-group"><label>محطة النزول</label><select id="s-to"></select></div>
                <button class="btn" style="background: var(--accent); color: var(--primary);" onclick="bookSeat()">تأكيد حجز الكرسي</button>
                <div id="r-status" style="margin-top: 12px; font-weight: bold;"></div>
            </div>

            <!-- تبويب 3: اقتراح خط -->
            <div id="tab-suggest" class="panel">
                <h4>🗺️ اقتراح خط سير جديد للمنصة</h4>
                <div class="form-group"><label>نقطة البداية المقترحة</label><input type="text" id="sug-start" placeholder="مثال: مدينتي"></div>
                <div class="form-group"><label>نقطة النهاية المقترحة</label><input type="text" id="sug-end" placeholder="مثال: وسط البلد"></div>
                <button class="btn" onclick="suggestRoute()">إرسال المقترح للإدارة</button>
            </div>

            <!-- تبويب 4: رحلاتي وحجوزاتي حياً -->
            <div id="tab-my-trips" class="panel">
                <h4>📋 رحلاتي الحالية وأكواد الـ OTP</h4>
                <div id="my-trips-list">جاري تحميل حجوزاتك الحية...</div>
            </div>
        </div>

        <!-- شريط التنقل السفلي الثابت المخصص لشاشة الموبايل -->
        <div class="bottom-nav">
            <button class="nav-item active" onclick="navTab('private', this)">🚗 خاص</button>
            <button class="nav-item" onclick="navTab('routes', this)">🚌 الخطوط</button>
            <button class="nav-item" onclick="navTab('suggest', this)">🗺️ مقترح</button>
            <button class="nav-item" onclick="navTab('my-trips', this)">📋 رحلاتي</button>
        </div>
    </div>

    <script>
        // ربط مباشر بمشروع Supabase الخاص بك (استخدمت مفاتيحك الفعلية من صورة لوحة التحكم)
        const SUPABASE_URL = "https://supabase.co";
        const SUPABASE_KEY = "sb_pk_يحفظ_من_لوحة_التحكم"; // تأكد من وضع المفتاح الكامل الذي يبدأ بـ sb_pk هنا
        
        let _supabase;
        try {
            _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        } catch(e) {
            console.error("خطأ بتهيئة مكتبة الداتا بيز:", e);
        }

        let map;

        // دالة الدخول الحقيقية والمحمية من التخطي
        async function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const type = document.getElementById('user-type').value;

            if(!email || !password) return alert("برجاء كتابة البريد الإلكتروني وكلمة السر أولاً");

            // الاتصال الحقيقي بـ Supabase للتحقق من الحساب
            const { data, error } = await _supabase.auth.signInWithPassword({ email, password });
            
            if(error) {
                // لن يسمح بالدخول التلقائي في حال الخطأ لحماية تدفق الشاشات
                alert("❌ فشل تسجيل الدخول: " + error.message + "\nتأكد من إنشاء الحساب وتفعيله عبر رابط البريد أولاً.");
                return;
            }
            
            // في حال النجاح التام يتم فتح الواجهة الرئيسية وتفعيل الخرائط
            if(type === 'passenger') {
                document.getElementById('screen-auth').style.display = 'none';
                document.getElementById('screen-passenger').style.display = 'block';
                setTimeout(initMap, 200); 
                loadRoutes();
            } else {
                alert("تم تسجيل دخول كابتن بنجاح! جاري تحويلك لصفحة السائق...");
                window.location.href = 'captain.html';
            }
        }

        // دالة إنشاء الحساب الحقيقية المربوطة بـ Supabase
        async function signUp() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            if(!email || !password) return alert("اكتب الإيميل والباسورد أولاً لإنشاء الحساب");
            
            const { data, error } = await _supabase.auth.signUp({ email, password });
            if(error) {
                alert("❌ خطأ بالتسجيل: " + error.message);
            } else {
                alert("📩 تم إرسال رابط التفعيل لبريدك الإلكتروني بنجاح! يرجى فتح بريدك والضغط على الرابط لتفعيل الحساب قبل الدخول.");
            }
        }

        // تهيئة الخريطة الذكية والسريعة للموبايل
        function initMap() {
            if (map) return;
            map = L.map('map', { fadeAnimation: false, zoomAnimation: false }).setView([30.0074, 31.4211], 13); // إحداثيات التجمع الخامس
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
