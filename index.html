<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>كومبو - المنظومة الاحترافية</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * { box-sizing: border-box; }
        body { font-family: Tahoma, sans-serif; background: #121212; color: #fff; margin: 0; padding: 0; }
        .top-bar { background: #000; padding: 12px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; }
        .role-switcher { display: flex; gap: 5px; background: #222; padding: 4px; border-radius: 8px; }
        .role-tab { background: transparent; border: none; color: #aaa; padding: 6px 12px; font-weight: bold; border-radius: 6px; cursor: pointer; font-size: 13px; }
        .role-tab.active { background: #fff; color: #000; }
        
        .container { padding: 12px; }
        .card { background: #1e1e1e; padding: 16px; border-radius: 12px; margin-bottom: 12px; border: 1px solid #333; }
        .btn { background: #fff; color: #000; border: none; padding: 14px; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; width: 100%; text-align: center; margin-top: 10px; }
        .btn-green { background: #00875a; color: #fff; }
        
        input, select { width: 100%; padding: 12px; margin-top: 6px; margin-bottom: 12px; background: #2a2a2a; border: 1px solid #444; color: #fff; border-radius: 8px; font-size: 14px; }
        label { font-size: 13px; color: #bbb; }
        
        .map-box { width: 100%; height: 280px; border-radius: 8px; margin-bottom: 10px; }
        .status-badge { display: inline-block; padding: 6px 12px; border-radius: 6px; font-size: 13px; font-weight: bold; background: #333; color: #ff9800; }
        .pin-box { font-size: 24px; font-weight: bold; letter-spacing: 5px; color: #00e676; background: #111; padding: 10px; border-radius: 8px; text-align: center; margin: 10px 0; }
    </style>
</head>
<body>

    <div class="top-bar">
        <span style="font-weight: bold; font-size: 16px;">🚗 كومبو (Uber Style)</span>
        <div class="role-switcher">
            <button class="role-tab active" onclick="switchRole('passenger')">الراكب</button>
            <button class="role-tab" onclick="switchRole('captain')">الكابتن</button>
        </div>
    </div>

    <!-- ================= واجهة الراكب ================= -->
    <div id="passengerView" class="container">
        <div class="card" id="passengerFormCard">
            <h3>📍 اطلب رحلتك الآن</h3>
            <label>موقف القيام</label>
            <select id="pStart">
                <option value="موقف العاشر (محطة المترو)">موقف العاشر (محطة المترو)</option>
                <option value="موقف ألماظة">موقف ألماظة</option>
            </select>
            <label>موقف الوصول</label>
            <select id="pEnd">
                <option value="موقف بلبيس الجديد">موقف بلبيس الجديد</option>
                <option value="موقف الزقازيق الأحرار">موقف الزقازيق الأحرار</option>
            </select>
            <label>رقم الهاتف</label>
            <input type="tel" id="pPhone" placeholder="01xxxxxxxxx" maxlength="11" />
            <button class="btn btn-green" onclick="requestTrip()">بحث عن كابتن 🔍</button>
        </div>

        <div class="card" id="passengerStatusCard" style="display:none; text-align:center;">
            <span class="status-badge" id="tripStateBadge">جاري البحث عن كابتن...</span>
            <div id="passengerMap" class="map-box" style="display:none; margin-top:10px;"></div>
            <p id="tripDetailsText" style="margin-top: 15px; font-size: 15px;"></p>
            <div id="passengerPinContainer" style="display:none;">
                <label>كود التحقق (أعطه للكابتن):</label>
                <div class="pin-box" id="tripPinCode">----</div>
            </div>
        </div>
    </div>

    <!-- ================= واجهة الكابتن ================= -->
    <div id="captainView" class="container" style="display:none;">
        <div id="captainMap" class="map-box"></div>
        <div id="captainContent">
            <div class="card" style="text-align:center;">
                <span class="status-badge">🟢 متصل - جاري استقبال المشاوير</span>
                <div id="availableTrips" style="margin-top: 15px;">جاري رصد الرحلات القريبة... 📡</div>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://pmpzilqpcomoodaksbhw.supabase.co";
        const SUPABASE_KEY = "sb_publishable_tjYI1IKegMFywNCqGPdKng_fSGIe7Zx";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentRole = 'passenger';
        let capMap, passMap, captainMarker, passengerMarker, activeTripId = null;
        let generatedPin = Math.floor(1000 + Math.random() * 9000).toString();

        function switchRole(role) {
            currentRole = role;
            if (role === 'passenger') {
                document.getElementById('passengerView').style.display = 'block';
                document.getElementById('captainView').style.display = 'none';
                document.querySelectorAll('.role-tab')[0].classList.add('active');
                document.querySelectorAll('.role-tab')[1].classList.remove('active');
            } else {
                document.getElementById('passengerView').style.display = 'none';
                document.getElementById('captainView').style.display = 'block';
                document.querySelectorAll('.role-tab')[1].classList.add('active');
                document.querySelectorAll('.role-tab')[0].classList.remove('active');
                initCaptainMap();
                fetchAvailableTrips();
            }
        }

        async function requestTrip() {
            const phone = document.getElementById('pPhone').value.trim();
            if (!phone) { alert('ادخل رقم الهاتف'); return; }

            const payload = {
                start_station: document.getElementById('pStart').value,
                end_station: document.getElementById('pEnd').value,
                trip_price: "85 ج.م",
                user_mobile: phone,
                status: 'pending',
                trip_pin: generatedPin
            };

            try {
                const { data, error } = await supabaseClient.from('trips_data').insert([payload]).select();
                if (!error && data && data.length > 0) {
                    activeTripId = data[0].id;
                    document.getElementById('passengerFormCard').style.display = 'none';
                    const statusCard = document.getElementById('passengerStatusCard');
                    statusCard.style.display = 'block';
                    document.getElementById('tripStateBadge').innerText = "⏳ جارِ انتظار قبول الكابتن...";
                    document.getElementById('passengerPinContainer').style.display = 'block';
                    document.getElementById('tripPinCode').innerText = generatedPin;
                    listenToTripStatus();
                } else {
                    // طريقة بديلة للإرسال لو جدول الداتا بيز فيه قيود
                    const res = await fetch(`${SUPABASE_URL}/rest/v1/trips_data`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'apikey': SUPABASE_KEY,
                            'Authorization': `Bearer ${SUPABASE_KEY}`,
                            'Prefer': 'return=representation'
                        },
                        body: JSON.stringify(payload)
                    });
                    const result = await res.json();
                    if (res.ok && result.length > 0) {
                        activeTripId = result[0].id;
                        document.getElementById('passengerFormCard').style.display = 'none';
                        document.getElementById('passengerStatusCard').style.display = 'block';
                        document.getElementById('tripStateBadge').innerText = "⏳ جارِ انتظار قبول الكابتن...";
                        document.getElementById('passengerPinContainer').style.display = 'block';
                        document.getElementById('tripPinCode').innerText = generatedPin;
                        listenToTripStatus();
                    } else {
                        alert('خطأ في إرسال الطلب، تأكد من حقول الجدول');
                    }
                }
            } catch (err) {
                alert('تعذر الاتصال بالسيرفر');
            }
        }

        function listenToTripStatus() {
            setInterval(async () => {
                if (!activeTripId) return;
                const { data } = await supabaseClient.from('trips_data').select('*').eq('id', activeTripId).single();
                if (data) {
                    if (data.status === 'accepted') {
                        document.getElementById('tripStateBadge').innerText = "🚗 الكابتن في الطريق إليك";
                        document.getElementById('tripDetailsText').innerHTML = `السعر: ${data.trip_price}<br>📍 الكابتن يتحرك في الطريق الصحيح`;
                        document.getElementById('passengerMap').style.display = 'block';
                        initPassengerMap();
                        trackDriverLocationForPassenger(activeTripId);
                    } else if (data.status === 'arrived') {
                        document.getElementById('tripStateBadge').innerText = "🟢 بدأ عداد الرحلة الآن";
                        document.getElementById('tripDetailsText').innerHTML = `⏱️ <b>الرحلة جارية مع الكابتن... رحلة موفقة!</b>`;
                    }
                }
            }, 3000);
        }

        function initPassengerMap() {
            if (!passMap) {
                passMap = L.map('passengerMap').setView([30.0444, 31.2357], 13);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(passMap);
            }
            setTimeout(() => passMap.invalidateSize(), 300);
        }

        function trackDriverLocationForPassenger(tripId) {
            setInterval(async () => {
                const { data } = await supabaseClient.from('driver_locations').select('*').eq('driver_id', tripId).single();
                if (data && passMap) {
                    const lat = data.latitude;
                    const lng = data.longitude;
                    if (passengerMarker) passMap.removeLayer(passengerMarker);
                    passengerMarker = L.marker([lat, lng]).addTo(passMap).bindPopup("مكان الكابتن الحالي").openPopup();
                    passMap.setView([lat, lng], 15);
                }
            }, 3000);
        }

        function initCaptainMap() {
            if (!capMap) {
                capMap = L.map('captainMap').setView([30.0444, 31.2357], 13);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(capMap);
            }
            setTimeout(() => capMap.invalidateSize(), 300);
        }

        async function fetchAvailableTrips() {
            const container = document.getElementById('availableTrips');
            const { data } = await supabaseClient.from('trips_data').select('*').order('id', { ascending: false });

            if (!data || data.length === 0) {
                container.innerHTML = "📭 لا توجد مشاوير قريبة حالياً";
                setTimeout(fetchAvailableTrips, 4000);
                return;
            }

            let html = '';
            data.forEach(t => {
                if (!t.status || t.status === 'pending') {
                    html += `
                        <div style="background:#2a2a2a; padding:12px; border-radius:8px; margin-bottom:10px; text-align:right;">
                            <div>📍 من: ${t.start_station}</div>
                            <div>🎯 إلى: ${t.end_station}</div>
                            <div>💰 السعر: ${t.trip_price}</div>
                            <div>📱 الراكب: ${t.user_mobile}</div>
                            <button class="btn btn-green" onclick="acceptTrip(${t.id})">قبول المشوار 🚗</button>
                        </div>
                    `;
                }
            });
            container.innerHTML = html || "📭 لا توجد مشاوير جديدة حالياً";
            setTimeout(fetchAvailableTrips, 4000);
        }

        async function acceptTrip(tripId) {
            await supabaseClient.from('trips_data').update({ status: 'accepted' }).eq('id', tripId);
            
            const content = document.getElementById('captainContent');
            content.innerHTML = `
                <div class="trip-popup">
                    <h3>🚗 في طريقك للراكب</h3>
                    <p>تابع مسار الخريطة للوصول للنقطة المحددة</p>
                    <button class="btn btn-green" onclick="arriveToPassenger(${tripId})">وصلت لمكان الراكب (بدء العداد) ⏱️</button>
                </div>
            `;

            if (navigator.geolocation) {
                navigator.geolocation.watchPosition(async (pos) => {
                    const lat = pos.coords.latitude;
                    const lng = pos.coords.longitude;
                    if (captainMarker) capMap.removeLayer(captainMarker);
                    captainMarker = L.marker([lat, lng]).addTo(capMap).bindPopup("مكانك الحالي").openPopup();
                    capMap.setView([lat, lng], 15);

                    await supabaseClient.from('driver_locations').upsert([{ driver_id: tripId, latitude: lat, longitude: lng }]);
                }, null, { enableHighAccuracy: true });
            }
        }

        async function arriveToPassenger(tripId) {
            await supabaseClient.from('trips_data').update({ status: 'arrived' }).eq('id', tripId);
            document.getElementById('captainContent').innerHTML = `
                <div class="trip-popup" style="background:#004d40;">
                    <h3 style="color:#a5d6a7;">⏱️ عداد الرحلة يعمل الآن</h3>
                    <p>السيارة تتحرك في الرحلة الأساسية مع الراكب</p>
                </div>
            `;
        }
    </script>
</body>
</html>
