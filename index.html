<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>كومبو - تسجيل دخول الراكب</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * { box-sizing: border-box; font-family: Tahoma, sans-serif; }
        body { background: #121212; color: #fff; margin: 0; padding: 0; direction: rtl; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .card { background: #1e1e1e; padding: 24px; border-radius: 12px; width: 90%; max-width: 400px; border: 1px solid #333; text-align: center; }
        .btn { background: #00875a; color: #fff; border: none; padding: 14px; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 15px; }
        input { width: 100%; padding: 14px; margin-top: 10px; margin-bottom: 15px; background: #2a2a2a; border: 1px solid #444; color: #fff; border-radius: 8px; font-size: 16px; text-align: center; letter-spacing: 2px; }
        label { font-size: 14px; color: #bbb; display: block; text-align: right; }
        .pin-display { font-size: 22px; color: #00e676; font-weight: bold; background: #111; padding: 10px; border-radius: 8px; margin: 10px 0; border: 1px dashed #00e676; display: none; }
    </style>
</head>
<body>

    <div class="card">
        <h2 style="margin-top:0; color:#00e676;">🚗 تسجيل دخول الراكب</h2>
        <p style="color:#aaa; font-size:13px; margin-bottom:20px;">أدخل رقم هاتفك للبدء في طلب الرحلات</p>

        <!-- خطوة 1: إدخال الهاتف -->
        <div id="stepPhone">
            <label>رقم الهاتف المحمول:</label>
            <input type="tel" id="userPhone" placeholder="01xxxxxxxx" maxlength="11" />
            <button class="btn" onclick="sendOtpCode()">إرسال كود التحقق 📨</button>
        </div>

        <!-- خطوة 2: إدخال كود التحقق OTP -->
        <div id="stepOtp" style="display:none;">
            <label>أدخل كود التحقق المكون من 4 أرقام:</label>
            <div class="pin-display" id="generatedOtpShow">----</div>
            <input type="number" id="enteredOtp" placeholder="----" maxlength="4" />
            <button class="btn" onclick="verifyOtpCode()">تأكيد وتسجيل الدخول ✅</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://pmpzilqpcomoodaksbhw.supabase.co";
        const SUPABASE_KEY = "sb_publishable_tjYI1IKegMFywNCqGPdKng_fSGIe7Zx";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentPhone = "";
        let expectedOtp = "";

        async function sendOtpCode() {
            const phone = document.getElementById('userPhone').value.trim();
            if (!phone || phone.length < 11) {
                alert('الرجاء إدخال رقم هاتف صحيح مكون من 11 رقماً');
                return;
            }

            currentPhone = phone;
            expectedOtp = Math.floor(1000 + Math.random() * 9000).toString();

            // إظهار الكود مؤقتاً للمحاكاة (أو إرساله عبر SMS مستقبلاً)
            document.getElementById('generatedOtpShow').innerText = expectedOtp;
            document.getElementById('generatedOtpShow').style.display = 'block';

            document.getElementById('stepPhone').style.display = 'none';
            document.getElementById('stepOtp').style.display = 'block';
        }

        async function verifyOtpCode() {
            const userEntered = document.getElementById('enteredOtp').value.trim();
            if (userEntered !== expectedOtp) {
                alert('كود التحقق غير صحيح، حاول مرة أخرى.');
                return;
            }

            // حفظ رقم الراكب في التخزين المحلي للمتصفح (Session) والانتقال لخريطة الطلب
            localStorage.setItem('passenger_phone', currentPhone);
            alert('تم تسجيل الدخول بنجاح! جاري تحويلك لطلب الرحلة...');
            window.location.href = 'passenger.html';
        }
    </script>
</body>
</html>
