<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة كومبو - المستقبل بين يديك</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        body { 
            margin: 0; padding: 0; 
            background: #030712; 
            background-image: radial-gradient(circle at 50% -20%, rgba(37, 99, 235, 0.25) 0%, transparent 70%),
                              radial-gradient(circle at 50% 120%, rgba(56, 189, 248, 0.15) 0%, transparent 60%);
            color: #fff; display: flex; align-items: center; justify-content: center; min-height: 100vh; 
            overflow-x: hidden;
        }
        .container { width: 100%; max-width: 440px; padding: 20px; }
        
        .epic-card { 
            background: rgba(15, 23, 42, 0.65); 
            backdrop-filter: blur(24px); 
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.08); 
            padding: 36px 28px; border-radius: 32px; 
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8);
            text-align: center; position: relative;
        }

        .brand-logo { font-size: 28px; font-weight: 900; letter-spacing: -1px; color: #fff; margin-bottom: 6px; }
        .brand-logo span { color: #38bdf8; text-shadow: 0 0 20px rgba(56, 189, 248, 0.5); }
        .tagline { font-size: 13px; color: #94a3b8; margin-bottom: 30px; }

        /* كروت الاختيار الفاخرة (بدون كلمات تقليدية) */
        .choice-grid { display: grid; grid-template-columns: 1fr; gap: 14px; margin-bottom: 20px; }
        .choice-pill {
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 18px 20px; border-radius: 18px; cursor: pointer;
            text-align: right; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex; align-items: center; justify-content: space-between;
        }
        .choice-pill:hover, .choice-pill.selected {
            background: rgba(37, 99, 235, 0.2);
            border-color: #38bdf8;
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(56, 189, 248, 0.15);
        }
        .choice-title { font-size: 15px; font-weight: 700; color: #fff; margin-bottom: 2px; }
        .choice-desc { font-size: 12px; color: #94a3b8; }
        .choice-icon { font-size: 22px; }

        .input-mega { 
            width: 100%; padding: 18px; border-radius: 16px; 
            background: rgba(2, 6, 23, 0.85); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            color: #fff; font-size: 16px; text-align: center; letter-spacing: 1px;
            margin-bottom: 15px; transition: all 0.3s ease; 
        }
        .input-mega:focus { 
            border-color: #38bdf8; outline: none; 
            box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.2); 
        }

        .btn-epic { 
            background: linear-gradient(135deg, #38bdf8, #2563eb); 
            color: #fff; border: none; padding: 18px; width: 100%; 
            border-radius: 16px; font-weight: 700; cursor: pointer; 
            font-size: 16px; box-shadow: 0 10px 30px rgba(37, 99, 235, 0.4);
            transition: transform 0.2s, opacity 0.2s; 
        }
        .btn-epic:active { transform: scale(0.98); }

        .back-action { margin-top: 20px; font-size: 13px; color: #38bdf8; cursor: pointer; display: inline-block; font-weight: 600; }
        .step-view { display: none; opacity: 0; transition: opacity 0.4s ease; }
        .step-view.active { display: block; opacity: 1; }
    </style>
</head>
<body>

    <div class="container">
        <div class="epic-card">
            <div class="brand-logo">كومبو <span>COMBO</span></div>
            <div class="tagline" id="main-tagline">اختر وجهتك وطريقتك في الانطلاق</div>

            <!-- الخطوة الأولى: اختيار الهدف بأسلوب فخم وخارج الصندوق -->
            <div id="step-selector" class="step-view active">
                <div class="choice-grid">
                    <div class="choice-pill" onclick="selectUserIntent('rider')">
                        <div>
                            <div class="choice-title">أبحث عن رحلة / تنقل آمن</div>
                            <div class="choice-desc">احجز مقعدك وتنقل براحة تامة</div>
                        </div>
                        <div class="choice-icon">🚏</div>
                    </div>
                    <div class="choice-pill" onclick="selectUserIntent('driver')">
                        <div>
                            <div class="choice-title">أرغب في القيادة وتقديم الرحلات</div>
                            <div class="choice-desc">انضم كقائد مركبة وضاعف دخلك</div>
                        </div>
                        <div class="choice-icon">🚗</div>
                    </div>
                </div>
            </div>

            <!-- الخطوة الثانية: إدخال الموبايل والبيانات بناءً على الاختيار الذكي -->
            <div id="step-auth" class="step-view">
                <div id="auth-subtitle" style="font-size: 14px; color: #38bdf8; margin-bottom: 15px; font-weight: 600;"></div>
                
                <input type="tel" id="user-phone" class="input-mega" placeholder="010xxxxxxxx" maxlength="11" style="direction: ltr;">
                
                <div id="extra-fields" style="display:none;">
                    <input type="text" id="user-name" class="input-mega" placeholder="اسمك الكريم بالكامل" style="text-align: right;">
                    <input type="password" id="user-pass" class="input-mega" placeholder="كلمة المرور الجديدة" style="text-align: center;">
                </div>

                <div id="login-pass-field" style="display:none;">
                    <input type="password" id="user-login-pass" class="input-mega" placeholder="كلمة المرور الحالية" style="text-align: center;">
                </div>

                <button class="btn-epic" id="action-btn" onclick="processAuthAction()">استمرار ⚡</button>
                <span class="back-action" onclick="resetToSelector()">← العودة للخيار الرئيسي</span>
            </div>

        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://pmpzilqpcomoodaksbhw.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_tjYI1IKegMFywNCqGPdKng_fSGIe7Zx';
        let supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let selectedRole = '';
        let foundUser = null;
        let isNewAccountFlow = false;

        function selectUserIntent(role) {
            selectedRole = role;
            document.getElementById('step-selector').classList.remove('active');
            const authStep = document.getElementById('step-auth');
            authStep.classList.add('active');

            if (role === 'rider') {
                document.getElementById('main-tagline').innerText = 'رحلتك القادمة تبدأ برقم هاتفك';
                document.getElementById('auth-subtitle').innerText = '🚏 وضع المسافر والتنقل';
            } else {
                document.getElementById('main-tagline').innerText = 'انضم كقائد مركبة وابدأ معنا';
                document.getElementById('auth-subtitle').innerText = '🚗 وضع القيادة والأرباح';
            }
        }

        async function processAuthAction() {
            const phone = document.getElementById('user-phone').value.trim();
            const phoneRegex = /^01[0125][0-9]{8}$/;

            if (!phoneRegex.test(phone)) {
                alert('يرجى إدخال رقم موبايل مصري صحيح مكون من 11 رقماً.');
                return;
            }

            // لو لسه بنفحص الرقم أول مرة
            if (!isNewAccountFlow && document.getElementById('extra-fields').style.display === 'none' && document.getElementById('login-pass-field').style.display === 'none') {
                let { data: user } = await supabaseClient.from('profiles').select('*').eq('phone', phone).single();

                if (user) {
                    // المستخدم مسجل مسبقاً -> اطلب الباسورد
                    foundUser = user;
                    document.getElementById('user-phone').style.display = 'none';
                    document.getElementById('login-pass-field').style.display = 'block';
                    document.getElementById('main-tagline').innerText = `مرحباً بعودتك، ${user.full_name || 'بطل كومبو'}`;
                    document.getElementById('action-btn').innerText = 'تسجيل الدخول 🔓';
                } else {
                    // مستخدم جديد -> اظهر خانة الاسم والباسورد
                    isNewAccountFlow = true;
                    document.getElementById('user-phone').style.display = 'none';
                    document.getElementById('extra-fields').style.display = 'block';
                    document.getElementById('main-tagline').innerText = 'أكمل بياناتك البسيطة للانطلاق';
                    document.getElementById('action-btn').innerText = 'إنشاء الحساب 🚀';
                }
                return;
            }

            // لو بيسجل دخول بمستخدم قديم
            if (foundUser) {
                const pass = document.getElementById('user-login-pass').value.trim();
                if (!pass) { alert('أدخل كلمة المرور'); return; }
                if (foundUser.password && foundUser.password !== pass) {
                    alert('كلمة المرور غير صحيحة!');
                    return;
                }
                redirectUser(foundUser);
            } 
            // لو بينشئ حساب جديد
            else if (isNewAccountFlow) {
                const name = document.getElementById('user-name').value.trim();
                const pass = document.getElementById('user-pass').value.trim();

                if (!name || !pass) {
                    alert('يرجى إدخال الاسم وكلمة المرور.');
                    return;
                }

                const newId = crypto.randomUUID();
                const newUser = {
                    id: newId,
                    full_name: name,
                    phone: phone,
                    password: pass,
                    user_type: selectedRole,
                    wallet_balance: selectedRole === 'driver' ? 100.00 : 0.00
                };

                const { error } = await supabaseClient.from('profiles').insert([newUser]);
                if (error) {
                    alert('خطأ أثناء التسجيل: ' + error.message);
                    return;
                }

                redirectUser(newUser);
            }
        }

        function resetToSelector() {
            document.getElementById('step-auth').classList.remove('active');
            document.getElementById('step-selector').classList.add('active');
            document.getElementById('user-phone').style.display = 'block';
            document.getElementById('user-phone').value = '';
            document.getElementById('extra-fields').style.display = 'none';
            document.getElementById('login-pass-field').style.display = 'none';
            document.getElementById('main-tagline').innerText = 'اختر وجهتك وطريقتك في الانطلاق';
            document.getElementById('action-btn').innerText = 'استمرار ⚡';
            foundUser = null;
            isNewAccountFlow = false;
        }

        function redirectUser(user) {
            localStorage.setItem('combo_user', JSON.stringify(user));
            if (user.user_type === 'driver') {
                window.location.href = 'captain.html';
            } else {
                window.location.href = 'passenger.html';
            }
        }
    </script>
</body>
</html>
