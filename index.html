<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة كومبو - الفخامة في التنقل</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; }
        body { 
            margin: 0; padding: 0; 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            background: #070b19; 
            background-image: radial-gradient(circle at 10% 20%, rgba(37, 99, 235, 0.15) 0%, transparent 40%),
                              radial-gradient(circle at 90% 80%, rgba(56, 189, 248, 0.1) 0%, transparent 40%);
            color: #fff; display: flex; align-items: center; justify-content: center; min-height: 100vh; 
        }
        .main-container { width: 100%; max-width: 420px; padding: 20px; margin: auto; }
        
        /* تصميم الزجاج الفاخر */
        .glass-card { 
            background: rgba(30, 41, 59, 0.7); 
            backdrop-filter: blur(16px); 
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08); 
            padding: 30px; border-radius: 24px; 
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            text-align: center; position: relative; overflow: hidden;
        }
        
        .brand-badge { 
            display: inline-block; background: rgba(56, 189, 248, 0.1); 
            color: #38bdf8; padding: 6px 16px; border-radius: 30px; 
            font-size: 13px; font-weight: 700; margin-bottom: 20px; 
            border: 1px solid rgba(56, 189, 248, 0.2);
        }

        /* تبديل علوي ذكي بين تسجيل الدخول وحساب جديد */
        .mode-switch {
            display: flex; background: rgba(15, 23, 42, 0.8);
            border-radius: 14px; padding: 4px; margin-bottom: 25px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .mode-btn {
            flex: 1; padding: 10px; border: none; background: transparent;
            color: #94a3b8; font-size: 14px; font-weight: 600; border-radius: 10px;
            cursor: pointer; transition: all 0.3s ease;
        }
        .mode-btn.active {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: #fff; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
        }

        .input-group { position: relative; margin-bottom: 15px; text-align: right; }
        .input-field { 
            width: 100%; padding: 14px 16px; border-radius: 12px; 
            background: rgba(15, 23, 42, 0.9); 
            border: 1px solid rgba(255, 255, 255, 0.08); 
            color: #fff; font-size: 15px; transition: all 0.3s ease; 
        }
        .input-field:focus { 
            border-color: #38bdf8; outline: none; 
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.25); 
            background: #0f172a;
        }

        .select-box { 
            width: 100%; padding: 14px 16px; border-radius: 12px; 
            background: rgba(15, 23, 42, 0.9); color: #fff; 
            border: 1px solid rgba(255, 255, 255, 0.08); font-size: 15px; 
        }

        .btn-primary { 
            background: linear-gradient(135deg, #38bdf8, #2563eb); 
            color: #fff; border: none; padding: 15px; width: 100%; 
            border-radius: 12px; font-weight: bold; cursor: pointer; 
            margin-top: 10px; font-size: 16px; 
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.4);
            transition: transform 0.2s, opacity 0.2s; 
        }
        .btn-primary:active { transform: scale(0.98); }
        
        .action-link { margin-top: 15px; font-size: 13px; color: #38bdf8; cursor: pointer; display: inline-block; }
        .action-link:hover { text-decoration: underline; }
        
        .form-section { display: none; }
        .form-section.active { display: block; }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="glass-card">
            <div class="brand-badge">منصة كومبو الذكية 🚗📦</div>
            
            <!-- أزرار التبديل الفاخرة بين الدخول والتسجيل -->
            <div class="mode-switch">
                <button class="mode-btn active" id="btn-login-tab" onclick="switchTab('login')">تسجيل الدخول</button>
                <button class="mode-btn" id="btn-register-tab" onclick="switchTab('register')">حساب جديد</button>
            </div>

            <!-- نموذج تسجيل الدخول -->
            <div id="section-login" class="form-section active">
                <div class="input-group">
                    <input type="tel" id="login-phone" class="input-field" placeholder="رقم الموبايل (01xxxxxxxxx)" maxlength="11" style="text-align: right; direction: ltr;">
                </div>
                <div class="input-group">
                    <input type="password" id="login-password" class="input-field" placeholder="كلمة المرور">
                </div>
                <button class="btn-primary" onclick="handleLogin()">دخول سريع 🚀</button>
                <span class="action-link" onclick="handleForgotPassword()">نسيت كلمة المرور؟ 🔑</span>
            </div>

            <!-- نموذج إنشاء حساب جديد -->
            <div id="section-register" class="form-section">
                <div class="input-group">
                    <input type="text" id="reg-name" class="input-field" placeholder="الاسم بالكامل">
                </div>
                <div class="input-group">
                    <input type="tel" id="reg-phone" class="input-field" placeholder="رقم الموبايل (01xxxxxxxxx)" maxlength="11" style="text-align: right; direction: ltr;">
                </div>
                <div class="input-group">
                    <input type="password" id="reg-password" class="input-field" placeholder="كلمة المرور الجديدة">
                </div>
                <div class="input-group">
                    <select id="reg-role" class="select-box">
                        <option value="rider">🚏 راكب (أرغب في التنقل والحجز)</option>
                        <option value="driver">🚗 كابتن (أرغب في قيادة وتوصيل الركاب)</option>
                    </select>
                </div>
                <button class="btn-primary" onclick="handleRegister()">إنشاء الحساب والانطلاق ⭐</button>
            </div>

        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://pmpzilqpcomoodaksbhw.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_tjYI1IKegMFywNCqGPdKng_fSGIe7Zx';
        let supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function switchTab(tab) {
            if (tab === 'login') {
                document.getElementById('btn-login-tab').classList.add('active');
                document.getElementById('btn-register-tab').classList.remove('active');
                document.getElementById('section-login').classList.add('active');
                document.getElementById('section-register').classList.remove('active');
            } else {
                document.getElementById('btn-register-tab').classList.add('active');
                document.getElementById('btn-login-tab').classList.remove('active');
                document.getElementById('section-register').classList.add('active');
                document.getElementById('section-login').classList.remove('active');
            }
        }

        async function handleLogin() {
            const phone = document.getElementById('login-phone').value.trim();
            const password = document.getElementById('login-password').value.trim();

            const phoneRegex = /^01[0125][0-9]{8}$/;
            if (!phoneRegex.test(phone)) {
                alert('يرجى إدخال رقم موبايل مصري صحيح مكون من 11 رقماً.');
                return;
            }
            if (!password) {
                alert('يرجى إدخال كلمة المرور.');
                return;
            }

            let { data: user, error } = await supabaseClient.from('profiles').select('*').eq('phone', phone).single();

            if (error || !user) {
                alert('رقم الموبايل غير مسجل لدينا، يرجى إنشاء حساب جديد.');
                return;
            }

            if (user.password && user.password !== password) {
                alert('كلمة المرور غير صحيحة!');
                return;
            }

            redirectUser(user);
        }

        async function handleRegister() {
            const name = document.getElementById('reg-name').value.trim();
            const phone = document.getElementById('reg-phone').value.trim();
            const password = document.getElementById('reg-password').value.trim();
            const role = document.getElementById('reg-role').value;

            if (!name || !password) {
                alert('يرجى إكمال جميع الحقول المطلوبة.');
                return;
            }

            const phoneRegex = /^01[0125][0-9]{8}$/;
            if (!phoneRegex.test(phone)) {
                alert('يرجى إدخال رقم موبايل مصري صحيح مكون من 11 رقماً.');
                return;
            }

            // فحص هل الرقم موجود مسبقاً
            let { data: existingUser } = await supabaseClient.from('profiles').select('*').eq('phone', phone).single();
            if (existingUser) {
                alert('رقم الموبايل مسجل مسبقاً، قم بتسجيل الدخول مباشرة.');
                switchTab('login');
                document.getElementById('login-phone').value = phone;
                return;
            }

            const newId = crypto.randomUUID();
            const newUserObj = {
                id: newId,
                full_name: name,
                phone: phone,
                password: password,
                user_type: role,
                wallet_balance: role === 'driver' ? 100.00 : 0.00
            };

            const { error } = await supabaseClient.from('profiles').insert([newUserObj]);
            if (error) {
                alert('خطأ أثناء التسجيل: ' + error.message);
                return;
            }

            alert('تم إنشاء الحساب بنجاح! أهلاً بك في كومبو.');
            redirectUser(newUserObj);
        }

        async function handleForgotPassword() {
            const phone = document.getElementById('login-phone').value.trim();
            if (!phone) {
                alert('يرجى كتابة رقم الموبايل أولاً في خانة تسجيل الدخول ثم اضغط على نسيت كلمة المرور.');
                return;
            }

            let { data: user } = await supabaseClient.from('profiles').select('*').eq('phone', phone).single();
            if (!user) {
                alert('هذا الرقم غير مسجل في النظام.');
                return;
            }

            const newPass = prompt('أدخل كلمة المرور الجديدة لحسابك:');
            if (!newPass) return;

            const { error } = await supabaseClient.from('profiles').update({ password: newPass }).eq('id', user.id);
            if (error) {
                alert('خطأ في التحديث: ' + error.message);
                return;
            }

            alert('تم تحديث كلمة المرور بنجاح، يمكنك الدخول بها الآن!');
            document.getElementById('login-password').value = newPass;
        }

        function redirectUser(user) {
            localStorage.setItem('combo_user', JSON.stringify(user));
            if (user.user_type === 'driver') {
                window.location.href = 'captain.html';
            } else {
                window.location.href = 'passenger.html';
            }
        }
    </script>
</body>
</html>
