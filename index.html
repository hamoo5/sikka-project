<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>كومبو - تسجيل الدخول</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; font-family: Tahoma, sans-serif; }
        body { background: #121212; color: #fff; margin: 0; padding: 0; direction: rtl; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .login-card { background: #1e1e1e; padding: 24px; border-radius: 16px; width: 90%; max-width: 400px; border: 1px solid #333; text-align: center; }
        .role-selector { display: flex; gap: 10px; margin-bottom: 20px; }
        .role-btn { flex: 1; padding: 12px; background: #2a2a2a; border: 2px solid #444; color: #aaa; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 14px; }
        .role-btn.active { border-color: #00e676; background: #1a332c; color: #fff; }
        input { width: 100%; padding: 14px; margin-bottom: 15px; background: #2a2a2a; border: 1px solid #444; color: #fff; border-radius: 8px; font-size: 15px; text-align: center; }
        label { font-size: 13px; color: #bbb; display: block; margin-bottom: 8px; text-align: right; }
        .btn { background: #00875a; color: #fff; border: none; padding: 14px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; width: 100%; }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>🚗 تطبيق كومبو</h2>
        <p style="color: #aaa; font-size: 13px; margin-bottom: 20px;">اختر نوع الحساب لتسجيل الدخول</p>
        
        <div class="role-selector">
            <button class="role-btn active" id="btnPassenger" onclick="setRole('passenger')">راكب</button>
            <button class="role-btn" id="btnCaptain" onclick="setRole('captain')">كابتن</button>
        </div>

        <label>رقم الهاتف المحمول:</label>
        <input type="tel" id="userPhone" placeholder="01xxxxxxxxx" maxlength="11" />

        <button class="btn" onclick="handleLogin()">دخول المنظومة ➔</button>
    </div>

    <script>
        const SUPABASE_URL = "https://pmpzilqpcomoodaksbhw.supabase.co";
        const SUPABASE_KEY = "sb_publishable_tjYI1IKegMFywNCqGPdKng_fSGIe7Zx";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let selectedRole = 'passenger';

        function setRole(role) {
            selectedRole = role;
            if (role === 'passenger') {
                document.getElementById('btnPassenger').classList.add('active');
                document.getElementById('btnCaptain').classList.remove('active');
            } else {
                document.getElementById('btnCaptain').classList.add('active');
                document.getElementById('btnPassenger').classList.remove('active');
            }
        }

        async function handleLogin() {
            const phone = document.getElementById('userPhone').value.trim();
            if (!phone || phone.length < 11) {
                alert('الرجاء إدخال رقم هاتف صحيح مكون من 11 رقماً');
                return;
            }

            if (selectedRole === 'passenger') {
                // حفظ رقم الراكب محلياً والانتقال لصفحة الراكب
                localStorage.setItem('passenger_phone', phone);
                window.location.href = 'passenger.html';
            } else {
                // التحقق من جدول الكباتن أو حفظه والانتقال لصفحة الكابتن
                localStorage.setItem('captain_phone', phone);
                window.location.href = 'captain.html';
            }
        }
    </script>
</body>
</html>
